/* ============================ 台面结构层 ============================
   按原版把两条"能读出这是弹球台"的骨架补出来：
     ① 顶部环道 (orbit)：球从发射道顶端出来，沿穹顶内侧绕一圈再从左侧落下。
        原版这里是一条有内外两侧壁的环形槽，槽上每隔一段有横档和灯座。
     ② 发射道 (shooter lane)：不是一根霓虹线，而是一条有枕木横档的直筒，
        顶端有一个转向帽把球拐进环道，左侧还有一条并行的窄复道。
   全是静态图形，烘成一张缓存层，逐帧只做一次贴图。 */
let boardStructCache = null;
function drawBoardStructure(){
  if (!boardStructCache) boardStructCache = renderLayerToCache(W, H, drawBoardStructureRaw);
  if (boardStructCache) blitLayer(boardStructCache); else drawBoardStructureRaw();
}
function drawBoardStructureRaw(){
  ctx.save();

  /* ---------- ① 顶部环道 ---------- */
  const cx = ARC.cx, cy = ARC.cy;
  const rOut = ARC.r + 3, rIn = ARC.r - 14;      // 槽宽 17，球（r=9）正好嵌在里面
  const a0 = Math.PI * 0.985, a1 = Math.PI * 2.015;

  // 槽底：径向渐变，外沿更暗、内侧偏亮，读作"有深度的沟"
  ctx.beginPath();
  ctx.arc(cx, cy, rOut, a0, a1);
  ctx.arc(cx, cy, rIn, a1, a0, true);
  ctx.closePath();
  const rg = ctx.createRadialGradient(cx, cy, rIn, cx, cy, rOut);
  rg.addColorStop(0, 'rgba(8,14,32,.62)');
  rg.addColorStop(0.55, 'rgba(24,42,84,.72)');
  rg.addColorStop(1, 'rgba(6,10,24,.90)');
  ctx.fillStyle = rg;
  ctx.fill();

  // 横档：沿轨道每 0.075 rad 一条，模拟原版木轨的枕木
  const stepA = 0.092;
  for (let a = a0 + stepA; a < a1 - stepA; a += stepA){
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * rIn, cy + Math.sin(a) * rIn);
    ctx.lineTo(cx + Math.cos(a) * rOut, cy + Math.sin(a) * rOut);
    ctx.strokeStyle = 'rgba(4,7,18,.55)';
    ctx.lineWidth = 2.1;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(150,190,250,.16)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  // 内壁：一条亮棱 + 一条暗沟
  ctx.beginPath(); ctx.arc(cx, cy, rIn, a0, a1);
  ctx.strokeStyle = 'rgba(6,10,22,.9)'; ctx.lineWidth = 3.4; ctx.stroke();
  ctx.strokeStyle = 'rgba(120,164,230,.42)'; ctx.lineWidth = 1.1; ctx.stroke();
  // 外壁亮棱（压在墙体之上，保住原版那条霓虹边）
  ctx.beginPath(); ctx.arc(cx, cy, rOut, a0, a1);
  ctx.strokeStyle = 'rgba(150,205,255,.34)'; ctx.lineWidth = 1.4; ctx.stroke();

  // 灯座：每 0.22 rad 一个小圆，静态暗灯（亮起由任务靶/星道灯自己画）
  for (let a = a0 + 0.16; a < a1 - 0.1; a += 0.22){
    const lx = cx + Math.cos(a) * (rIn + 3.4);
    const ly = cy + Math.sin(a) * (rIn + 3.4);
    ctx.beginPath(); ctx.arc(lx, ly, 2.1, 0, 6.2832);
    ctx.fillStyle = 'rgba(168,205,255,.26)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(8,14,30,.8)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  /* ---------- ② 发射道 ---------- */
  const LX0 = 413, LX1 = 455, LY0 = 372, LY1 = 740;

  // 道床：竖向金属渐变（压暗一档，别抢台面）
  const lg = ctx.createLinearGradient(LX0, 0, LX1, 0);
  lg.addColorStop(0,    'rgba(8,12,26,.96)');
  lg.addColorStop(0.26, 'rgba(22,36,68,.94)');
  lg.addColorStop(0.52, 'rgba(36,56,98,.90)');
  lg.addColorStop(0.78, 'rgba(20,32,62,.94)');
  lg.addColorStop(1,    'rgba(6,10,22,.97)');
  ctx.fillStyle = lg;
  ctx.beginPath();
  ctx.moveTo(LX0, LY0);
  ctx.lineTo(LX1, LY0);
  ctx.lineTo(LX1, LY1);
  ctx.lineTo(LX0, LY1);
  ctx.closePath();
  ctx.fill();

  /* 道床纹理：原版是竖向木纹，不是横档。
     这里用极淡的竖线做木纹，横档会读成"梯子"，与弹球台不符。 */
  for (let k = 1; k <= 9; k++){
    const lx = LX0 + (LX1 - LX0) * k / 10;
    ctx.strokeStyle = k % 2 ? 'rgba(160,198,250,.055)' : 'rgba(4,8,18,.30)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(lx, LY0 + 3); ctx.lineTo(lx, LY1 - 3); ctx.stroke();
  }
  // 两道极淡的横向接缝，读作"道床由几段拼成"
  for (const yy of [LY0 + 120, LY0 + 244]){
    ctx.fillStyle = 'rgba(4,8,18,.35)';
    ctx.fillRect(LX0 + 1, yy, LX1 - LX0 - 2, 1.6);
  }

  // 复道：发射道靠台面一侧（左边）一条窄的并行道，用短横条暗示
  ctx.fillStyle = 'rgba(6,11,24,.55)';
  ctx.fillRect(LX0 + 1, LY0 + 6, 5, LY1 - LY0 - 12);
  for (let y = LY0 + 18; y < LY1 - 10; y += 18){
    ctx.fillStyle = 'rgba(110,150,210,.30)';
    ctx.fillRect(LX0 + 1, y, 5, 2);
  }

  // 两侧道牙：内牙（靠台面）亮，外牙（贴外墙）暗
  ctx.strokeStyle = 'rgba(120,160,220,.55)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(LX0 + 0.5, LY0); ctx.lineTo(LX0 + 0.5, LY1); ctx.stroke();
  ctx.strokeStyle = 'rgba(60,86,136,.55)';
  ctx.beginPath(); ctx.moveTo(LX1 - 0.5, LY0); ctx.lineTo(LX1 - 0.5, LY1); ctx.stroke();

  // 顶端转向帽：球到这里被拐进环道。像原版那样是"道口的弧形盖板"，
  // 不是霓虹环——所以主体用深色实心，只留一道细青棱。
  ctx.beginPath();
  ctx.arc(434, LY0 + 3, 19, Math.PI * 0.98, Math.PI * 2.02);
  ctx.strokeStyle = 'rgba(5,9,20,.95)';
  ctx.lineWidth = 14;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(34,52,88,.95)';
  ctx.lineWidth = 9;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(94,231,255,.40)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(200,240,255,.42)';
  ctx.lineWidth = 0.9;
  ctx.stroke();

  ctx.restore();
}

/* 发射口单向闸门（原版 one-way gate）：铰接在外墙的一根细钢条。
   平时斜横在道口挡住回落球；发射时绕铰链翻起贴墙、球过后缓缓落回。
   必须画在坡道高架**之后**——它装在坡道路面上方，画早了会被路面切成两块碎片。 */
function drawGate(){
  const HX = GATE.bx, HY = GATE.by;                 // 铰链：外墙端
  const closedA = Math.atan2(GATE.ay - HY, GATE.ax - HX);
  const openA   = -Math.PI / 2 + 0.12;              // 翻起后贴在外墙内侧，不穿出墙体
  const t0 = state.hatchT || 0;
  const t = t0 < 1 ? 1 - (1 - t0) * (1 - t0) : 1;   // easeOut
  const len = Math.sqrt((GATE.ax - HX) * (GATE.ax - HX) + (GATE.ay - HY) * (GATE.ay - HY));
  const ang = closedA + (openA - closedA) * t;
  const tipX = HX + Math.cos(ang) * len, tipY = HY + Math.sin(ang) * len;
  ctx.save();
  ctx.globalAlpha = 1 - t * 0.55;
  // 落影
  ctx.strokeStyle = 'rgba(0,0,0,.38)'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(HX + 2, HY + 4); ctx.lineTo(tipX + 2, tipY + 4); ctx.stroke();
  // 钢杆：暗底 + 亮芯 + 白高光棱边，与装甲墙同一套材质语言
  const g = ctx.createLinearGradient(HX, HY, tipX, tipY);
  g.addColorStop(0, '#2b3a5c'); g.addColorStop(0.5, '#8fa5cf'); g.addColorStop(1, '#2b3a5c');
  ctx.strokeStyle = '#0b1120'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(HX, HY); ctx.lineTo(tipX, tipY); ctx.stroke();
  ctx.strokeStyle = g; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(HX, HY); ctx.lineTo(tipX, tipY); ctx.stroke();
  ctx.strokeStyle = 'rgba(190,215,255,.8)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(HX, HY - 1.5); ctx.lineTo(tipX, tipY - 1.5); ctx.stroke();
  // 关闭状态：杆面一道青色警戒微光（呼吸）
  if (t < 0.2){
    ctx.globalAlpha = (0.22 + 0.18 * Math.sin(state.time * 6)) * (1 - t / 0.2);
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 2;
    ctx.shadowColor = C.cyan; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.moveTo(HX, HY); ctx.lineTo(tipX, tipY); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  // 铰链圆盘 + 铆钉
  ctx.globalAlpha = 1 - t * 0.3;
  ctx.fillStyle = '#3a4a70';
  ctx.beginPath(); ctx.arc(HX, HY, 4, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(160,195,240,.6)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#c9d6ee';
  ctx.beginPath(); ctx.arc(HX, HY, 1.4, 0, 6.2832); ctx.fill();
  ctx.restore();
}

/* ============================ 排水区 (drain bay) ============================
   照原版结构：挡板下方是一块紫色放射星爆（"能量井"），正中一个排水孔，
   两侧各一块深色铭牌三角板。原版这块是台面最能读出"这是弹球台"的图形，
   之前只有一片黑色渐变，所以整块显得空。 */
function drawDrainZone(){
  const D = {x:240, y:768, r:80};
  ctx.save();

  // ① 底部压暗：让星爆从暗场里浮出来
  const g = ctx.createLinearGradient(0, 700, 0, 800);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.45, 'rgba(3,5,14,.55)');
  g.addColorStop(1, 'rgba(2,3,10,.92)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 700, W, 100);

  // ② 紫色放射星爆：11 条长短交替的尖角，绕排水孔一圈
  ctx.save();
  ctx.translate(D.x, D.y);
  ctx.beginPath();
  const N = 11;
  for (let i = 0; i < N; i++){
    const a = -Math.PI / 2 + (i / N) * Math.PI * 2;
    const a2 = -Math.PI / 2 + ((i + 0.5) / N) * Math.PI * 2;
    const a3 = -Math.PI / 2 + ((i + 1) / N) * Math.PI * 2;
    const len = (i % 2 ? D.r * 0.72 : D.r) * (1 + 0.06 * Math.sin(state.time * 1.7 + i));
    if (i === 0) ctx.moveTo(Math.cos(a) * 16, Math.sin(a) * 16);
    ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
    ctx.quadraticCurveTo(Math.cos(a2) * len * 0.46, Math.sin(a2) * len * 0.46,
                         Math.cos(a3) * 16, Math.sin(a3) * 16);
  }
  ctx.closePath();
  const sg = ctx.createRadialGradient(0, 0, 8, 0, 0, D.r);
  sg.addColorStop(0, 'rgba(150,116,220,.86)');
  sg.addColorStop(0.45, 'rgba(104,74,170,.62)');
  sg.addColorStop(1, 'rgba(44,28,86,0)');
  ctx.fillStyle = sg;
  ctx.fill();
  // 星爆边缘一圈极细亮线，读作"发光等离子体"
  ctx.strokeStyle = 'rgba(186,152,255,.30)';
  ctx.lineWidth = 1.1;
  ctx.stroke();
  ctx.restore();

  // ③ 排水孔：深黑椭圆 + 内侧一圈冷光，球从这里掉下去
  ctx.beginPath();
  /* 孔口做到 18x9.5：中央挡柱（宽 15）升起时四周仍留一圈暗环，
     读作"柱子插在孔里"。孔做 15 刚好被柱子填满，就只剩一根悬空的杆。 */
  ctx.ellipse(D.x, D.y + 4, 18, 9.5, 0, 0, 6.2832);
  const hg = ctx.createRadialGradient(D.x, D.y + 4, 1, D.x, D.y + 4, 15);
  hg.addColorStop(0, 'rgba(0,0,0,1)');
  hg.addColorStop(0.7, 'rgba(4,6,16,.98)');
  hg.addColorStop(1, 'rgba(40,30,70,.6)');
  ctx.fillStyle = hg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(150,120,220,.42)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* ④ 两侧铭牌三角板（原版 CINEMATRONICS / MAXIS 的位置）。
     右板必须止步于发射道内牙（x=413），否则会被道床整块盖住。 */
  const plate = function(pts){
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    const pg = ctx.createLinearGradient(pts[0][0], 730, pts[1][0], 800);
    pg.addColorStop(0, 'rgba(22,30,54,.96)');
    pg.addColorStop(1, 'rgba(9,13,26,.98)');
    ctx.fillStyle = pg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(96,132,196,.45)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // 斜向压纹
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.clip();
    ctx.strokeStyle = 'rgba(120,160,225,.07)';
    ctx.lineWidth = 1;
    for (let k = 0; k < 7; k++){
      ctx.beginPath(); ctx.moveTo(pts[0][0] + k * 18, 800); ctx.lineTo(pts[0][0] + 60 + k * 18, 726); ctx.stroke();
    }
    ctx.restore();
  };
  plate([[14, 730], [14, 800], [104, 800], [56, 730]]);          // 左
  plate([[352, 730], [352, 800], [410, 800], [382, 730]]);       // 右（避开 x>=413 的发射道）

  // ⑤ 铭牌文字
  ctx.save();
  ctx.font = '700 8px ui-monospace,Menlo,monospace';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(196,168,110,.62)';
  ctx.fillText('PINBALL  STAR', 20, 780);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(150,185,240,.50)';
  ctx.fillText('MAXIS', 404, 780);
  ctx.restore();

  ctx.restore();
}

// Inlane guides as data, so the slingshots can mount onto them visually.
const INLANES = [
  {ax:24,  ay:636, bx:140, by:700},
  {ax:412, ay:636, bx:340, by:700}
];

function nearestOnSeg(px, py, s){
  const abx = s.bx - s.ax, aby = s.by - s.ay;
  const L2 = abx*abx + aby*aby || 1;
  let t = ((px - s.ax) * abx + (py - s.ay) * aby) / L2;
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  return {x: s.ax + abx * t, y: s.ay + aby * t};
}

function drawSlings(){
  for (let i = 0; i < SLINGS.length; i++){
    const s = SLINGS[i];
    const pop = s.pop;

    // mount post: from the capsule's lower end straight onto the inlane guide
    const foot = nearestOnSeg(s.x2, s.y2, INLANES[i]);

    ctx.save();
    ctx.lineCap = 'round';

    /* 支脚只是"把胶囊托在导轨上"的一小段支架，**不走到导轨**：
       原来从胶囊一路连到 inlane 上（12px 深紫实线），右侧窄口只有 25px，
       那条线正好横在通道中间，看起来就是一道把路封死的墙。
       现在只画 40% 长度 + 末端一颗螺栓，读作支撑，不读作拦路。 */
    const bx = s.x2 + (foot.x - s.x2) * 0.40;
    const by = s.y2 + (foot.y - s.y2) * 0.40;
    ctx.strokeStyle = 'rgba(46,34,96,.55)';
    ctx.lineWidth = 4.0;
    ctx.beginPath(); ctx.moveTo(s.x2, s.y2); ctx.lineTo(bx, by); ctx.stroke();
    ctx.strokeStyle = 'rgba(150,124,225,.40)';
    ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(s.x2, s.y2); ctx.lineTo(bx, by); ctx.stroke();
    ctx.fillStyle = 'rgba(122,96,190,.55)';
    ctx.beginPath(); ctx.arc(bx, by, 2.4, 0, 6.2832); ctx.fill();

    // base bolt where the post meets the guide
    ctx.fillStyle = 'rgba(150,120,235,.5)';
    ctx.beginPath(); ctx.arc(foot.x, foot.y, 4.2, 0, 6.2832); ctx.fill();

    ctx.shadowColor = 'rgba(190,145,255,' + (0.45 + pop * 0.35) + ')';
    ctx.shadowBlur = 22 + pop * 26;
    ctx.strokeStyle = 'rgba(150,110,240,' + (0.20 + pop * 0.25) + ')';
    ctx.lineWidth = s.r * 2 + 12;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(78,52,152,.95)';
    ctx.lineWidth = s.r * 2;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();

    ctx.shadowColor = 'rgba(196,150,255,' + (0.75 + pop * 0.25) + ')';
    ctx.shadowBlur = 14 + pop * 22;
    ctx.strokeStyle = 'rgba(188,148,255,' + (0.90 + pop * 0.10) + ')';
    ctx.lineWidth = s.r * 2 - 3;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,248,255,' + (0.70 + pop * 0.30) + ')';
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    ctx.restore();
  }
}

function drawLaneLamps(){
  const hot = state.bumpersHot;
  const lvC = BUMPER_LV_C[state.bumperLv];
  for (let i = 0; i < 3; i++){
    const L = LANE_LAMPS[i];
    const on = state.lanes[i];
    const col = on ? lvC : null;
    ctx.save();
    ctx.beginPath();
    ctx.arc(L.x, L.y, 5.5, 0, 6.2832);
    if (col){
      ctx.fillStyle = col;
      ctx.shadowColor = col;
      ctx.shadowBlur = 13;
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = 'rgba(6,12,30,.9)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,170,255,.45)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
    ctx.restore();
  }
  if (hot || state.bumperLv > 0){
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 8px ui-monospace,Menlo,monospace';
    ctx.letterSpacing = '1.6px';
    ctx.fillStyle = hot ? 'rgba(255,159,67,.9)' : lvC;
    ctx.shadowColor = hot ? 'rgba(255,159,67,.7)' : lvC;
    ctx.shadowBlur = 9;
    ctx.fillText(hot ? 'HOT BUMPERS' : 'BUMPER LV.' + state.bumperLv, 240, 214);
    ctx.letterSpacing = '0px';
    ctx.restore();
  }
}

function drawMissionTargets(){
  // 灯带轨道: a thin luminous track along the dome arc connecting the three lamps —
  // mission selection lives ON the top edge like the original, not in standalone pods
  const active = (state.selected >= 0 || state.mission);
  ctx.save();
  ctx.strokeStyle = active ? 'rgba(255,212,94,.55)' : 'rgba(140,180,255,.20)';
  ctx.lineWidth = active ? 2.4 : 1.4;
  if (active){
    ctx.shadowColor = 'rgba(255,212,94,.6)';
    ctx.shadowBlur = 9;
  }
  ctx.beginPath();
  ctx.arc(ARC.cx, ARC.cy, ARC.r, -0.50, -2.40, true);
  ctx.stroke();
  ctx.restore();

  for (let i = 0; i < MISSION_TARGETS.length; i++){
    const t = MISSION_TARGETS[i];
    const pop = t.pop;
    const sel = (state.selected === i);
    const run = (state.mission && state.mission.slot === i);
    const def = missionSlots()[i];
    const r = 6.5 * (1 + pop * 0.35) + (sel || run ? 1.5 : 0);

    ctx.save();
    // lamp glow hugging the rail
    const g = ctx.createRadialGradient(t.x, t.y, 1, t.x, t.y, r * 3.4);
    g.addColorStop(0, 'rgba(255,255,255,' + (0.10 + pop * 0.5 + (sel || run ? 0.22 : 0)) + ')');
    g.addColorStop(0.42, t.c + '66');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(t.x, t.y, r * 3.4, 0, 6.2832);
    ctx.fill();

    // the lamp bead itself
    ctx.beginPath();
    ctx.arc(t.x, t.y, r, 0, 6.2832);
    if (sel || run){
      ctx.fillStyle = t.c;
      ctx.shadowColor = t.c;
      ctx.shadowBlur = 18 + pop * 14;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.beginPath();
      ctx.arc(t.x, t.y, r * 0.4, 0, 6.2832);
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(8,14,32,.94)';
      ctx.fill();
      ctx.strokeStyle = t.c;
      ctx.globalAlpha = 0.75;
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // slot number just inside the rail
    ctx.font = '700 8px ui-monospace,Menlo,monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = t.c;
    ctx.globalAlpha = (sel || run) ? 1 : 0.8;
    const nx = t.x + (ARC.cx - t.x) * 0.10;
    const ny = t.y + (ARC.cy - t.y) * 0.10;
    ctx.fillText(String(i + 1), nx, ny);

    // the mission this slot holds, readable only when selected/running
    if (def && (sel || run)){
      ctx.globalAlpha = 0.95;
      ctx.font = '700 8px ui-monospace,Menlo,monospace';
      ctx.fillStyle = t.c;
      ctx.fillText(def.zh, t.x, t.y + 20);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

/* While a mission stage is live, pulse a marker + name on the exact spot to hit, so
   the player never has to guess where "stage 2" lives. */
/* 物件常驻小名：文字与位置全静态，预渲染成层逐帧贴图（省每帧 10 次 fillText/measureText）。 */
let spotNamesCache = null;
function drawSpotNames(){
  if (!spotNamesCache) spotNamesCache = renderLayerToCache(CW, CH, drawSpotNamesRaw);
  if (spotNamesCache) blitLayer(spotNamesCache, undefined, CH); else drawSpotNamesRaw();
}
function drawSpotNamesRaw(){
  ctx.save();
  ctx.font = '600 7px ui-monospace,Menlo,monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const put = function(id, dx, dy, alpha){
    const s = SPOTS[id];
    if (!s) return;
    // 二层平台占用的区域不再画点位名，避免与甲板文字打架（按 poly 包围盒）
    const sx2 = s.x + dx, sy2 = s.y + dy - DECK2.z;
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    const p = DECK2.poly;
    for (let q=0;q<p.length;q++){ x0=Math.min(x0,p[q].x);x1=Math.max(x1,p[q].x);y0=Math.min(y0,p[q].y);y1=Math.max(y1,p[q].y); }
    if (sx2 > x0 - 6 && sx2 < x1 + 6 && sy2 > y0 - 6 && sy2 < y1 + 6) return;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(160,195,240,.9)';
    ctx.fillText(s.name, s.x + dx, s.y + dy);
  };
  put('b0', 0, 40, 0.38);
  put('b1', 0, 40, 0.38);
  put('b2', 0, 40, 0.38);
  put('s0', -2, 26, 0.34);
  put('s1', 2, 26, 0.34);
  put('p0', 0, 22, 0.34);
  put('p1', -26, 6, 0.34);   // 右翼柱标签左移：原位会被落靶翼板的顶端压住
  put('w0', 0, -26, 0.42);
  put('w1', 0, -26, 0.42);
  put('w2', 0, -26, 0.42);
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---- 原版补全区：落靶 / 危险带 / 中央挡柱 / 超空间 ---- */
/* 落靶衬板：原版那种"从发射区旁长出来的楔形结构"，用这台机器的霓虹语言画。
   形状是**尖角朝场地的三角形**（内缘贴发射道内墙，顶点凸出 30px），
   两条斜边上各压一条荧光绿靶条。不用原版的橙色木纹和红边——那是木质台面材质。
   —— 顶点只凸 30px：再大就把右侧走廊堵死（上一版做成等边三角就是这么错的）。 */
function drawDropBank(){
  const B = DROP_BANK;
  const P0 = B.T0, P1 = B.T1, P2 = B.T2;

  ctx.save();
  ctx.lineJoin = 'round';

  /* ① 投影：三角在墙面上投下的一片暗影 */
  ctx.beginPath();
  ctx.moveTo(P0.x + 4, P0.y + 8);
  ctx.lineTo(P1.x + 6, P1.y + 10);
  ctx.lineTo(P2.x + 4, P2.y + 8);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,0,0,.32)';
  ctx.fill();

  /* ② 顶面：内缘亮、尖角暗——凸起的板朝上受光多，靠近尖角处是侧壁阴影 */
  const topG = ctx.createLinearGradient(B.WX, 0, P1.x, 0);
  topG.addColorStop(0,    'rgba(92,112,154,.99)');
  topG.addColorStop(0.50, 'rgba(66,84,124,.99)');
  topG.addColorStop(1,    'rgba(40,52,84,.99)');
  ctx.beginPath();
  ctx.moveTo(P0.x, P0.y);
  ctx.lineTo(P1.x, P1.y);
  ctx.lineTo(P2.x, P2.y);
  ctx.closePath();
  ctx.fillStyle = topG;
  ctx.fill();

  /* ③ 受光斜面：两条斜边外侧各一条青色带 —— 这是整块的"立体高度" */
  const face = function(P, Q){
    const dx = Q.x - P.x, dy = Q.y - P.y;
    const L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L;
    const FW = 3.6;
    ctx.beginPath();
    ctx.moveTo(P.x, P.y);
    ctx.lineTo(Q.x, Q.y);
    ctx.lineTo(Q.x + nx * FW, Q.y + ny * FW);
    ctx.lineTo(P.x + nx * FW, P.y + ny * FW);
    ctx.closePath();
    const g = ctx.createLinearGradient(P.x, P.y, P.x + nx * FW, P.y + ny * FW);
    g.addColorStop(0,    'rgba(20,44,82,.96)');
    g.addColorStop(0.5,  'rgba(64,136,196,.94)');
    g.addColorStop(1,    'rgba(128,204,244,.80)');
    ctx.fillStyle = g;
    ctx.fill();
    // 棱线：暗底 + 青 + 亮青
    ctx.beginPath();
    ctx.moveTo(P.x + nx * FW, P.y + ny * FW);
    ctx.lineTo(Q.x + nx * FW, Q.y + ny * FW);
    ctx.strokeStyle = 'rgba(6,12,26,.88)';
    ctx.lineWidth = 2.2;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(196,240,255,.66)';
    ctx.lineWidth = 1;
    ctx.stroke();
  };
  face(P0, P1);
  face(P1, P2);

  /* ⑤ 整体青棱边 */
  ctx.beginPath();
  ctx.moveTo(P0.x, P0.y);
  ctx.lineTo(P1.x, P1.y);
  ctx.lineTo(P2.x, P2.y);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(6,12,26,.94)';
  ctx.lineWidth = 2.4;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(94,200,255,.82)';
  ctx.lineWidth = 1.3;
  ctx.stroke();

  /* ⑥ 内缘一道极淡亮线：把衬板和发射道墙面分开 */
  ctx.beginPath();
  ctx.moveTo(P0.x - 1.2, P0.y);
  ctx.lineTo(P2.x - 1.2, P2.y);
  ctx.strokeStyle = 'rgba(140,190,240,.30)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* ⑦ 三条靶条：水平横条，骑在斜棱上（整台唯一的绿，"该打这里"一眼认出） */
  const TW = 18, TH = 6.4;
  for (let i = 0; i < B.t.length; i++){
    const tg = B.t[i], down = B.down[i], pop = B.pop[i];
    ctx.save();
    ctx.translate(tg.x, tg.y);
    if (down){
      // 已击落：靶条压平贴回棱面，只剩暗槽 + 槽口高光
      ctx.fillStyle = 'rgba(10,22,14,.92)';
      ctx.fillRect(-TW / 2, -TH / 2 + 1.2, TW, TH - 2.4);
      ctx.strokeStyle = 'rgba(110,170,130,.48)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-TW / 2 + 0.5, -TH / 2 + 1.2, TW - 1, TH - 2.4);
      ctx.fillStyle = 'rgba(160,240,180,.26)';
      ctx.fillRect(-TW / 2 + 1.4, -TH / 2 + 1.4, TW - 2.8, 0.9);
    } else {
      const g2 = ctx.createLinearGradient(0, -TH / 2, 0, TH / 2);
      g2.addColorStop(0,    '#c8ff8a');
      g2.addColorStop(0.38, '#8ce85c');
      g2.addColorStop(0.76, '#4faa2c');
      g2.addColorStop(1,    '#35701c');
      ctx.fillStyle = g2;
      if (pop > 0.05){
        ctx.shadowColor = 'rgba(140,232,92,.95)';
        ctx.shadowBlur = pop * 16;
      }
      ctx.fillRect(-TW / 2, -TH / 2, TW, TH);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(14,30,8,.92)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-TW / 2, -TH / 2, TW, TH);
      ctx.fillStyle = 'rgba(22,44,10,.50)';
      ctx.fillRect(-TW / 2 + 2, -0.5, TW - 4, 1);
      ctx.fillStyle = 'rgba(30,58,14,.85)';
      ctx.fillRect(-TW / 2, TH / 2, TW, 1.5);
      /* 靶座：靶条右端一块暗色承托，把"浮空"钉回棱上 */
      ctx.fillStyle = 'rgba(10,18,34,.92)';
      ctx.fillRect(TW / 2 - 1, -TH / 2 - 1.6, 5.5, TH + 3.2);
      ctx.strokeStyle = 'rgba(120,190,240,.55)';
      ctx.lineWidth = 0.9;
      ctx.strokeRect(TW / 2 - 1, -TH / 2 - 1.6, 5.5, TH + 3.2);
    }
    ctx.restore();
  }

  ctx.restore();
}

function drawHazards(){
  ctx.save();
  for (let k = 0; k < HAZARDS.length; k++){
    const hz = HAZARDS[k];
    // 导轨本体：沿三盏灯连成一条短轨
    ctx.strokeStyle = 'rgba(96,130,190,.28)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(hz.x[0] - 6, hz.y[0] - 6);
    ctx.lineTo(hz.x[2] + 6, hz.y[2] + 6);
    ctx.stroke();
    for (let i = 0; i < 3; i++){
      const x = hz.x[i], y = hz.y[i], lit = hz.lit[i], pop = hz.pop[i];
      ctx.beginPath(); ctx.arc(x, y, 5.0, 0, 6.2832);
      if (lit){
        ctx.fillStyle = C.cyan;
        ctx.shadowColor = C.cyan;
        ctx.shadowBlur = 9 + pop * 14;
        ctx.fill();
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = 'rgba(10,18,36,.95)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(110,150,210,.55)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}

/* 中央挡柱：从排水孔里升起。
   up=0 完全缩回（孔里什么都看不见，只有那个暗椭圆）；
   up=1 升到最高（柱顶高出孔口 22px）。
   画法顺序很重要：先把孔口重新压暗一遍（柱子挡住了原本的孔），
   再画柱子，最后在孔口补一圈"被顶开的光"——这样才读作"从洞里顶出来"。 */
function drawCenterPost(){
  const p = CENTER_POST;
  if (p.up <= 0.02) return;
  /* 升起高度 36：柱顶到 y≈738，正好顶到两挡板尖端之间，
     挡住中央直落 —— 这才是中央挡柱该起的作用（原来只升 22，柱顶还在孔里）。 */
  const lift = 36 * p.up;
  const topY = p.y + 2 - lift;          // 孔口略低于中心
  ctx.save();

  /* ① 孔口内侧阴影：柱子撑满了孔，孔壁被挡住的暗色 */
  ctx.beginPath(); ctx.ellipse(p.x, p.y + 2, p.holeR, p.holeRy, 0, 0, 6.2832);
  ctx.fillStyle = 'rgba(2,3,8,.96)';
  ctx.fill();

  /* ② 柱身：从孔里伸出来的一段金属杆，越靠近孔口越暗（在洞里） */
  const shaftTop = topY;
  const shaftBot = p.y + 6;             // 沉进孔口一点
  const sg = ctx.createLinearGradient(p.x - 8, 0, p.x + 8, 0);
  sg.addColorStop(0,    'rgba(10,16,32,.99)');
  sg.addColorStop(0.26, 'rgba(104,136,186,.99)');
  sg.addColorStop(0.50, 'rgba(214,236,255,.99)');
  sg.addColorStop(0.74, 'rgba(104,136,186,.99)');
  sg.addColorStop(1,    'rgba(10,16,32,.99)');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.moveTo(p.x - 7.5, shaftBot);
  ctx.lineTo(p.x - 7.5, shaftTop);
  ctx.arc(p.x, shaftTop, 7.5, Math.PI, Math.PI * 2);
  ctx.lineTo(p.x + 7.5, shaftBot);
  ctx.closePath();
  ctx.fill();
  // 柱身暗底轮廓：让柱从暗孔里"立"出来，边缘不糊
  ctx.strokeStyle = 'rgba(4,7,16,.85)';
  ctx.lineWidth = 1.1;
  ctx.stroke();

  /* ③ 两圈箍环：金属杆的关节，读作"机械活塞"而不是一根光管 */
  for (const u of [0.34, 0.70]){
    const yy = shaftBot + (shaftTop - shaftBot) * u;
    ctx.beginPath(); ctx.ellipse(p.x, yy, 8, 2.2, 0, 0, 6.2832);
    ctx.fillStyle = 'rgba(30,46,76,.95)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(178,208,248,.55)';
    ctx.lineWidth = 0.9;
    ctx.stroke();
  }

  /* ④ 顶帽：半球 + 高光 */
  const capG = ctx.createLinearGradient(p.x - p.r, topY - p.r, p.x + p.r, topY);
  capG.addColorStop(0, 'rgba(228,242,255,.98)');
  capG.addColorStop(0.55, 'rgba(150,190,240,.98)');
  capG.addColorStop(1, 'rgba(52,74,112,.98)');
  ctx.beginPath(); ctx.arc(p.x, topY, p.r + 1.2, 0, 6.2832);
  ctx.fillStyle = capG;
  ctx.fill();
  ctx.strokeStyle = 'rgba(214,238,255,.80)';
  ctx.lineWidth = 1.1;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(p.x - 2.4, topY - 2.6, p.r * 0.34, 0, 6.2832);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.fill();

  /* ⑤ 孔沿内壁的冷光：柱子升起时把孔口照亮，说明"是从这里出来的" */
  ctx.beginPath();
  ctx.ellipse(p.x, p.y + 2, p.holeR - 1, p.holeRy - 0.6, 0, 0, 6.2832);
  ctx.strokeStyle = 'rgba(94,231,255,' + (0.24 + 0.30 * p.up) + ')';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  // 上方半圈的受光更强（光从台面上方来）
  ctx.beginPath();
  ctx.ellipse(p.x, p.y + 2, p.holeR - 1, p.holeRy - 0.6, 0, Math.PI * 1.06, Math.PI * 1.94);
  ctx.strokeStyle = 'rgba(200,240,255,' + (0.30 + 0.34 * p.up) + ')';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* ⑥ 剩余时间环：画在顶帽上方，不压柱子 */
  const k = Math.max(0, Math.min(1, p.t / 6));
  ctx.beginPath();
  ctx.arc(p.x, topY, p.r + 5, -Math.PI / 2, -Math.PI / 2 + 6.2832 * k);
  ctx.strokeStyle = 'rgba(94,231,255,.85)';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.restore();
}

function drawHyper(){
  const p = HYPER;
  const ready = !!(state.lanes[0] && state.lanes[1] && state.lanes[2]);
  const pulse = 0.5 + 0.5 * Math.sin(state.time * 5);
  ctx.save();
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832);
  if (ready){
    ctx.strokeStyle = 'rgba(196,160,255,.95)';
    ctx.lineWidth = 2.4;
    ctx.shadowColor = C.violet;
    ctx.shadowBlur = 12 + 10 * pulse;
  } else {
    ctx.strokeStyle = 'rgba(120,150,210,.28)';
    ctx.lineWidth = 1.2;
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
  // 中心一颗小星
  ctx.beginPath(); ctx.arc(p.x, p.y, 3 + p.pop * 6, 0, 6.2832);
  ctx.fillStyle = ready ? C.violet : 'rgba(120,150,210,.35)';
  ctx.fill();
  if (state.hyperT > 0){
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 7 + 6 * pulse, 0, 6.2832);
    ctx.strokeStyle = 'rgba(220,180,255,' + (0.14 + 0.2 * pulse) + ')';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

function drawSpotMarker(){
  const st = stageNow();
  const d = state.drill;
  /* 目标优先级：任务阶段 > 教官指令 > 引导层（接任务 / 超空间 / 落靶 / 选任务）。
     三者共用一套画法，屏幕上永远只有一个箭头，不会互相打架。 */
  let s = null, emphasis = 'mission';
  if (st && st.spot && SPOTS[st.spot]) s = SPOTS[st.spot];
  else if (d && SPOTS[d.spot]) { s = SPOTS[d.spot]; emphasis = 'drill'; }
  else {
    const g = guideNow();
    if (g && g.spot && SPOTS[g.spot]) { s = SPOTS[g.spot]; emphasis = 'guide'; }
  }
  if (!s) return;

  const pulse = 0.5 + 0.5 * Math.sin(state.time * (emphasis === 'drill' ? 8 : 6));
  const base = emphasis === 'drill' ? 'rgba(255,159,67,' : 'rgba(255,255,255,';
  const rad = emphasis === 'drill' ? 24 : 26;
  ctx.save();
  ctx.strokeStyle = base + (0.32 + pulse * 0.5) + ')';
  ctx.lineWidth = 1.6;
  ctx.setLineDash([5, 4]);
  ctx.lineDashOffset = -state.time * 26;
  ctx.beginPath();
  ctx.arc(s.x, s.y, rad + pulse * 5, 0, 6.2832);
  ctx.stroke();
  ctx.setLineDash([]);

  // 引导层的箭头：从上方指下来，比圆圈更像"去打这里"
  if (emphasis === 'guide'){
    const ay = s.y - rad - 15 - pulse * 4;
    ctx.beginPath();
    ctx.moveTo(s.x, ay + 11);
    ctx.lineTo(s.x - 7, ay);
    ctx.lineTo(s.x + 7, ay);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,' + (0.42 + pulse * 0.45) + ')';
    ctx.fill();
  }

  // name tag with a backing plate so it reads over any backdrop
  ctx.font = '700 9px ui-monospace,Menlo,monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const tw = ctx.measureText(s.name).width + 10;
  const ty = s.y - 38 - (emphasis === 'guide' ? 20 : 0);
  ctx.fillStyle = 'rgba(4,8,20,.82)';
  rr(s.x - tw / 2, ty - 8, tw, 16, 5);
  ctx.fill();
  ctx.strokeStyle = emphasis === 'drill' ? 'rgba(255,159,67,.45)' : 'rgba(255,255,255,.35)';
  ctx.lineWidth = 1;
  rr(s.x - tw / 2, ty - 8, tw, 16, 5);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillText(s.name, s.x, ty + 0.5);
  ctx.restore();
}

function drawPosts(){
  for (let i = 0; i < POSTS.length; i++){
    const t = POSTS[i];
    const r = t.r * (1 + t.pop * 0.3);
    ctx.save();
    const g = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, r * 2.2);
    g.addColorStop(0, 'rgba(255,255,255,' + (0.10 + t.pop * 0.45) + ')');
    g.addColorStop(0.4, t.c + '3c');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(t.x, t.y, r * 2.2, 0, 6.2832); ctx.fill();

    const bg = ctx.createRadialGradient(t.x - r*0.3, t.y - r*0.4, 1, t.x, t.y, r);
    bg.addColorStop(0, '#ffffff');
    bg.addColorStop(0.45, t.c);
    bg.addColorStop(1, 'rgba(10,16,40,.9)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, 6.2832); ctx.fill();

    ctx.strokeStyle = t.c;
    ctx.lineWidth = 2;
    ctx.shadowColor = t.c;
    ctx.shadowBlur = 12 + t.pop * 22 + ballLight(t.x, t.y) * 18;
    ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }
}

/* 旗标旋转器（视觉）：八角基座 + 八片旋转旗叶，点亮时青色辉光 */
function drawFlags(){
  for (let i = 0; i < FLAGS.length; i++){
    const f = FLAGS[i];
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, 6.2832);
    ctx.fillStyle = '#1a2340';
    ctx.fill();
    ctx.strokeStyle = f.lit ? 'rgba(120,240,255,.95)' : 'rgba(110,150,215,.5)';
    ctx.lineWidth = 1.5;
    if (f.lit){ ctx.shadowColor = 'rgba(120,240,255,.9)'; ctx.shadowBlur = 10; }
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.rotate(f.a);
    for (let k = 0; k < 8; k++){
      ctx.rotate(Math.PI / 4);
      ctx.strokeStyle = k % 2 ? 'rgba(190,220,255,.85)' : 'rgba(90,130,220,.85)';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(3, 0);
      ctx.lineTo(13, 0);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawRankRing(){
  const litCount = state.rankLights;

  ctx.save();
  // ring track
  ctx.strokeStyle = 'rgba(111,196,255,' + (0.22 + 0.06 * Math.sin(state.time * 2)) + ')';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(RING.cx, RING.cy, RING.rad, 0, 6.2832);
  ctx.stroke();

  // inner dashed track for depth
  ctx.strokeStyle = 'rgba(111,196,255,.10)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.arc(RING.cx, RING.cy, RING.rad - 10, 0, 6.2832);
  ctx.stroke();
  ctx.setLineDash([]);

  // 内圈暗盘 + 橙环：点亮数 = 当前军衔（原版 middle_circle 的内圈语义）
  ctx.beginPath();
  ctx.arc(RING.cx, RING.cy, RING.rad - 20, 0, 6.2832);
  ctx.fillStyle = 'rgba(7,13,32,.94)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,80,40,.55)';
  ctx.lineWidth = 1;
  ctx.stroke();
  for (let i = 0; i < 8; i++){
    const a = -Math.PI / 2 + i * (Math.PI * 2 / 8);
    const px = RING.cx + Math.cos(a) * (RING.rad - 20);
    const py = RING.cy + Math.sin(a) * (RING.rad - 20);
    const on = i < Math.min(8, state.rank);
    ctx.beginPath();
    ctx.arc(px, py, 4, 0, 6.2832);
    if (on){
      ctx.fillStyle = '#ff9540';
      ctx.shadowColor = 'rgba(255,150,60,.9)';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = 'rgba(72,46,26,.9)';
      ctx.fill();
    }
  }
  // 军衔进度小字：内环与红心之间
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 9px ui-monospace,Menlo,monospace';
  ctx.fillStyle = litCount > 0 ? 'rgba(140,210,255,.9)' : 'rgba(110,150,215,.45)';
  ctx.fillText(litCount + '/' + RANK_LIGHTS, RING.cx, RING.cy - 26);

  for (let i = 0; i < RING_POS.length; i++){
    const p = RING_POS[i];
    const on = i < litCount;
    if (on){
      ctx.shadowColor = 'rgba(111,196,255,.95)';
      ctx.shadowBlur = 18;
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, 8, 0, 6.2832);
    if (on){
      ctx.fillStyle = '#6fc4ff';
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 6.2832); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(6,12,30,.92)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(111,196,255,.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // 中央红心：引力井井口（原版 Gravity Well 的核心）——吞球蓄能时红心脉动
  const holdGlow = WELL.hold > 0 ? 0.5 + 0.5 * Math.sin(state.time * 14) : 0;
  ctx.beginPath();
  ctx.arc(WELL.x, WELL.y, 11, 0, 6.2832);
  ctx.fillStyle = 'rgba(10,6,4,.96)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,90,50,' + (0.55 + holdGlow * 0.4 + (WELL.pop > 0 ? WELL.pop : 0) * 0.3) + ')';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = 'rgba(255,90,50,.9)';
  ctx.shadowBlur = 10 + holdGlow * 16;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(WELL.x, WELL.y, 4.5 + holdGlow * 1.5, 0, 6.2832);
  ctx.fillStyle = 'rgba(255,70,40,' + (0.75 + holdGlow * 0.25) + ')';
  ctx.fill();
  // 被井吞住的球：在红心里逐渐下沉
  if (WELL.hold > 0){
    ctx.beginPath();
    ctx.arc(WELL.x, WELL.y, Math.max(2, 7 * WELL.hold / 0.85), 0, 6.2832);
    ctx.fillStyle = 'rgba(238,248,255,.9)';
    ctx.fill();
  }
  ctx.restore();
}

/* 二层碉堡: little buildings standing ON the elevated rail — the raised-playfield
   architecture of the original. Pop animation + ball-light keep them alive. */

/* ==================== 3D 结构层：悬空二层甲板 + 深度遮挡 ==================== */
/* 参考 SpaceCadetPinball 的 render.cpp / zMap：原版给每个精灵配一张深度图，逐像素比较
   决定谁挡住谁，坡道上的球有独立 depth。Canvas 2D 没有逐像素深度缓冲，这里用等价的
   **分层绘制 + 遮挡淡出**：先画一层球、再画甲板与高架，于是桥体天然压住下方穿行的球；
   球被挡住时甲板顶面自动半透明（3A 游戏通用的遮挡透明化），玩家永远不会跟丢球。 */
const DECK3D = {
  cx:DECK2.cx, cy:DECK2.cy, r:DECK2.r,
  z:DECK2.z,                      // 顶面上移量：3D 高度感的核心
  fade:1                          // 1=实体，0.42=球在正下方穿行时淡出
};
const DECK_EDGE_Y = DECK2.hole.y;                 // 前缘（洞口）所在高度
const DECK_PIERS = [
  {x:60+DX,  y:402+DY, h:52},
  {x:132+DX, y:402+DY, h:52}
];
/* 沿原版式不规则轮廓画闭合路径（拱罩顶→颈→加宽区→漏斗→洞）。dy 为 3D 抬升偏移。 */
function deckTopPath(dy){
  const poly = DECK2.poly;
  ctx.beginPath();
  ctx.moveTo(poly[0].x, poly[0].y + dy);
  for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y + dy);
  ctx.closePath();
}
/* 球是否在一层正下方（决定甲板顶面淡出）。用轮廓包围盒近似即可，不必逐边。
   注意：坡道滑行球（rampT）在桥面上方、不在甲板下方，排除——否则每次上坡道
   都会误触发淡出，甲板在球接入的瞬间"滑走消失"。 */
function deckHasBallUnder(){
  const p = DECK2.poly;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for (let i=0;i<p.length;i++){ x0=Math.min(x0,p[i].x); x1=Math.max(x1,p[i].x); y0=Math.min(y0,p[i].y); y1=Math.max(y1,p[i].y); }
  for (let i = 0; i < balls.length; i++){
    const b = balls[i];
    if (b.hidden || b.deck !== 'lower' || b.rampT !== undefined) continue;
    if (b.x > x0 - 8 && b.x < x1 + 8 && b.y > y0 - 8 && b.y < y1 + 8) return true;
  }
  return false;
}

/* 金属拉丝纹理：一次性生成的小块 pattern，给甲板与桥面一个真实的材料表面 */
let metalPattern = null;
function makeMetalPattern(){
  try{
    const c = document.createElement('canvas');
    c.width = 96; c.height = 96;
    const g = c.getContext('2d');
    g.fillStyle = '#7f7f7f'; g.fillRect(0, 0, 96, 96);
    for (let i = 0; i < 420; i++){
      const y = Math.random() * 96, l = 8 + Math.random() * 60;
      const v = Math.random() > 0.5 ? 255 : 0;
      g.strokeStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + (0.04 + Math.random() * 0.10) + ')';
      g.lineWidth = Math.random() < 0.85 ? 1 : 2;
      g.beginPath(); g.moveTo(Math.random() * 96, y); g.lineTo(Math.random() * 96 + l, y); g.stroke();
    }
    metalPattern = ctx.createPattern(c, 'repeat');
  }catch(e){ metalPattern = null; }
}

function drawPier(p){
  const x = p.x, y = p.y, h = p.h;
  ctx.save();
  // 柱脚在台面上的接触阴影
  ctx.fillStyle = 'rgba(0,0,0,.38)';
  ctx.beginPath(); ctx.ellipse(x + 3, y + h + 2, 13, 5, 0, 0, 6.2832); ctx.fill();
  // 短斜撑（托架式，不再伸进场地中央）
  ctx.strokeStyle = 'rgba(70,95,150,.5)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - 3, y + 6); ctx.lineTo(x - 11, y + 22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 3, y + 6); ctx.lineTo(x + 11, y + 22); ctx.stroke();
  // 柱身：左右暗、中间一道高光，读作圆柱
  const g = ctx.createLinearGradient(x - 7, 0, x + 7, 0);
  g.addColorStop(0, '#0c1220'); g.addColorStop(0.32, '#2c3a5c');
  g.addColorStop(0.52, '#7e97c6'); g.addColorStop(0.72, '#26334f'); g.addColorStop(1, '#0a0f1c');
  ctx.fillStyle = g;
  rr(x - 7, y, 14, h, 3); ctx.fill();
  // 底座与顶部法兰
  ctx.fillStyle = '#1a2440'; rr(x - 10, y + h - 4, 20, 7, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(130,170,240,.3)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#2c3a5c'; rr(x - 9, y - 4, 18, 6, 2); ctx.fill();
  ctx.strokeStyle = 'rgba(150,190,255,.35)'; ctx.stroke();
  ctx.restore();
}

/* 甲板下方部分：台面投影 + 支撑柱。画在一层球**之前**，球从柱前滚过才正确。 */
function drawDeckUnderRaw(){
  const D = DECK3D;
  ctx.save();
  // 接触环境光遮蔽：贴地一圈软黑（带模糊），把平台"压"在台面上，高度感由此锚定
  ctx.save();
  ctx.translate(3, 7);
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 7;
  deckTopPath(0); ctx.fillStyle = 'rgba(0,0,0,.40)'; ctx.fill();
  ctx.restore();
  for (let i = 2; i >= 1; i--){                 // 两层轻投影：保住高度感，但不压住下层玩法
    ctx.save();
    ctx.translate(6 + i * 2, D.z + 8 + i * 4);
    deckTopPath(0);
    ctx.fillStyle = 'rgba(0,0,0,' + (0.05 + i * 0.03) + ')';
    ctx.fill();
    ctx.restore();
  }
  for (let i = 0; i < DECK_PIERS.length; i++) drawPier(DECK_PIERS[i]);
  ctx.restore();
}


/* 静态结构缓存：甲板、支撑柱、台面光照每帧内容相同，预渲染一次之后只贴图。
   这是把帧率拉回 60 的关键——否则每帧几十个渐变与铆钉圆弧会吃满主线程。 */
function makeOffCanvas(pxW, pxH){
  // 小游戏端 document 桩经常不支持 createElement（真机尤其），缓存会整批退化成每帧重绘，
  // 帧时间直接飙到秒级 —— 桌面浏览器无感，真机全崩。这里按 document → wx 离屏画布依次兜底。
  let c = null;
  try {
    if (typeof document !== 'undefined' && document && typeof document.createElement === 'function'){
      c = document.createElement('canvas');
    }
  } catch(e){ c = null; }
  if (!c || !c.getContext){
    try {
      if (typeof wx !== 'undefined' && wx){
        c = (typeof wx.createOffscreenCanvas === 'function')
          ? wx.createOffscreenCanvas({ type: '2d', width: Math.ceil(pxW), height: Math.ceil(pxH) })
          : wx.createCanvas();
      }
    } catch(e){ c = null; }
  }
  if (!c || !c.getContext) return null;
  // 关键防线：缓存画布绝不能是上屏画布。某些基础库/工具链会让这些接口返回同一个上屏对象，
  // 那样 renderLayerToCache 就会把缓存内容直接画到屏幕上（每帧额外糊一层色），
  // 随后再被 blit 一次 —— 正是"闪一下颜色 + 整屏蒙版"的典型形态。
  if (c === cv || (window.__PS_BACK && c === window.__PS_BACK)) return null;
  return c;
}
function renderLayerToCache(w, h, drawFn){
  try{
    const c = makeOffCanvas(w * DPR, h * DPR);
    if (!c) return null;
    c.width = Math.max(1, Math.ceil(w * DPR));
    c.height = Math.max(1, Math.ceil(h * DPR));
    const g = c.getContext('2d');
    if (!g) return null;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const saved = ctx;
    ctx = g;                          // 现有绘制函数都用全局 ctx，临时切到缓存画布
    try { drawFn(); } finally { ctx = saved; }
    return c;
  }catch(e){ return null; }
}
let deckTopCache = null, deckUnderCache = null, tableLightCache = null;
function blitLayer(cache, alpha, clipH){
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  // 甲板与支撑柱只占台面上半部：按区域贴图，少做两次全屏混合
  const h = clipH || H;
  const sh = Math.min(cache.height, Math.ceil(h * DPR));
  ctx.drawImage(cache, 0, 0, cache.width, sh, 0, 0, W, h);
  ctx.restore();
}

/* 沿不规则轮廓按比例内缩生成同心路径：scale=1 为原轮廓，<1 向内收。
   这是替代旧版 ctx.arc 同心圆的关键——让所有装饰跟随平台的多边形形状。 */
/* 甲板外缘描边，但允许**留缺口**：gap = {x,y,r}（顶面坐标系，已含 -z 抬升），
   落在圆里的边段不描。坡道末端就在这里接进来——不开口的话，那条闭合轮廓
   会把坡道切断，读作"坡道戳进一个封闭的盒子"。 */
function deckEdgeStroke(dy, gap){
  const p = DECK2.poly;
  const N = 12;
  ctx.beginPath();
  for (let i = 0; i < p.length; i++){
    const a = p[i], b = p[(i + 1) % p.length];
    for (let k = 0; k < N; k++){
      const x0 = a.x + (b.x - a.x) * (k / N), y0 = a.y + (b.y - a.y) * (k / N) + (dy || 0);
      const x1 = a.x + (b.x - a.x) * ((k + 1) / N), y1 = a.y + (b.y - a.y) * ((k + 1) / N) + (dy || 0);
      if (gap){
        const mx = (x0 + x1) / 2 - gap.x, my = (y0 + y1) / 2 - gap.y;
        if (mx * mx + my * my < gap.r * gap.r) continue;
      }
      ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
    }
  }
}

function deckInsetPath(scale, dy){
  const p = DECK2.poly, cx = DECK2.cx, cy = DECK2.cy;
  ctx.beginPath();
  ctx.moveTo(cx + (p[0].x - cx) * scale, p[0].y * scale + cy * (1 - scale) + (dy || 0));
  for (let i = 1; i < p.length; i++){
    ctx.lineTo(cx + (p[i].x - cx) * scale, p[i].y * scale + cy * (1 - scale) + (dy || 0));
  }
  ctx.closePath();
}

/* 甲板自身：占地轮廓（侧壁厚度）→ 上移 z 的顶面 → 材质 → 原版拱罩/颈灯柱 → 护栏。
   画在一层球**之后**形成遮挡；顶面上移 + 侧壁连回台面，3D 高度感由此读出。 */
function drawDeckTopRaw(){
  const D = DECK3D, f = 1, z = D.z;
  ctx.save();

  // 侧壁：铺满占地轮廓（深色），顶面上移后露出的环带就是甲板"厚度"。
  // 渐变按"可见厚度环带"定向：环带顶(=顶面下缘)受光偏亮 → 接触台面处最暗，
  // 于是露出的那一圈自然读作一块有厚度的板侧，而不是一片死黑。
  deckTopPath(0);
  const yBot = DECK2.hole.y + 6;
  const sg = ctx.createLinearGradient(0, yBot - z - 6, 0, yBot);
  sg.addColorStop(0, '#5a6d95'); sg.addColorStop(0.30, '#2b3b60');
  sg.addColorStop(0.72, '#131d36'); sg.addColorStop(1, '#050a14');
  ctx.fillStyle = sg; ctx.fill();
  ctx.save();                                   // 侧壁上的同心加强筋与铆钉（跟随多边形）
  deckTopPath(0); ctx.clip();
  ctx.strokeStyle = 'rgba(140,175,235,.15)'; ctx.lineWidth = 1;
  for (let k = 1; k <= 3; k++){ deckInsetPath(1 - k * 0.09, 0); ctx.stroke(); }
  const p = DECK2.poly;
  ctx.fillStyle = 'rgba(170,200,250,.26)';
  for (let i = 0; i < p.length; i++){
    ctx.beginPath(); ctx.arc(p[i].x, p[i].y, 1.6, 0, 6.2832); ctx.fill();
  }
  ctx.restore();

  // 侧壁面板缝 + 底部接触暗线：让露出的厚度环带读作"拼板侧墙"而非色带
  ctx.save();
  deckTopPath(0); ctx.clip();
  ctx.strokeStyle = 'rgba(8,12,22,.5)'; ctx.lineWidth = 1;
  for (let sx = DECK2.cx - 60; sx <= DECK2.cx + 60; sx += 15){
    ctx.beginPath(); ctx.moveTo(sx, yBot - z); ctx.lineTo(sx, yBot); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(DECK2.cx - 75, yBot - 1); ctx.lineTo(DECK2.cx + 75, yBot - 1); ctx.stroke();
  ctx.restore();

  // 顶面整体上移：3D 抬升
  ctx.translate(0, -z);

  ctx.globalAlpha = f;
  deckTopPath(0);
  const tg = ctx.createRadialGradient(D.cx - 25, D.cy - 60, 18, D.cx, D.cy - 20, D.r * 1.6);
  tg.addColorStop(0, '#2b3c63'); tg.addColorStop(0.45, '#1a2540'); tg.addColorStop(1, '#0c1425');
  ctx.fillStyle = tg; ctx.fill();
  if (metalPattern){ ctx.globalAlpha = f * 0.10; ctx.fillStyle = metalPattern; ctx.fill(); }
  ctx.globalAlpha = f;

  ctx.save(); deckTopPath(0); ctx.clip();
  // 同心刻线（跟随不规则轮廓）
  ctx.strokeStyle = 'rgba(150,185,245,.11)'; ctx.lineWidth = 1;
  for (let k = 1; k <= 4; k++){ deckInsetPath(1 - k * 0.16, 0); ctx.stroke(); }
  // 径向接缝：从中心连到每个顶点
  ctx.strokeStyle = 'rgba(150,185,245,.08)';
  for (let i = 0; i < p.length; i++){
    ctx.beginPath(); ctx.moveTo(D.cx, D.cy); ctx.lineTo(p[i].x, p[i].y); ctx.stroke();
  }

  // —— ① 顶部交付口：坡道末端直接打通接入二层，不画独立落球环/出口标记 ——

  // —— ② 重力下落过渡区：品红导流区 + 黄黑减速带（原版局部图的黄条 + 品红箭头）——
  // 位置相对交付口与隔断：全部跟随 DECK2.entry / DX / DY，整体平移不失效
  const E = DECK2.entry;
  ctx.save();
  // 品红导流底带（倒三角，把球从窄口导向下方宽分流区）
  const pg = ctx.createLinearGradient(0, E.y + 21, 0, E.y + 91);
  pg.addColorStop(0, 'rgba(214,74,158,.05)');
  pg.addColorStop(1, 'rgba(214,74,158,.22)');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.moveTo(E.x - 8, E.y + 23); ctx.lineTo(E.x + 8, E.y + 23);
  ctx.lineTo(E.x + 40, E.y + 89); ctx.lineTo(E.x - 40, E.y + 89);
  ctx.closePath(); ctx.fill();
  // 品红导流箭头（向下流动）
  ctx.strokeStyle = 'rgba(233,120,190,' + (0.35 + 0.25 * Math.sin(state.time * 2.4)) + ')';
  ctx.lineWidth = 1.6;
  for (let k = 0; k < 3; k++){
    const ay = E.y + 41 + k * 20;
    ctx.beginPath();
    ctx.moveTo(E.x - 6, ay - 4); ctx.lineTo(E.x, ay + 2); ctx.lineTo(E.x + 6, ay - 4);
    ctx.stroke();
  }
  // 黄黑减速带（两条横条，原版标志性黄条）
  for (let k = 0; k < 2; k++){
    const by = E.y + 57 + k * 20, bw = 22 + k * 8;
    ctx.save();
    ctx.beginPath(); rr(E.x - bw, by - 4, bw * 2, 8, 2); ctx.clip();
    ctx.fillStyle = '#0d1220'; ctx.fillRect(E.x - bw, by - 4, bw * 2, 8);
    ctx.strokeStyle = '#ffc63c'; ctx.lineWidth = 3.4;
    for (let s = -bw - 8; s < bw + 8; s += 9){
      ctx.beginPath(); ctx.moveTo(E.x + s, by - 6); ctx.lineTo(E.x + s + 8, by + 6); ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,206,110,.55)'; ctx.lineWidth = 1;
    rr(E.x - bw, by - 4, bw * 2, 8, 2); ctx.stroke();
  }
  ctx.restore();

  // —— ③ 物理隔断墙：两道实体墙把台面分成 3 条通道（对齐 DECK2.dividers）——
  for (let i = 0; i < DECK2.dividers.length; i++){
    const dv = DECK2.dividers[i];
    ctx.save();
    ctx.strokeStyle = 'rgba(120,165,235,.55)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(dv.ax, dv.ay); ctx.lineTo(dv.bx, dv.by); ctx.stroke();
    ctx.strokeStyle = 'rgba(190,220,255,.75)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(dv.ax, dv.ay); ctx.lineTo(dv.bx, dv.by); ctx.stroke();
    ctx.restore();
  }

  // 出口洞：穿透 slab 的 recessed 开口——洞内近黑 + 内壁顶阴影 + 前缘亮唇
  const HO = DECK2.hole;
  ctx.save();
  const hg = ctx.createLinearGradient(0, HO.y - 15, 0, HO.y + 2);
  hg.addColorStop(0, '#000000'); hg.addColorStop(0.65, '#04070e'); hg.addColorStop(1, '#0d1526');
  ctx.fillStyle = hg;
  rr(HO.x0, HO.y - 15, HO.x1 - HO.x0, 17, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.lineWidth = 2;
  rr(HO.x0, HO.y - 15, HO.x1 - HO.x0, 17, 4); ctx.stroke();
  ctx.strokeStyle = 'rgba(196,224,255,.55)'; ctx.lineWidth = 1.4;   // 前缘亮唇
  ctx.beginPath(); ctx.moveTo(HO.x0, HO.y + 2); ctx.lineTo(HO.x1, HO.y + 2); ctx.stroke();
  ctx.restore();

  // 台面玻璃反光（收敛：避免把顶面冲淡成"贴纸"）
  const gl = ctx.createLinearGradient(D.cx - D.r, D.cy - D.r, D.cx + D.r * 0.4, D.cy);
  gl.addColorStop(0, 'rgba(190,220,255,.06)'); gl.addColorStop(0.5, 'rgba(190,220,255,.015)');
  gl.addColorStop(1, 'rgba(190,220,255,0)');
  ctx.fillStyle = gl; deckTopPath(0); ctx.fill();
  ctx.restore();

  // 护栏：沿外缘一圈矮墙（跟随不规则轮廓），淡出时依然保留，二层轮廓永不消失
  ctx.globalAlpha = 1;
  /* 顶面外缘受光 rim：slab 的"上棱"高光，厚度感的关键一笔。
     但坡道接入处必须留缺口 —— 这里是"甲板边缘开口、坡道直接接进来"，
     不是"坡道插进一个封闭轮廓"。缺口位置 = 坡道交付点（已含 -z 抬升）。 */
  /* 缺口位置必须落在**坡道穿过甲板边缘的那个交点**上：
     取坡道末端沿切线往回退 26px（往回 = 甲板外侧），就是它穿过边缘的地方。
     注意：rampFrame(1) 的切线是退化值（它用 t+0.01 采样，到 1 就重合了），
     所以方向要取 rampFrame(0.94)。 */
  const rampJ = rampFrame(1), rampD = rampFrame(0.94);
  const rampGap = {
    x: RAMP.tx - rampD.dx * 26,
    y: RAMP.ty - rampD.dy * 26,     // 绘制坐标：translate(0,-z) 已生效，直接与 poly 的 y 比
    r: 23
  };
  deckEdgeStroke(0, rampGap);
  ctx.strokeStyle = 'rgba(214,236,255,.72)'; ctx.lineWidth = 2; ctx.stroke();
  deckInsetPath(0.985, 1.5); ctx.strokeStyle = 'rgba(120,160,220,.32)'; ctx.lineWidth = 1; ctx.stroke();
  deckInsetPath(0.86, 0); ctx.strokeStyle = 'rgba(200,225,255,.20)'; ctx.lineWidth = 1; ctx.stroke();
  // 护栏立柱：每个顶点一根短柱；坡道接入那一段不放柱（否则柱正好立在槽口中间）
  for (let i = 0; i < p.length; i++){
    const gx = p[i].x - rampGap.x, gy = p[i].y - rampGap.y;
    if (gx * gx + gy * gy < rampGap.r * rampGap.r) continue;
    ctx.strokeStyle = 'rgba(170,205,255,.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(p[i].x, p[i].y); ctx.lineTo(p[i].x, p[i].y + 7); ctx.stroke();
  }

  // 甲板上的设备箱体与管线（放在碰撞区两侧边角，避开通道/圆盘/过渡区）
  ctx.globalAlpha = Math.max(0.55, f);
  const boxes = [[52+DX, 330+DY, 12, 7], [140+DX, 330+DY, 12, 7]];
  for (let i = 0; i < boxes.length; i++){
    const bx = boxes[i][0], by = boxes[i][1], bw = boxes[i][2], bh = boxes[i][3];
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    rr(bx - bw / 2 + 2, by + 4, bw, bh, 2); ctx.fill();
    const bg2 = ctx.createLinearGradient(bx, by - bh / 2, bx, by + bh / 2);
    bg2.addColorStop(0, '#46587f'); bg2.addColorStop(1, '#1d2946');
    ctx.fillStyle = bg2; rr(bx - bw / 2, by - bh / 2, bw, bh, 2); ctx.fill();
    ctx.strokeStyle = 'rgba(160,200,255,.5)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = 'rgba(94,224,255,' + (0.4 + 0.3 * Math.sin(state.time * 3 + i)) + ')';
    ctx.fillRect(bx - bw / 2 + 3, by - 1.5, 4, 3);
  }
  ctx.restore();
}


function drawDeckLED(){

  ctx.strokeStyle = 'rgba(94,224,255,' + (0.35 + 0.25 * Math.sin(state.time * 2.2)) + ')';
  ctx.lineWidth = 2.4; ctx.shadowColor = '#5ee0ff'; ctx.shadowBlur = 12;
  // 洞口两侧的灯带（漏斗收口段）

  ctx.beginPath(); ctx.moveTo(DECK2.funnels[1].ax - 4, DECK2.funnels[1].ay); ctx.lineTo(DECK2.hole.x1 + 2, yE + 4); ctx.stroke();

}
function drawDeckTop(){

  if (deckTopCache) blitLayer(deckTopCache, DECK3D.fade, DECK2.hole.y + 55);

/* 甲板上的常驻建筑：物理坐标即甲板坐标，绘制整体上移 z，并随遮挡一起淡出 */
function drawDeckModules(){
  ctx.save();
  ctx.translate(0, -DECK3D.z);
  ctx.globalAlpha = DECK3D.fade;
  drawDeckTargets();
  drawTurrets();
  drawDeckHole();
  ctx.restore();
}

/* 出口洞：甲板前缘中央的开口，球从这里落回一层 */
function drawDeckHole(){
  const h = DECK2.hole;
  const cxm = (h.x0 + h.x1) / 2, hw = (h.x1 - h.x0) / 2;
  ctx.save();
  const g = ctx.createLinearGradient(0, h.y - 8, 0, h.y + 8);
  g.addColorStop(0, 'rgba(2,4,12,.98)'); g.addColorStop(1, 'rgba(8,12,26,.95)');
  ctx.fillStyle = g;
  rr(cxm - hw, h.y - 7, hw * 2, 14, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(255,159,67,.85)'; ctx.lineWidth = 1.6;
  ctx.shadowColor = 'rgba(255,159,67,.6)'; ctx.shadowBlur = 8;
  rr(cxm - hw, h.y - 7, hw * 2, 14, 6); ctx.stroke();
  ctx.shadowBlur = 0;
  const ph = (state.time * 2.2) % 1;
  ctx.globalAlpha = 0.85 - ph * 0.6;
  ctx.strokeStyle = C.orange; ctx.lineWidth = 2;
  const ay = h.y - 3 + ph * 9;
  ctx.beginPath();
  ctx.moveTo(cxm - 5, ay - 4); ctx.lineTo(cxm, ay); ctx.lineTo(cxm + 5, ay - 4);
  ctx.stroke();
  ctx.globalAlpha = 1;
  tinyTextC('二层出口 · 直落台面', cxm, h.y + 19, 8, 'rgba(255,180,110,.75)');
  ctx.restore();
}

/* 二层升降井：紧贴左墙的运输井。井口是完整圆环吞球口，一条虚线路径
   从井口一直画到二层平台左翼的停机坪——玩家一眼读出"这里通向二层"。 */
/* 沿坡道中心线取点（物理坐标，t∈[0,1]） */
function rampPoint(t){
  const path = RAMP.path;
  const seglen = []; let total = 0;
  for (let i = 0; i < path.length - 1; i++){
    const l = Math.hypot(path[i+1].x - path[i].x, path[i+1].y - path[i].y);
    seglen.push(l); total += l;
  }
  let target = Math.max(0, Math.min(1, t)) * total, acc = 0;
  for (let i = 0; i < seglen.length; i++){
    if (acc + seglen[i] >= target || i === seglen.length - 1){
      const lt = seglen[i] > 0 ? (target - acc) / seglen[i] : 0;
      return {x: path[i].x + (path[i+1].x - path[i].x) * lt,
              y: path[i].y + (path[i+1].y - path[i].y) * lt};
    }
    acc += seglen[i];
  }
  return path[path.length - 1];
}
/* 坡道离地高度 h(t)：ease-out 曲线——吞球口贴地(0)，出射后迅速抬离台面，
   中段即巡航在高空，末端与二层顶面齐平(z)。比线性 z*t 更"腾空"，
   配合桥墩与地面投影，是读作 3D 架空桥的核心。 */
function rampH(t){
  t = Math.max(0, Math.min(1, t));
  return DECK3D.z * (1 - Math.pow(1 - t, 2.8));   // 2.8：更早饱和到二层高度，桥尾与顶面平齐滑行再融入
}
/* 取坡道在 t 处的切向与法向（屏幕坐标，含架空抬升 lift） */
function rampFrame(t){
  const p = rampPoint(t), lift = rampH(t);
  const p2 = rampPoint(Math.min(1, t + 0.01)), l2 = rampH(Math.min(1, t + 0.01));
  let dx = p2.x - p.x, dy = (p2.y - l2) - (p.y - lift);
  const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
  return {x:p.x, y:p.y - lift, dx:dx, dy:dy, nx:-dy, ny:dx, t:t};
}

/* 坡道半宽：入口最宽（约为旧桥面 2 倍），向二层端线性收窄成漏斗，U 型一气呵成。 */
function rampHalfW(t){ const e = t*t*(3-2*t); return 22 - 14*e; }   // 入口半宽22→二层8，smoothstep 平滑收窄

/* 沿坡道左右法向构造变宽带状多边形（含架空 lift），用于填充/裁剪。 */
function rampRibbon(wfn){
  const N = 80, L = [], R = [];
  for (let k = 0; k <= N; k++){
    const t = k / N, f = rampFrame(t), w = wfn(t);
    L.push([f.x + f.nx * w, f.y + f.ny * w]);
    R.push([f.x - f.nx * w, f.y - f.ny * w]);
  }
  ctx.beginPath();
  ctx.moveTo(L[0][0], L[0][1]);
  for (let k = 1; k <= N; k++) ctx.lineTo(L[k][0], L[k][1]);
  for (let k = N; k >= 0; k--) ctx.lineTo(R[k][0], R[k][1]);
  ctx.closePath();
}

/* 贴地（未抬升）的变宽带状多边形：用于把坡道的投影"钉"在一层台面上。
   法向借用抬升帧的 nx/ny（同平面方向），位置用未抬升的 rampPoint。
   t0/t1 限定区间：后段桥身焊在二层上，投影只落在开放台面前段。 */
function rampGroundRibbon(wfn, t0, t1){
  t0 = t0 || 0; t1 = (t1 === undefined) ? 1 : t1;
  const N = 40, L = [], R = [];
  for (let k = 0; k <= N; k++){
    const t = t0 + (t1 - t0) * k / N, g = rampPoint(t), f = rampFrame(t), w = wfn(t);
    L.push([g.x + f.nx * w, g.y + f.ny * w]);
    R.push([g.x - f.nx * w, g.y - f.ny * w]);
  }
  ctx.beginPath();
  ctx.moveTo(L[0][0], L[0][1]);
  for (let k = 1; k <= N; k++) ctx.lineTo(L[k][0], L[k][1]);
  for (let k = N; k >= 0; k--) ctx.lineTo(R[k][0], R[k][1]);
  ctx.closePath();
}

function drawLift(){
  const R = RAMP;
  const hot = R.cd <= 0;
  ctx.save();

  // —— ① 架空投影：只落在开放台面的前段（后段桥身焊在二层上，不另投地影） ——
  ctx.save();
  ctx.translate(7, 13);
  rampGroundRibbon(function(t){ return rampHalfW(t) + 2; }, 0, 0.38);
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fill();
  ctx.translate(4, 6);
  rampGroundRibbon(function(t){ return rampHalfW(t) + 1; }, 0, 0.38);
  ctx.fillStyle = 'rgba(0,0,0,.26)'; ctx.fill();
  ctx.restore();

  // —— ② 金属桥墩：只立在开放台面上的前段；后段焊在二层侧缘（见②b），桥与二层是一体结构 ——
  const piers = [0.10, 0.26, 0.42];
  for (const t of piers){
    const f = rampFrame(t), g = rampPoint(t);
    const topY = f.y + 2, footY = g.y + 3;
    const hh = footY - topY;
    if (hh < 6) continue;
    const pw = Math.max(2.5, rampHalfW(t) * 0.16);
    // 墩脚在台面的接触阴影（斜向光）
    ctx.fillStyle = 'rgba(0,0,0,.30)';
    ctx.beginPath(); ctx.ellipse(f.x + 3, footY + 1, pw + 4, 3, 0, 0, 6.2832); ctx.fill();
    // 墩身：左右暗、中间高光的圆柱
    const g2 = ctx.createLinearGradient(f.x - pw, 0, f.x + pw, 0);
    g2.addColorStop(0, 'rgba(8,13,26,.95)');
    g2.addColorStop(0.5, 'rgba(104,132,180,.95)');
    g2.addColorStop(1, 'rgba(8,13,26,.95)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.moveTo(f.x - pw, topY); ctx.lineTo(f.x + pw, topY);
    ctx.lineTo(f.x + pw + 1.5, footY); ctx.lineTo(f.x - pw - 1.5, footY);
    ctx.closePath(); ctx.fill();
    // 底座法兰 + 顶部托板
    ctx.fillStyle = 'rgba(26,36,64,.95)'; rr(f.x - pw - 3, footY - 2, (pw + 3) * 2, 4, 2); ctx.fill();
    ctx.fillStyle = 'rgba(150,190,240,.45)'; rr(f.x - pw - 2, topY - 1.5, (pw + 2) * 2, 3, 1.5); ctx.fill();
  }

  // —— ②b 与二层的焊接加劲板：把桥身左轨接到二层顶面右缘，读作同一组件 ——
  //    后段桥身落在二层顶面上：落地点画垂直落脚法兰（桥面→顶面的短立柱），
  //    桥与二层之间不留缝，读作从二层长出来的一个组件。
  for (const t of [0.62, 0.78]){
    const f = rampFrame(t), hw = rampHalfW(t);
    const drop = (DECK3D.z - rampH(t)) + 3;      // 桥面到二层顶面的高差
    if (drop < 2) continue;
    for (const s of [-0.7, 0.7]){
      const lx = f.x + f.nx * hw * s;
      const gg = ctx.createLinearGradient(lx - 2, 0, lx + 2, 0);
      gg.addColorStop(0, 'rgba(10,16,30,.95)'); gg.addColorStop(0.5, 'rgba(96,124,170,.9)'); gg.addColorStop(1, 'rgba(10,16,30,.95)');
      ctx.fillStyle = gg;
      ctx.fillRect(lx - 1.6, f.y, 3.2, drop);
      ctx.fillStyle = 'rgba(150,190,240,.4)';
      rr(lx - 3, f.y + drop - 1.5, 6, 3, 1.5); ctx.fill();
    }
  }

  // —— ②c 与二层顶面的融合围裙：桥尾段铺一块甲板材质的宽板盖住圆顶肩线，
  //    桥面→围裙→二层顶面同材质过渡，消掉"桥搭在板上"的接缝感（垫在槽底/导轨之下） ——
  ctx.save();
  const A0 = 0.70, AN = 24;
  ctx.beginPath();
  for (let k = 0; k <= AN; k++){
    const t = A0 + (1 - A0) * k / AN, f = rampFrame(t), w = rampHalfW(t) + 6;
    const x = f.x + f.nx * w, y = f.y + f.ny * w;
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  for (let k = AN; k >= 0; k--){
    const t = A0 + (1 - A0) * k / AN, f = rampFrame(t), w = rampHalfW(t) + 6;
    ctx.lineTo(f.x - f.nx * w, f.y - f.ny * w);
  }
  ctx.closePath();
  const ag = ctx.createLinearGradient(0, rampFrame(0.85).y - 10, 0, rampFrame(0.85).y + 12);
  ag.addColorStop(0, '#2b3c63'); ag.addColorStop(0.5, '#22304e'); ag.addColorStop(1, '#141d33');
  ctx.fillStyle = ag; ctx.fill();
  ctx.strokeStyle = 'rgba(150,185,245,.25)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();

  // —— ③ 半透明滑道槽：球在槽内可见，保留架空通透感（加深以读作实体槽底） ——
  rampRibbon(function(t){ return rampHalfW(t); });
  ctx.fillStyle = 'rgba(12,20,40,.62)'; ctx.fill();
  // 槽底中缝：一条暗沟，强化"U 型槽"而非平面彩带
  ctx.beginPath();
  for (let k = 0; k <= 60; k++){
    const t = k / 60, f = rampFrame(t);
    if (k === 0) ctx.moveTo(f.x, f.y); else ctx.lineTo(f.x, f.y);
  }
  ctx.strokeStyle = 'rgba(4,8,18,.7)'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
  ctx.strokeStyle = 'rgba(120,160,220,.25)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let k = 0; k <= 60; k++){
    const t = k / 60, f = rampFrame(t);
    if (k === 0) ctx.moveTo(f.x, f.y - 1.2); else ctx.lineTo(f.x, f.y - 1.2);
  }
  ctx.stroke();

  // —— ④ 槽壁 + 高架钢丝导轨：槽壁把滑道两侧"立"起来，钢丝再抬在槽壁顶 ——
  //    侧壁(竖直面) + 顶部亮钢丝 = 一条有深度的 U 型槽，而非贴地彩带。
  /* 末段收束：槽壁与钢丝在接近二层时高度归零、贴回顶面。
     原版坡道不是"开个洞插进去"，而是槽体逐渐摊平并入上层台面；
     直接画到末端会留下一圈生硬的截断面（放大看很像两件东西拼在一起）。 */
  const jFade = function (t){
    if (t < 0.84) return 1;
    const k = Math.min(1, (t - 0.84) / 0.16);
    return 1 - k * k * (3 - 2 * k);
  };
  const RAIL_H = 6;
  for (const side of [-1, 1]){
    const floor = [], rail = [];
    for (let k = 0; k <= 60; k++){
      const t = k / 60, f = rampFrame(t), off = (rampHalfW(t) - 1) * side;
      const x = f.x + f.nx * off, y = f.y + f.ny * off;
      floor.push([x, y]); rail.push([x, y - RAIL_H * jFade(t)]);
    }
    // 槽侧壁：floor 边 → rail 边的竖直四边形带
    ctx.beginPath();
    ctx.moveTo(floor[0][0], floor[0][1]);
    for (let k = 1; k <= 60; k++) ctx.lineTo(floor[k][0], floor[k][1]);
    for (let k = 60; k >= 0; k--) ctx.lineTo(rail[k][0], rail[k][1]);
    ctx.closePath();
    const wg = ctx.createLinearGradient(0, rampFrame(0.5).y - RAIL_H, 0, rampFrame(0.5).y + 4);
    wg.addColorStop(0, 'rgba(120,150,205,.85)');
    wg.addColorStop(0.5, 'rgba(46,62,98,.9)');
    wg.addColorStop(1, 'rgba(16,24,44,.95)');
    ctx.fillStyle = wg; ctx.fill();
    // 顶部钢丝：暗底 + 银白 + 高光，读作圆钢丝
    ctx.beginPath();
    for (let k = 0; k <= 60; k++){ const p = rail[k]; if (k === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); }
    ctx.strokeStyle = 'rgba(24,34,58,.95)'; ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.stroke();
    ctx.strokeStyle = 'rgba(168,198,240,.95)'; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.beginPath();
    for (let k = 0; k <= 60; k++){ const p = rail[k]; if (k === 0) ctx.moveTo(p[0], p[1] - 0.8); else ctx.lineTo(p[0], p[1] - 0.8); }
    ctx.strokeStyle = 'rgba(235,248,255,.75)'; ctx.lineWidth = 0.8; ctx.stroke();
    // 立柱：把钢丝撑在槽壁顶（间隔小柱，强化"架空"）
    ctx.strokeStyle = 'rgba(150,182,228,.6)'; ctx.lineWidth = 1.4;
    for (let k = 4; k <= 60; k += 8){
      ctx.beginPath(); ctx.moveTo(floor[k][0], floor[k][1]); ctx.lineTo(rail[k][0], rail[k][1]); ctx.stroke();
    }
  }

  // —— ⑤ 梯式横档 + 铆钉：把两条导轨连成"桥"（末段收束后不再横跨，否则会切在二层顶面上）——
  for (let k = 3; k <= 48; k += 4){
    const t = k / 60, f = rampFrame(t), hw = rampHalfW(t) - 1;
    ctx.strokeStyle = 'rgba(120,150,200,.5)'; ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(f.x + f.nx * hw, f.y + f.ny * hw);
    ctx.lineTo(f.x - f.nx * hw, f.y - f.ny * hw);
    ctx.stroke();
    for (const s of [-1, 1]){
      ctx.fillStyle = 'rgba(210,232,255,.85)';
      ctx.beginPath(); ctx.arc(f.x + f.nx*hw*s, f.y + f.ny*hw*s, 1.1, 0, 6.2832); ctx.fill();
    }
  }

  // —— ⑥ 原版黄色标记横带（少量减速/标记带，非满桥条纹）——
  const bands = [0.22, 0.30, 0.40, 0.50, 0.60];
  ctx.lineCap = 'butt';
  for (const t of bands){
    const f = rampFrame(t), hw = rampHalfW(t) - 2;
    ctx.strokeStyle = 'rgba(255,206,84,.9)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(f.x + f.nx * hw, f.y + f.ny * hw);
    ctx.lineTo(f.x - f.nx * hw, f.y - f.ny * hw);
    ctx.stroke();
  }

  // —— ⑦ 敞口坡道起点：只是槽的口子，不做"洞" ——
  //    没有吞球暗腔、没有发光圆环：圆洞读成"球被吸进去"，而这里是一条敞开的槽——
  //    冲得上去就沿槽上行，冲不上就滑回台面。可读性靠槽口受光唇 + 两侧导流翼。
  const inF = rampFrame(0);
  const hw0 = rampHalfW(0);
  ctx.save();
  ctx.translate(inF.x, inF.y);
  ctx.rotate(Math.atan2(inF.dy, inF.dx));
  // 导流翼：沿槽壁外侧张开的短翼，指出"往这儿冲"
  for (const side of [-1, 1]){
    ctx.beginPath();
    ctx.moveTo(30, side * (hw0 + 12));
    ctx.quadraticCurveTo(9, side * (hw0 + 7), 0, side * (hw0 + 1));
    ctx.strokeStyle = 'rgba(40,54,86,.9)'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.stroke();
    ctx.strokeStyle = hot ? 'rgba(150,190,240,.85)' : 'rgba(120,150,200,.4)';
    ctx.lineWidth = 2.2; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(27, side * (hw0 + 10));
    ctx.quadraticCurveTo(8, side * (hw0 + 6), 0, side * hw0);
    ctx.strokeStyle = 'rgba(220,238,255,.5)'; ctx.lineWidth = 1; ctx.stroke();
  }
  // 槽口金属唇：暗底 + 银白高光的双线，读作"槽口边缘被灯照到"，而不是一道发光门槛
  ctx.lineCap = 'round';
  const lipW = hw0 - 2;
  ctx.strokeStyle = 'rgba(14,22,40,.92)'; ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.moveTo(0, -lipW); ctx.lineTo(0, lipW); ctx.stroke();
  ctx.strokeStyle = hot ? 'rgba(170,240,255,.95)' : 'rgba(160,196,240,.5)';
  ctx.lineWidth = 1.6;
  if (hot){ ctx.shadowColor = C.cyan; ctx.shadowBlur = 6 + 2*Math.sin(state.time*5); }
  ctx.beginPath(); ctx.moveTo(0, -lipW); ctx.lineTo(0, lipW); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();

  /* —— ⑧ 坡道末端接进二层：**不画封口** ——
     之前这里画了一个圆头 + 一道横线，读作"坡道到头了、球被甩出去"。
     现在沿切线把槽底继续延伸 34px，穿过甲板外缘（那里已经开口，见 deckEdgeStroke），
     侧轨用 alpha 渐变淡出 —— 读作"坡道一直铺进平台，二者是同一个东西"。 */
  const jf = rampFrame(1);
  /* rampFrame(1) 的切线/dx,dy 是退化的 0（内部用 t+0.01 采样，t=1 时采到同一点）。
     方向必须回退到 0.94 取，否则延伸段的宽度和位移都是 0，等于没画。 */
  const jd = rampFrame(0.94);
  const wEnd = rampHalfW(1);
  const rx = -jd.dy, ry = jd.dx;                    // 法向
  const ex2 = jf.x + jd.dx * 36, ey2 = jf.y + jd.dy * 36;
  ctx.save();
  // 延伸段槽底：与主槽同色，保证视觉连续
  ctx.beginPath();
  ctx.moveTo(jf.x + rx * wEnd, jf.y + ry * wEnd);
  ctx.lineTo(ex2 + rx * wEnd * 0.90, ey2 + ry * wEnd * 0.90);
  ctx.lineTo(ex2 - rx * wEnd * 0.90, ey2 - ry * wEnd * 0.90);
  ctx.lineTo(jf.x - rx * wEnd, jf.y - ry * wEnd);
  ctx.closePath();
  const eg = ctx.createLinearGradient(jf.x, jf.y, ex2, ey2);
  eg.addColorStop(0, 'rgba(12,20,40,.62)');
  eg.addColorStop(0.6, 'rgba(11,18,36,.48)');
  eg.addColorStop(1, 'rgba(10,17,34,.16)');
  ctx.fillStyle = eg;
  ctx.fill();
  // 槽底中缝继续延伸（与 ③ 那条暗沟对齐）
  const mg = ctx.createLinearGradient(jf.x, jf.y, ex2, ey2);
  mg.addColorStop(0, 'rgba(4,8,18,.70)');
  mg.addColorStop(1, 'rgba(4,8,18,0)');
  ctx.strokeStyle = mg; ctx.lineWidth = 3; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(jf.x, jf.y); ctx.lineTo(ex2, ey2); ctx.stroke();
  // 两侧导轨延伸：越往前越淡，最后融进甲板顶面
  for (const s of [-1, 1]){
    const rg2 = ctx.createLinearGradient(jf.x, jf.y, ex2, ey2);
    rg2.addColorStop(0, 'rgba(186,214,250,.72)');
    rg2.addColorStop(0.65, 'rgba(150,186,236,.28)');
    rg2.addColorStop(1, 'rgba(130,170,225,0)');
    ctx.strokeStyle = rg2; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(jf.x + rx * wEnd * s, jf.y + ry * wEnd * s);
    ctx.lineTo(ex2 + rx * wEnd * 0.90 * s, ey2 + ry * wEnd * 0.90 * s);
    ctx.stroke();
  }
  ctx.restore();

  ctx.restore();
  // 坡道末端并入二层顶面：桥与二层是同一组件（见 ⑧ 与 ②b 加劲板）。
}

function drawLiftWing(){
  const L = LIFT;

  ctx.beginPath(); ctx.arc(0, 0, 11, 0, 6.2832); ctx.stroke();
