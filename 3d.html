<html lang="zh-CN">
								
							<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04050d">
<title>Pinball Star · 星空弹球</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;height:100%;overflow:hidden;
    background:radial-gradient(circle at 50% 18%,#0c1330 0%,#05060f 55%,#000 100%);
    font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  body{display:flex;align-items:center;justify-content:center;}
  #wrap{position:relative;filter:drop-shadow(0 12px 60px rgba(70,130,255,.28));}
  canvas{display:block;border-radius:14px;touch-action:none;}
  /* 分层：WebGL（台面底图 + 3D 缓冲器）在下，2D 画布（全部动态元素 + 球）在上。
     反过来会让 WebGL 那张不透明台面底图盖住 2D 的坡道/二层/灯。 */
  #gl{position:absolute;left:0;top:0;z-index:0;pointer-events:none;}
  #c{position:relative;z-index:1;}
</style>
</head>
<body>
<div id="wrap"><canvas id="gl"></canvas><canvas id="c"></canvas></div>
<script src="vendor/three.min.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   Pinball Star — single file, no dependencies
   Table inspired by Space Cadet: ranks, missions, fuel, wormholes.
   ============================================================ */

const W = 480, H = 800;      // playfield logical size
const HEAD = 140;            // backglass height
const CW = W, CH = H + HEAD; // canvas size

const cv  = document.getElementById('c');
let ctx = cv.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
if (window.__PS_VIEW){
  // 微信小游戏：CSS 缩放无效，缓冲区直接铺满屏幕物理像素；逻辑画面在 render 里用 VIEW 等比居中
  cv.width  = Math.round(window.innerWidth  * DPR);
  cv.height = Math.round(window.innerHeight * DPR);
} else {
  cv.width  = CW * DPR;
  cv.height = CH * DPR;
  ctx.scale(DPR, DPR);
}

function fit(){
  const s = Math.min(window.innerWidth / CW, window.innerHeight / CH) * 0.985;
  cv.style.width  = Math.round(CW * s) + 'px';
  cv.style.height = Math.round(CH * s) + 'px';
  const gl = document.getElementById('gl');
  if (gl){
    gl.style.width  = cv.style.width;
    gl.style.height = cv.style.height;
    if (window.__R3 && window.__R3.resize) window.__R3.resize(gl.clientWidth || 480, gl.clientHeight || 940);
  }
}
window.addEventListener('resize', fit);
fit();

/* ---------------------------- palette ---------------------------- */
const C = {
  cyan:'#5ee7ff', blue:'#4a8cff', magenta:'#ff5ecb', gold:'#ffd45e',
  violet:'#a78bfa', green:'#5ef2b0', red:'#ff5a6e', orange:'#ff9f43',
  wall:'#1c2650', wallHi:'#7fb0ff',
  ball:'#eef8ff', text:'#dbe8ff', dim:'#5f7099'
};

const GUTTER = '#04050d';   // 小游戏留边底色：与台面最深处同色，留边看不出边界

/* ============================================================
   PLATFORM LAYER
   The game core is identical on Web and inside WeChat Mini Program; only this block
   differs. Everything outside it calls PF.* and never touches localStorage / wx.*
   directly, which is what makes the same file runnable in both hosts.
   ============================================================ */
const IS_WX = (typeof wx !== 'undefined' && wx && typeof wx.createRewardedVideoAd === 'function');

const PF = {
  /* ---------- persistence ---------- */
  store: {
    get: function(k, d){
      try {
        if (IS_WX) { const v = wx.getStorageSync(k); return (v === '' || v === undefined || v === null) ? d : v; }
        const v = localStorage.getItem(k);
        return v === null ? d : v;
      } catch(e){ return d; }
    },
    set: function(k, v){
      try { if (IS_WX) wx.setStorageSync(k, v); else localStorage.setItem(k, v); } catch(e){}
    }
  },

  /* ---------- rewarded video ----------
     Web has no ad SDK, so it resolves immediately after a short simulated wait;
     a Mini Program uses the real rewarded-video unit id set in PF.init(). */
  adUnitId: '',
  // 微信云开发环境 ID：开通云开发后填这里（或 PF.init({cloudEnv}) 传入），全国榜才会连通。
  // 测试号不支持云开发；需注册正式小游戏 AppID 后在开发者工具开通并部署 cloudfunctions/。
  CLOUD_ENV: '',
  // ⚠️ 测试专用开关：未配置广告位（如测试号）时模拟放行激励视频，方便走通解锁/复活链路。
  // 正式上线填入真实 adUnitId 后此分支自动失效；若想强制关闭，把它改为 false。
  TEST_AD_GRANT: true,
  _ad: null,
  showRewarded: function(onResult){
    // onResult(granted:boolean)
    if (!IS_WX){
      // Web: simulate the interaction so the flow is testable end-to-end
      setTimeout(function(){ onResult(true); }, 260);
      return;
    }
    if (!PF.adUnitId){
      // 测试号：无广告位时模拟放行，能完整验证解锁/复活链路（上线填真实 ID 后自动走正常分支）
      if (PF.TEST_AD_GRANT) setTimeout(function(){ onResult(true); }, 260);
      else onResult(false);
      return;
    }
    try {
      if (!PF._ad){
        PF._ad = wx.createRewardedVideoAd({ adUnitId: PF.adUnitId });
        PF._ad._cb = null;
        PF._ad.onClose(function(res){
          const ok = (res && res.isEnded) || res === undefined;
          const cb = PF._ad._cb; PF._ad._cb = null;
          if (cb) cb(!!ok);
        });
        PF._ad.onError(function(){ const cb = PF._ad._cb; PF._ad._cb = null; if (cb) cb(false); });
      }
      PF._ad._cb = onResult;
      PF._ad.load()
        .then(function(){ return PF._ad.show(); })
        .catch(function(){ const cb = PF._ad._cb; PF._ad._cb = null; if (cb) cb(false); });
    } catch(e){ onResult(false); }
  },

  /* ---------- leaderboard ----------
     Web keeps a local board; a Mini Program would call a cloud function.
     `submit` then `list` keeps the same shape for both. */
  leaderboard: {
    _key: 'ps_board_v1',
    _all: function(){
      try {
        const raw = PF.store.get(PF.leaderboard._key, '[]');
        return typeof raw === 'string' ? JSON.parse(raw) : raw;
      } catch(e){ return []; }
    },
    _save: function(list){
      PF.store.set(PF.leaderboard._key, JSON.stringify(list.slice(0, 50)));
    },
    submit: function(entry, done){
      // entry: {name, score, rank, missions, mode, ts}
      if (IS_WX && typeof wx.cloud !== 'undefined'){
        try {
          wx.cloud.callFunction({
            name: 'submitScore',
            data: entry,
            success: function(){ if (done) done(true); },
            fail: function(){ if (done) done(false); }
          });
          return;
        } catch(e){}
      }
      const list = PF.leaderboard._all();
      list.push(entry);
      list.sort(function(a, b){ return b.score - a.score; });
      PF.leaderboard._save(list);
      if (done) setTimeout(function(){ done(true); }, 40);
    },
    list: function(mode, done){
      if (IS_WX && typeof wx.cloud !== 'undefined'){
        try {
          wx.cloud.callFunction({
            name: 'getBoard',
            data: { mode: mode },
            success: function(res){ done((res && res.result && res.result.list) || []); },
            fail: function(){ done([]); }
          });
          return;
        } catch(e){}
      }
      const all = PF.leaderboard._all();
      const filtered = all.filter(function(e){ return !mode || e.mode === mode; });
      setTimeout(function(){ done(filtered.slice(0, 20)); }, 40);
    }
  },

  /* ---------- share ---------- */
  share: function(payload){
    if (IS_WX && typeof wx.shareAppMessage === 'function'){
      try { wx.shareAppMessage({ title: payload.title, imageUrl: payload.imageUrl || '' }); } catch(e){}
      return;
    }
    // Web: copy a short text so the affordance still does something real
    const txt = payload.title;
    try { navigator.clipboard.writeText(txt); } catch(e){}
  },

  /* ---------- haptics ---------- */
  vibrate: function(){
    if (IS_WX && typeof wx.vibrateShort === 'function'){ try { wx.vibrateShort({ type:'light' }); } catch(e){} }
  },

  /* ---------- profile（用户信息） ----------
     微信平台自 2021-04 起不再向小游戏/小程序返回真实昵称头像（getUserInfo/getUserProfile
     均返回匿名），合规做法：本人昵称自填（小游戏走系统键盘 wx.showKeyboard），
     好友的真实昵称头像走开放数据域 getFriendCloudStorage。此处只维护本人昵称。 */
  profile: {
    getName: function(){
      const v = (PF.store.get('ps_name', '') || '').toString().trim();
      return v || 'PLAYER';
    },
    setName: function(v){
      v = String(v || '').trim().substring(0, 12);
      PF.store.set('ps_name', v);
    },
    _kbBound: false,
    edit: function(done){
      if (IS_WX && typeof wx.showKeyboard === 'function'){
        try {
          if (!PF.profile._kbBound){
            PF.profile._kbBound = true;
            wx.onKeyboardComplete(function(res){
              wx.hideKeyboard();
              if (res && res.value) PF.profile.setName(res.value);
              if (done) done(PF.profile.getName());
            });
          }
          wx.showKeyboard({ defaultValue: PF.profile.getName(), maxLength: 12,
                            multipleLine: false, confirmHold: false, confirmType: 'done' });
          return;
        } catch(e){}
      }
      // Web：prompt 兜底（demo 期足够）
      try {
        const v = window.prompt('输入昵称（12 字内）', PF.profile.getName());
        if (v !== null && v.trim()) PF.profile.setName(v);
      } catch(e){}
      if (done) done(PF.profile.getName());
    }
  },

  /* ---------- cloud（全国榜后端：微信云开发 或 自建阿里云 FC，二选一自动路由） ----------
     微信云开发：CLOUD_ENV 非空 → wx.cloud.callFunction（ps_submit/ps_top）。
     自建后端：API_URL 非空 → wx.request 打 HTTP（/login /submit /top），
     登录态 = 服务端签发的 HMAC token（ps_token），openid 全程不下发客户端。
     两者都未配置时 backend()=null，全国榜 tab 显示开通指引。 */
  API_URL: 'https://pinball-score-zbglnykcfa.cn-hongkong.fcapp.run',   // 自建阿里云 FC 全国榜后端（server/deploy_aliyun.sh 部署）
  cloud: {
    env: '',
    ready: false,
    backend: function(){
      if (PF.cloud.ready) return 'wxcloud';
      if (PF.API_URL) return 'http';
      return null;
    },
    submitBest: function(score){
      score = Math.max(0, Math.floor(score || 0));
      const prev = Math.max(0, parseInt(PF.store.get('ps_best', 0), 10) || 0);
      const best = Math.max(prev, score);
      PF.store.set('ps_best', String(best));
      if (IS_WX && typeof wx.setUserCloudStorage === 'function'){
        try {
          wx.setUserCloudStorage({
            KVDataList: [{ key: 'ps_best', value: String(best) }],
            success: function(){}, fail: function(){}
          });
        } catch(e){}
      }
      return best;
    },
    ensureLogin: function(done){
      done = done || function(){};
      if (!IS_WX || !PF.API_URL){ done(false); return; }
      if (PF.store.get('ps_token', '')){ done(true); return; }
      try {
        wx.login({
          success: function(r){
            if (!r || !r.code){ done(false); return; }
            wx.request({
              url: PF.API_URL + '/login', method: 'POST',
              header: { 'Content-Type': 'application/json' },
              data: { code: r.code },
              success: function(res){
                const d = res && res.data;
                if (res.statusCode === 200 && d && d.token){
                  PF.store.set('ps_token', d.token); done(true);
                } else done(false);
              },
              fail: function(){ done(false); }
            });
          },
          fail: function(){ done(false); }
        });
      } catch(e){ done(false); }
    },
    submitScore: function(entry, done){
      done = done || function(){};
      const bk = PF.cloud.backend();
      if (bk === 'wxcloud'){
        try {
          wx.cloud.callFunction({
            name: 'ps_submit',
            data: { mode: entry.mode, score: entry.score, name: entry.name }
          }).then(function(res){ done(true, res && res.result); })
            .catch(function(){ done(false); });
        } catch(e){ done(false); }
        return;
      }
      if (bk === 'http'){
        const tok = PF.store.get('ps_token', '');
        if (!tok){ PF.cloud.ensureLogin(function(ok){ if (ok) PF.cloud.submitScore(entry, done); else done(false); }); return; }
        try {
          wx.request({
            url: PF.API_URL + '/submit', method: 'POST',
            header: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
            data: { mode: entry.mode, score: entry.score, name: entry.name },
            success: function(res){ done(res.statusCode === 200); },
            fail: function(){ done(false); }
          });
        } catch(e){ done(false); }
        return;
      }
      done(false);
    },
    topList: function(mode, done){
      const bk = PF.cloud.backend();
      if (bk === 'wxcloud'){
        try {
          wx.cloud.callFunction({ name: 'ps_top', data: { mode: mode } })
            .then(function(res){ done(res && res.result ? (res.result.rows || null) : null); })
            .catch(function(){ done(null); });
        } catch(e){ done(null); }
        return;
      }
      if (bk === 'http'){
        const tok = PF.store.get('ps_token', '');
        try {
          wx.request({
            url: PF.API_URL + '/top?mode=' + encodeURIComponent(mode), method: 'GET',
            header: tok ? { 'Authorization': 'Bearer ' + tok } : {},
            success: function(res){
              const d = res && res.data;
              done(res.statusCode === 200 && d && d.rows ? d.rows : null);
            },
            fail: function(){ done(null); }
          });
        } catch(e){ done(null); }
        return;
      }
      done(null);
    }
  },

  /* ---------- auth（登录态） ----------
     小游戏无登录界面：会话由微信隐式维护。这里做会话管理——checkSession 失效则 wx.login
     刷新，成功记 ps_login_ts；openid 不落地客户端（云函数上下文自带），界面只展示登录状态。 */
  auth: {
    state: 'unknown',   // unknown | web | ok | fail
    ensure: function(done){
      const self = PF.auth;
      if (!IS_WX){ self.state = 'web'; if (done) done(self.state); return; }
      const fin = function(ok){
        self.state = ok ? 'ok' : 'fail';
        if (ok) PF.store.set('ps_login_ts', String(Date.now()));
        if (ok) PF.cloud.ensureLogin();
        if (done) done(self.state);
      };
      try {
        wx.checkSession({
          success: function(){ fin(true); },
          fail: function(){
            try {
              wx.login({ success: function(){ fin(true); }, fail: function(){ fin(false); } });
            } catch(e){ fin(false); }
          }
        });
      } catch(e){ fin(false); }
    }
  },

  /* ---------- openData（开放数据域桥） ----------
     好友榜由 open-data-context 子目录渲染到共享画布，主域逐帧 blit。Web 无此能力。 */
  openData: (typeof wx !== 'undefined' && typeof wx.getOpenDataContext === 'function') ? {
    canvas: function(){
      try { return wx.getOpenDataContext().canvas; } catch(e){ return null; }
    },
    post: function(msg){
      try { wx.getOpenDataContext().postMessage(msg); } catch(e){}
    }
  } : null,

  init: function(opts){
    opts = opts || {};
    if (opts.adUnitId) PF.adUnitId = opts.adUnitId;
    if (IS_WX && typeof wx.cloud !== 'undefined'){
      const env = opts.cloudEnv || PF.CLOUD_ENV;
      if (env){
        try {
          wx.cloud.init({ env: env, traceUser: true });
          PF.cloud.env = env; PF.cloud.ready = true;
        } catch(e){}
      }
    }
    PF.auth.ensure();
  }
};

/* ---------------------------- state ---------------------------- */
const store = PF.store;

/* Rank ladder, lowest to highest (Space Cadet). */
const RANKS = [
  'CADET', 'ENSIGN', 'LIEUTENANT', 'CAPTAIN', 'LT COMMANDER',
  'COMMANDER', 'COMMODORE', 'ADMIRAL', 'FLEET ADMIRAL'
];
const RANK_ZH = [
  '见习军校生', '少尉', '中尉', '上尉', '少校',
  '中校', '准将', '上将', '五星上将'
];
const RANK_LIGHTS = 4;          // lights in the blue ring
const LIGHTS_PER_MISSION = 2;   // each mission lights two of them

const state = {
  score: 0,
  ballsLeft: 3,
  mult: 1,
  stars: [false, false, false],
  mode: 'ready',            // ready | play | over
  time: 0,
  shake: 0,
  flash: 0,
  banner: null,
  muted: false,
  best: +(store.get('ps_best', 0) || 0),

  rank: 0,                  // index into RANKS
  rankLights: 0,            // 0..RANK_LIGHTS
  flagCd: 0,                // 旗组合奖励冷却
  orangeLights: 0,          // 0..8, filled as ranks are earned
  missionsDone: 0,

  selected: -1,             // chosen mission slot (0..2) or -1
  selectedAt: 0,            // when it was chosen, so the ramp can't fire the same frame
  mission: null,            // {slot, kind, goal, prog, fuel, fuelT, base}

  tilt: 0,                  // seconds of tilt lockout remaining
  nudge: 0,                 // nudge heat
  wormCd: [0, 0, 0],        // per-wormhole re-entry cooldown
  wormArmed: -1,            // which hole was entered last (for pairing)
  skill: false,             // skill-shot window open
  skillTier: 0,             // 0..3, how deep the plunge went
  charge: 0,                // plunger charge 0..1 (hold to charge, release to fire)
  charging: false,
  chargeAt: 0,
  paused: false,
  plungeMin: 9999,          // highest point (min y) of the current plunge
  plungeStrike: -1,         // 撞杆击打动画计时（秒），-1 表示未在击打
  plungeFrom: 0,            // 本次击发的蓄力值，决定击打的后拉起点

  replay: false,            // REPLAY lamp lit -> next drain is saved
  lanes: [false, false, false],  // three rollover lamps on the top arc
  bumpersHot: false,        // full-level re-completion -> extra-hot bumpers
  bumperLv: 0,              // 缓冲器等级 0..3（蓝→绿→黄→红，原版核心升级线）
  bumperLvT: 0,             // 距离降级倒计时（约 60 秒不升级降一级）
  launchAt: -99,            // 本次发球离开发射道的时刻（15 秒坠毁可重新部署）
  laneCdArr: [0, 0, 0],     // per-lamp debounce
  multiball: false,
  jackpot: 25000,           // grows while multiball runs, paid when it ends
  blackHoleCharge: 0,       // 0..3, accumulated by repeats in one wormhole
  endBonus: 0,              // last end-of-ball bonus, shown on the summary

  /* ---- competition / mini-program layer ---- */
  screen: 'menu',           // menu | play | over | board | revive
  gameMode: 'classic',      // classic | daily | timed
  comboT: 0,                // combo window countdown
  combo: 0,                 // consecutive scoring shots
  comboBest: 0,
  reviveUsed: 0,            // rewarded-video revives taken this run
  revivesAllowed: 2,        // cap per run
  timeLeft: 0,              // seconds left in a timed run
  dailySeed: 0,
  boardMode: 'classic',
  boardSrc: 'local',
  friendsReq: false,
  natBoard: null,
  natLoading: false,
  natReq: false,
  board: null,              // cached leaderboard rows
  boardLoading: false,
  menuSel: 0,               // 0 classic / 1 daily / 2 board
  overSel: 0,               // 0 revive / 1 restart / 2 board
  btnRects: [],             // hit areas rebuilt each frame
  warpLevel: 0,             // WARP progress (0..4) — extra multiplier track
  pendingSubmit: false,
  profile: null,            // loaded at boot (unlocks, lifetime stats, cosmetics)
  runWorms: 0, runRamps: 0, // per-run counters for titles

  /* ---- CADET DRILL (教官紧急指令) ----
     无任务进行时，教官会随机下达限时指令（打缓冲器 / 进虫洞…），
     完成即得嘉奖分并推进军衔灯；超时作废。 */
  drill: null,              // {kind, goal, prog, tLeft, spot, label, reward}
  drillCd: 18,              // seconds until the next drill is issued
  drillStreak: 0,           // 教官嘉奖连击: drills completed in a row this run
  scoreDoubled: false,      // rewarded-video double settlement used this run
  supportArmed: false,      // 教官支援包 flag: next restart grants +1 ball

  /* ---- per-ball counters ---- */
  ballMissions: 0,          // missions completed with the current ball
  ballRamps: 0,             // ramp rides with the current ball
  runWormSet: {},           // wormhole colours visited with the current ball

  /* ---- outlane hatches (危险通道) ---- */
  gateT: 22,                // seconds until the next hatch event

  /* ---- 二层甲板 ---- */
  deckRides: 0,             // 本局上二层的次数
  saucerLocks: 0,           // 二层分流全亮计数 (三路点亮开多球)

  /* ---- 区域化玩法 (zones) ----
     台面按功能分区：发射区 / 接任务区 / 一层碰撞区 / 二层碰撞区 / 虫洞区。
     每个分区都是一个真实的物理模块，任务按分区下发。 */
  dockCd: 0,                // 接任务模组 debounce
  dockSlot: 0,              // 模组当前挂着的任务槽 (0..2)
  dockPop: 0,               // 命中动画
  vukCd: 0,                 // 日核弹射器 cooldown

  missionLamps: 0,          // 总体任务灯 0..LAMP_N (完成任务点亮)
  reward: null,             // {id, zh, tLeft, total} 任务链奖励
  rewardIdx: 0,             // 奖励轮换指针
  rewardMult: 1,            // 奖励带来的得分倍率
  freeT: 0,                 // 自由部署模式下的补发计时

  bhOpen: 0,                // 黑洞开启剩余秒数 (>0 = 引力在线)
  bhPulse: 0,               // 黑洞命中动画
  bhCd: 0,                  // 黑洞吸收冷却

  warpLink: null,           // {a, b, t} 虫洞连线可视化
  warpChain: 0,             // 虫洞连锁计数
  warpChainT: 0,

/* The three slots shown on the table. Which missions they hold depends on rank,
   so the mission set grows as you climb. */
/* The three slots on the table are the current chapter's mission set, so the mission
   mix advances with the campaign instead of rotating at random. */
function missionSlots(){
  const ch = CHAPTERS[Math.min(state.rank, CHAPTERS.length - 1)];
  const out = [];
  for (let i = 0; i < 3; i++){
    let def = null;
    for (let k = 0; k < MISSIONS.length; k++) if (MISSIONS[k].id === ch.ms[i]) def = MISSIONS[k];
    out.push(def || MISSIONS[i]);
  }
  return out;
}

function issueDrill(){
  const d = DRILLS[(Math.random() * DRILLS.length) | 0];
  state.drill = {
    kind: d.kind, goal: d.goal, prog: 0,
    tLeft: d.t, total: d.t,
    spot: d.spot, label: d.label,
    reward: 6000 + state.rank * 3000
  };
  state.banner = {t:1.8, text:'教官指令', sub:d.label + ' · ' + d.t + ' 秒'};
  sfx.select();
  state.flash = 0.4;
}

function drillProgress(kind, amount){
  const d = state.drill;
  if (!d || !kindMatch(d.kind, kind)) return;
  d.prog += (amount === undefined ? 1 : amount);
  if (d.prog >= d.goal) completeDrill();
}

function completeDrill(){
  const d = state.drill;
  state.drill = null;
  state.drillCd = 26 + Math.random() * 16;
  state.drillStreak++;
  addScore(d.reward, 240, 560, C.orange);
  // 教官嘉奖 also nudges the rank ring, so drills feed the Space-Cadet ladder
  if (!state.mission && state.rankLights < RANK_LIGHTS){
    state.rankLights++;
    popText(240, 372, '军衔进度 +1', C.blue);
  }
  state.banner = {t:1.8, text:'指令完成', sub:'教官嘉奖 +' + d.reward};
  state.flash = 0.8;
  state.shake = 8;
  sfx.rank();
  burst(240, 540, C.orange, 26, 320);
}

function failDrill(){
  state.drill = null;
  state.drillCd = 24 + Math.random() * 14;
  state.drillStreak = 0;
  state.banner = {t:1.4, text:'指令超时', sub:'教官摇头离开了通讯频道'};
  tone(200, 0.4, 'triangle', 0.05, 90);
}

function drillTick(dt){
  // only during live play, and never alongside a mission (the HUD would fight)
  if (state.screen !== 'play' || state.mode !== 'play') return;
  if (state.drill){
    state.drill.tLeft -= dt;
    if (state.drill.tLeft <= 0) failDrill();
  } else if (!state.mission){
    state.drillCd -= dt;
    if (state.drillCd <= 0) issueDrill();
  }
}

/* Persistent unlocks & lifetime stats, kept in one JSON blob. */
function loadProfile(){
  try {
    const raw = PF.store.get('ps_profile', '');
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return {totMissions:0, totRamps:0, bestRank:0, titles:[],
          skin:'classic', trail:'none', plunger:'std'};
}
function saveProfile(){ PF.store.set('ps_profile', JSON.stringify(state.profile)); }
function needMet(need){
  if (!need) return true;
  const p = state.profile;
  if (need.tot_missions && p.totMissions >= need.tot_missions) return true;
  if (need.best_rank    && p.bestRank    >= need.best_rank)    return true;
  if (need.tot_ramps    && p.totRamps    >= need.tot_ramps)    return true;
  return false;
}
function grantTitle(id){
  const p = state.profile;
  if (p.titles.indexOf(id) >= 0) return;
  p.titles.push(id);
  saveProfile();
  let zh = id;
  for (let i = 0; i < TITLES.length; i++) if (TITLES[i].id === id) zh = TITLES[i].zh;
  state.banner = {t:1.8, text:'称号解锁', sub:zh};
  sfx.rank();
}

const WALLS = [];
function wall(ax, ay, bx, by, r, e){
  WALLS.push({ax:ax, ay:ay, bx:bx, by:by, r:(r===undefined?6:r), e:(e===undefined?0.45:e)});
}
function arcWall(cx, cy, rad, a0, a1, steps){
  for (let i = 0; i < steps; i++){
    const t0 = a0 + (a1 - a0) * i / steps;
    const t1 = a0 + (a1 - a0) * (i + 1) / steps;
    wall(cx + Math.cos(t0) * rad, cy + Math.sin(t0) * rad,
         cx + Math.cos(t1) * rad, cy + Math.sin(t1) * rad, 6, 0.45);
  }
}

/* ① 落靶 (Drop Targets)：3 枚竖排在右墙内侧。立着时是实体，撞上即被击落；
   3 枚全落给一笔奖励并复位。原版台面右侧有一组同款，是"看得见的进度条"。 */
/* ============================ 落靶衬板 (target bank) ============================
   原版结构：沿**发射道内墙**一段一段的衬板——每段向场地凸出二十几像素，
   段与段之间留缝，段的外缘上压着可被击落的靶条。
   关键是**凸出很浅**：原版这块只占内墙外侧一条窄带，球从它外侧正常滚过；
   做成一大块伸进场地的三角形会直接把右侧走廊堵死（上一版就是这么错的）。

   我们这里三段宽度递减（26 → 22 → 18），整体轮廓收窄成楔形，
   读作"从发射区旁边长出来的三角结构"，但占地始终只有 20 多像素。 */
/* 竖向只占 356~480。**这一条是硬约束**：衬板底 480 → 右弹射器顶 597 必须留出
   一整段敞开通道，否则球从右侧下来无路可走（上一版占到 554 就是这样堵死的）。 */
const DROP_BANK = {
  WX: 402,                          // 内缘：贴发射道内墙外侧
  T0: {x: 402, y: 356},             // 内上角
  T1: {x: 382, y: 418},             // 外尖：朝场地的顶点，凸出 20px
  T2: {x: 402, y: 480},             // 内下角
  down: [false, false, false], pop: [0, 0, 0], cd: 0, resetT: 0
};
/* 三枚靶：上斜边两枚、下斜边一枚，围着外尖分布。
   每个靶心 = 斜边插值点沿外法向推 4px，正好骑在棱上。 */
DROP_BANK.t = (function(){
  const out = [];
  const along = function(P, Q, u){
    const dx = Q.x - P.x, dy = Q.y - P.y;
    const L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L;        // 外法向（朝场地）
    return {x: P.x + dx * u + nx * 2, y: P.y + dy * u + ny * 2};
  };
  out.push(along(DROP_BANK.T0, DROP_BANK.T1, 0.50));
  out.push(along(DROP_BANK.T1, DROP_BANK.T2, 0.24));
  out.push(along(DROP_BANK.T1, DROP_BANK.T2, 0.70));
  return out;
})();

/* 原版式二层入口：架空坡道桥（黄黑警示条纹）+ 流线型喇叭入口。
   坡道口在台面**右侧**（发射道上方、右墙一侧）：球沿右墙上撩滚入喇叭口，

   桥面是架空的（绘制有桥墩/桥底/投影），一层球能从桥下通道穿过——对应原版坡道桥。 */
/* Catmull-Rom 细分：把稀疏控制点插值成平滑密集路径。
   物理(stepBall)与绘制(rampPoint/rampFrame)遍历同一数组，轨迹天然重合、弧线流畅。 */
function smoothPath(pts, sub){
  sub = sub || 6;
  const out = [];
  function P(i){ return pts[Math.max(0, Math.min(pts.length - 1, i))]; }
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = P(i-1), p1 = P(i), p2 = P(i+1), p3 = P(i+2);
    for (let j = 0; j < sub; j++){
      const t = j / sub, t2 = t*t, t3 = t2*t;
      out.push({
        x: 0.5*((2*p1.x) + (-p0.x+p2.x)*t + (2*p0.x-5*p1.x+4*p2.x-p3.x)*t2 + (-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
        y: 0.5*((2*p1.y) + (-p0.y+p2.y)*t + (2*p0.y-5*p1.y+4*p2.y-p3.y)*t2 + (-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
      });
    }
  }
  out.push({x:pts[pts.length-1].x, y:pts[pts.length-1].y});
  return out;
}

/* ---------------------------- flippers ---------------------------- */
function Flipper(px, py, len, rest, active){
  this.px = px; this.py = py; this.len = len;
  this.rest = rest; this.active = active;
  this.angle = rest; this.omega = 0; this.pressed = false;
}
Flipper.prototype.update = function(dt){
  const prev = this.angle;
  const target = this.pressed ? this.active : this.rest;
  const spd = this.pressed ? 19 : 12;
  if (this.angle < target) this.angle = Math.min(target, this.angle + spd * dt);
  else                     this.angle = Math.max(target, this.angle - spd * dt);
  this.omega = (this.angle - prev) / dt;
};
Flipper.prototype.tip = function(){
  return {x: this.px + Math.cos(this.angle) * this.len,
          y: this.py + Math.sin(this.angle) * this.len};
};

const leftF  = new Flipper(FLIP_L.px, FLIP_L.py, FLIP_L.len, FLIP_L.rest, FLIP_L.act);

/* ---------------------------- audio ---------------------------- */
let actx = null;
function ac(){
  if (!actx){
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      // 部分机型/基础库的 WebAudio 上下文不完整，缺关键工厂方法时整体降级为静音，
      // 避免 createGain/createOscillator 抛错冒泡到 pointerDown 中断挡板/发球操作。
      if (actx && (typeof actx.createGain !== 'function' || typeof actx.createOscillator !== 'function')) actx = null;
    } catch(e){ actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, f2, delay){
  if (state.muted) return;
  const a = ac(); if (!a) return;
  const t0 = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol || 0.07, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
/* ---- 击打声：模态合成 ----
   真实金属撞击不是单个方波，而是一组**非谐波泛音**各自独立地指数衰减（模态合成），
   再叠一个极短的噪声瞬态当作锤头接触的那声"咔"。原版直接播 WAV 采样；在没有采样
   资源的情况下，模态合成是最接近真实金属质感的做法，而且不占任何音频资源体积。 */
let noiseBuf = null;
function getNoise(a){
  if (!noiseBuf){
    const n = Math.floor(a.sampleRate * 0.25);
    noiseBuf = a.createBuffer(1, n, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
function noiseHit(a, t0, dur, freq, q, vol, type){
  if (!a || !a.createBufferSource || !a.createBiquadFilter) return;   // 低版本音频接口静音降级
  const src = a.createBufferSource(); src.buffer = getNoise(a);
  const f = a.createBiquadFilter(); f.type = type || 'bandpass';
  f.frequency.value = freq; f.Q.value = q || 1;
  const g = a.createGain();
  g.gain.setValueAtTime(Math.max(0.0002, vol), t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(t0); src.stop(t0 + dur + 0.02);
}
const METAL_RATIOS = [1, 2.756, 5.404, 8.933];   // 金属棒的自由振动模态比
const METAL_AMPS   = [1, 0.5, 0.26, 0.13];
function metalHit(freq, dur, vol, bright){
  if (state.muted) return;
  const a = ac(); if (!a) return;
  const t0 = a.currentTime;
  const out = a.createGain(); out.gain.value = vol; out.connect(a.destination);
  for (let i = 0; i < METAL_RATIOS.length; i++){
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.value = freq * METAL_RATIOS[i] * (0.985 + Math.random() * 0.03);
    const d = dur / (1 + i * 1.15);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(METAL_AMPS[i], t0 + 0.0015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(out);
    o.start(t0); o.stop(t0 + d + 0.02);
  }
  noiseHit(a, t0, 0.025, freq * 4, 0.7, (bright || 0.5) * vol * 1.6);
}
function thud(freq, dur, vol){
  if (state.muted) return;
  const a = ac(); if (!a) return;
  const t0 = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq * 1.9, t0);
  o.frequency.exponentialRampToValueAtTime(freq, t0 + dur * 0.6);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
  noiseHit(a, t0, 0.05, freq * 4, 0.6, vol * 0.45, 'lowpass');
}
function clack(vol){
  if (state.muted) return;
  const a = ac(); if (!a) return;
  const t0 = a.currentTime;
  noiseHit(a, t0, 0.035, 1800, 0.8, vol * 0.5, 'highpass');
  thud(140, 0.06, vol * 0.8);
}

/* ---------------------------- particles / fx ---------------------------- */
const parts = [];
const pops  = [];
function burst(x, y, color, n, spd){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const s = (spd || 200) * (0.3 + Math.random() * 0.9);
    parts.push({x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
                life:1, max:0.5 + Math.random()*0.5, c:color,
                r:1.5 + Math.random()*2.5});
  }
  if (parts.length > 320) parts.splice(0, parts.length - 320);
}
function popText(x, y, text, color){
  pops.push({x:x, y:y, text:text, c:color || C.gold, life:1, vy:-52});
  if (pops.length > 24) pops.shift();
}

/* ---------------------------- scoring ---------------------------- */
function addScore(n, x, y, color){
  /* 反射射门 Reflex Shot：挡板击球后 1.4 秒内命中计分目标，追加 25%。
     reflexUsed 保证一次挡板只能触发一次，避免连打刷分。 */
  if (state.reflexT > 0 && !state.reflexUsed && n >= 500){
    state.reflexUsed = true;
    const rb = Math.round(n * state.mult * (state.rewardMult || 1) * 0.25);
    state.score += rb;
    state.banner = {t:1.3, text:'REFLEX SHOT', sub:'+' + rb};
    if (x !== undefined) popText(x, y - 16, 'REFLEX +' + rb, C.gold);
    sfx.select();
  }
  const v = Math.round(n * state.mult * (state.rewardMult || 1));
  state.score += v;

  /* COMBO: every scoring hit inside a 2.2s window stacks; the stack feeds WARP and the
     displayed multiplier. This is the "one more shot" pull the reference table has. */
  if (n >= 60){
    state.combo++;
    state.comboT = 2.2;
    if (state.combo > state.comboBest) state.comboBest = state.combo;
    if (state.combo >= 20) grantTitle('combo20');
    if (state.combo > 0 && state.combo % 8 === 0 && state.warpLevel < 4){
      state.warpLevel++;
      state.mult = Math.min(9, state.mult + 1);
      state.banner = {t:1.5, text:'WARP ' + state.warpLevel, sub:'倍率 ×' + state.mult};
      sfx.rank();
      state.flash = 0.6;
    }
  }

  if (state.score > state.best){
    state.best = state.score;
    store.set('ps_best', state.best);
  }
  if (x !== undefined) popText(x, y, '+' + v, color);
}

function lightStar(idx){
  if (state.stars[idx]) return;
  state.stars[idx] = true;
  if (state.stars[0] && state.stars[1] && state.stars[2]){
    addScore(5000);
    state.mult = Math.min(5, state.mult + 1);
    state.stars = [false, false, false];
    state.banner = {t:1.6, text:'★ STAR BONUS ★', sub:'倍率 ×' + state.mult};
    state.flash = 1;
    state.shake = 12;
    sfx.star();
    burst(240, 400, C.gold, 40, 420);
    missionProgress('star');
  }
}

/* ---------------------------- mission engine ---------------------------- */
/* 分区映射: 每个任务阶段都发生在一个具名分区里，HUD 会明确告诉玩家「去哪个区」，
   台面上的分区框也会同步脉冲。 */
function zoneOf(kind){
  if (!kind) return 'lower';
  if (kind === 'ub' || kind === 'ubx') return 'upper';
  if (kind === 'lane') return 'lower';   // 满力发射在一层发射区完成
  if (kind === 'w0' || kind === 'w1' || kind === 'w2' || kind === 'worm') return 'void';
  if (kind === 'dock') return 'dock';
  if (kind === 'bh')   return 'hole';
  return 'lower';
}
function zoneNow(){
  const st = stageNow();
  return st ? zoneOf(st.kind) : null;
}

/* selecting a slot now LOADS the mission into the dock — the dock is what hands it out */
function selectMission(slot){
  if (slot < 0 || slot >= 3) return;      // only three mission targets exist
  state.selected = slot;
  state.dockSlot = slot;
  state.selectedAt = state.time;
  DOCK.spin = 1;
  const def = missionSlots()[slot];
  if (!def) return;
  state.banner = {t:1.4, text:'任务已装填', sub:'上左发射坡道接取 · ' + def.zh};
  sfx.select();
  burst(DECK_LANES[slot].x, DECK_LANES[slot].y, C.cyan, 12, 200);
}

function startMission(slot){
  if (state.mission) return false;
  if (slot === undefined || slot === null || slot < 0 || slot > 2) slot = state.dockSlot;
  const def = missionSlots()[slot];
  if (!def) return false;
  state.mission = {
    slot: slot,
    def: def,
    stage: 0,
    prog: 0,
    fuel: FUEL_N,
    fuelT: 0
  };
  state.selected = -1;
  state.banner = {t:1.8, text:'任务开始', sub:def.zh + ' · ' + def.name};
  sfx.start();
  state.flash = 0.7;
  popText(DOCK.x, DOCK.y - 44, 'MISSION GO', C.gold);
  burst(DOCK.x, DOCK.y, C.gold, 22, 300);
  return true;
}

/* 接任务模组被撞: 没任务 -> 接下装填的任务; 有任务 -> 补给任务数据 (燃料 + 分数) */
function dockHit(b){
  if (state.dockCd > 0) return;
  state.dockCd = 0.9;
  DOCK.pop = 1;
  // punt the ball sideways off the module so it cannot ping-pong with the VUK below
  const dir = (Math.abs(b.x - DOCK.x) < 8) ? (Math.random() < 0.5 ? -1 : 1)
                                           : (b.x < DOCK.x ? -1 : 1);
  b.vx = dir * (170 + Math.random() * 110);
  b.vy = -(190 + Math.random() * 110);
  b.x = DOCK.x + dir * (DOCK.r + b.r + 1);
  b.y = DOCK.y + 6;
  state.shake = 6;

  /* 任务站不再发任务：原版只有坡道能接。这里改成"任务数据补给站"——
     有装填槽时提示去坡道，没装填时提示先去任务靶选任务。 */
  if (!state.mission){
    if (state.selected >= 0){
      state.banner = {t:1.5, text:'任务已装填', sub:'上左发射坡道接取'};
    } else {
      state.banner = {t:1.5, text:'未选择任务', sub:'先打亮顶部三个任务靶'};
    }
    sfx.select();
    addScore(1500, DOCK.x, DOCK.y - 34, C.gold);
    return;
  }
  addScore(3000, DOCK.x, DOCK.y - 34, C.gold);
  popText(DOCK.x, DOCK.y - 50, '任务数据 +3000', C.gold);
  if (state.mission.fuel < FUEL_N){
    state.mission.fuel = Math.min(FUEL_N, state.mission.fuel + 2);
    sfx.fuel();
  }
  burst(DOCK.x, DOCK.y, C.gold, 10, 200);
  missionProgress('dock', 1);
}

/* the stage the running mission is currently on, or null */
function stageNow(){
  const m = state.mission;
  if (!m) return null;
  return m.def.stages[m.stage] || null;
}

/* An event fired. Only the CURRENT stage listens, which is what makes stages ordered.
   Group kinds (bumper / sling / posts) accept any member spot. */
function kindMatch(stageKind, fired){
  if (stageKind === fired) return true;
  if (stageKind === 'bumper') return fired === 'b0' || fired === 'b1' || fired === 'b2';
  if (stageKind === 'sling')  return fired === 's0' || fired === 's1';
  if (stageKind === 'posts')  return fired === 'p0' || fired === 'p1';
  return false;
}
function missionProgress(kind, amount){
  drillProgress(kind, amount);   // 教官指令 listens on the same event bus as missions
  const m = state.mission;
  const st = stageNow();
  if (!m || !st || !kindMatch(st.kind, kind)) return;
  m.prog += (amount === undefined ? 1 : amount);
  if (m.prog >= st.goal) advanceStage();
}

function advanceStage(){
  const m = state.mission;
  if (!m) return;
  const done = m.def.stages[m.stage];
  m.stage++;
  m.prog = 0;
  const next = stageNow();
  if (!next){ completeMission(); return; }

  addScore(1500 * m.stage);
  state.banner = {t:1.5, text:'阶段完成', sub:done.zh + ' → ' + next.zh};
  sfx.select();
  burst(240, 330, C.cyan, 14, 240);
  state.shake = 5;
}

function completeMission(){
  const m = state.mission;
  state.mission = null;
  state.missionsDone++;
  state.ballMissions++;
  state.rankLights += LIGHTS_PER_MISSION;
  state.profile.totMissions++;
  saveProfile();
  if (state.missionsDone >= 2) grantTitle('mission2');

  const bonus = m.def.bonus + state.rank * 12000;
  addScore(bonus);

  /* Jackpot 随任务累积：每完成 2 个任务翻一倍（上限 500 万），对应原版 Jackpot Doubled。 */
  let jpDoubled = false;
  if (state.missionsDone % 2 === 0 && state.jackpot < 5000000){
    state.jackpot = Math.min(5000000, state.jackpot * 2);
    jpDoubled = true;
  }

  // The original grants a REPLAY (a ball save, not just points) on mission completion.
  grantReplay();

  // ---- 总体任务灯 + 装置联动 ----
  // 每完成一个任务点亮一盏总体任务灯，同时给台面上的黑洞供电。这是「任务不是为了
  // 分数，而是为了把台面装置接上电」的原版结构。
  if (state.missionLamps < LAMP_N){
    MISSION_LAMPS[state.missionLamps].pop = 1;
    state.missionLamps++;
  }
  openBlackHole(15 + state.rank * 2, '任务完成');

  state.banner = {t:2.0, text:'任务完成', sub:m.def.name + '  +' + bonus + (jpDoubled ? ' · JACKPOT ×2' : '')};
  state.flash = 1;
  state.shake = 10;
  sfx.rank();
  burst(240, 300, C.green, 34, 380);

  if (state.missionLamps >= LAMP_N) triggerMissionChain();

  if (state.rankLights >= RANK_LIGHTS) promote();
  else popText(240, 372, '⊙ ' + state.rankLights + '/' + RANK_LIGHTS, C.blue);
}

/* 任务链: 点满 4 盏总体任务灯 -> 换一个「爽点」奖励，然后灯组复位 */
function triggerMissionChain(){
  state.missionLamps = 0;
  for (let i = 0; i < MISSION_LAMPS.length; i++) MISSION_LAMPS[i].pop = 1;
  state.flash = 1;
  state.shake = 14;
  activateReward();
}

/* ---------------------------- 任务链奖励 (reward modes) ---------------------------- */
/* 点满总体任务灯后的「爽点」。三条奖励都刻意留了上限：加速有速度上限、自由部署最多
   3 球同场（满屏球既容易密集恐惧，也彻底毁掉台面可读性）、黑洞扩张有射程上限。 */
const REWARDS = [
  {id:'overdrive',  zh:'超载推进', sub:'12 秒 · 球速 ×1.35 · 全部得分 ×2', t:12},
  {id:'freedeploy', zh:'自由部署', sub:'8 秒 · 持续补发（场上最多 3 球）',  t:8},
  {id:'hyperhole',  zh:'黑洞全开', sub:'20 秒 · 引力井扩张 · 得分 ×3',      t:20}
];

function activateReward(forceId){
  let r = null;
  for (let i = 0; i < REWARDS.length; i++) if (REWARDS[i].id === forceId) r = REWARDS[i];
  if (!r){ r = REWARDS[state.rewardIdx % REWARDS.length]; state.rewardIdx++; }
  state.reward = {id:r.id, zh:r.zh, sub:r.sub, tLeft:r.t, total:r.t};
  state.rewardMult = (r.id === 'overdrive') ? 2 : (r.id === 'hyperhole' ? 3 : 1);
  state.freeT = 0;
  if (r.id === 'overdrive'){
    for (let i = 0; i < balls.length; i++){
      balls[i].vx *= 1.35;
      balls[i].vy *= 1.35;
    }
  }
  if (r.id === 'hyperhole') openBlackHole(r.t, '黑洞全开');
  if (r.id === 'freedeploy') state.freeT = 0.35;
  state.banner = {t:2.4, text:'★ 任务链 · ' + r.zh, sub:r.sub};
  state.flash = 1;
  state.shake = 13;
  sfx.rank();
  burst(240, 300, C.gold, 44, 420);
}

function rewardTick(dt){
  const rw = state.reward;
  if (!rw) return;
  rw.tLeft -= dt;
  if (rw.id === 'freedeploy'){
    state.freeT -= dt;
    if (state.freeT <= 0){
      if (balls.length < 3){
        autoDeploy('lower');
        state.freeT = 1.7;
      } else {
        state.freeT = 0.4;
      }
    }
  }
  if (rw.tLeft <= 0){
    state.reward = null;
    state.rewardMult = 1;
    state.banner = {t:1.4, text:'奖励结束', sub:rw.zh};
  }
}

/* ---------------------------- 发球部署 (deployment) ---------------------------- */
/* 蓄力不是「打得越狠越好」，而是「决定这一杆怎么打」——原版发球没有轨道限制：
     0 - 45%   安全部署  -> 从发射槽正常出口落进一层碰撞区（稳，先活下来）
     45 - 85%  轨道强化  -> 高速直冲台面，补满燃料、激活缓冲器
     85 - 100% 满力出击  -> 全速直冲台面，+5000，推进满力发射任务
   蓄力槽上用三段颜色标出来，玩家一眼知道自己在选哪种打法。
   上二层的唯一路径是左墙升降井（左挡板沿墙高打）。 */
const DEPLOY_BANDS = [
  {id:'lower', zh:'安全部署', zone:'lower', c:'#5ee0ff', from:0.00, to:0.45},

function applyDeploy(b, id){
  if (!b) return;
  if (id === 'upper'){
    // 满力出击：全速沿发射道打出，冲过闸门直入台面（原版发球无轨道限制）

    addScore(5000, 434, 700, C.gold);
    state.banner = {t:1.5, text:'满力出击', sub:'全速冲出发射道  +5000'};
    state.flash = 0.6;
    state.shake = 7;
    // 满力发射 = 原「冲上高架坡道」任务的等价动作，推进 lane 目标
    missionProgress('lane', 1);
    state.runRamps++; state.ballRamps++;
    state.profile.totRamps++;
    saveProfile();
    if (state.runRamps >= 3) grantTitle('ramp3');
    burst(434, 760, C.gold, 16, 240);
    sfx.launch();
    return;
  }
  if (id === 'orbit'){
    // 轨道强化：中高速直冲台面，补满燃料并激活缓冲器（原坡道的燃料补给功能移植）
    b.vx = 0;
    b.vy = -(1180 + Math.random() * 140);
    b.trail.length = 0;
    if (state.mission) state.mission.fuel = FUEL_N;   // relight all fuel
    state.bumperLvT = Math.max(state.bumperLvT || 0, 20);
    state.banner = {t:1.4, text:'轨道强化', sub:'高速冲出台面 · 燃料补满 · 缓冲器激活'};
    state.flash = 0.45;
    missionProgress('lane', 1);
    burst(434, 760, '#a78bfa', 10, 180);
    sfx.launch();
    return;
  }
  // safe deploy: up the lane fast enough to exit the gate
  b.vx = 0;
  b.vy = -(880 + Math.random() * 60);
  burst(434, 770, C.blue, 10, 160);
  sfx.launch();
  state.banner = {t:1.2, text:'安全部署', sub:'一层碰撞区 · 稳住节奏'};
}

function autoDeploy(id){

/* 防御式 DOM 取元素：小游戏端的 document 桩可能完全不可修补（冻结实例+自有访问器），
   直接调用会抛 TypeError。网页端走真实 document，行为不变。（同步区内，两文件镜像） */
function docById(id){

      ? document.getElementById(id) : null;

}
function grantReplay(){

function abortMission(reason){

/* ---------------------------- collisions ---------------------------- */
/* Real bumpers never reflect perfectly. A tiny random tangential component is added
   to every kick; without it a ball can settle into a stable vertical loop between two
   opposed objects (observed: centre bumper <-> centre mission target) and score
   forever without ever coming down. */
function jitter(b, amount){
  const ang = (Math.random() - 0.5) * amount;
  const cs = Math.cos(ang), sn = Math.sin(ang);
  const vx = b.vx * cs - b.vy * sn;
  const vy = b.vx * sn + b.vy * cs;
  b.vx = vx; b.vy = vy;
}

/* 两线段是否相交（含端点接触）——闸口穿越判定用 */
function segCross(ax, ay, bx, by, cx, cy, dx, dy){
  const d1 = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
  const d2 = (bx - ax) * (dy - ay) - (by - ay) * (dx - ax);
  const d3 = (dx - cx) * (ay - cy) - (dy - cy) * (ax - cx);
  const d4 = (dx - cx) * (by - cy) - (dy - cy) * (bx - cx);
  return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
}

function resolveSeg(b, ax, ay, bx, by, sr, e){
  const abx = bx - ax, aby = by - ay;
  const L2 = abx * abx + aby * aby || 1;
  let t = ((b.x - ax) * abx + (b.y - ay) * aby) / L2;
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  const px = ax + abx * t, py = ay + aby * t;
  let nx = b.x - px, ny = b.y - py;
  let d = Math.sqrt(nx*nx + ny*ny);
  const minD = b.r + sr;
  if (d >= minD) return null;
  if (d < 0.0001){ nx = 0; ny = -1; } else { nx /= d; ny /= d; }
  b.x = px + nx * minD;
  b.y = py + ny * minD;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0){
    b.vx -= (1 + e) * vn * nx;
    b.vy -= (1 + e) * vn * ny;
    return {nx:nx, ny:ny, px:px, py:py, vn:vn};
  }
  return null;
}

function resolveCirc(b, cx, cy, cr, e){
  let nx = b.x - cx, ny = b.y - cy;
  let d = Math.sqrt(nx*nx + ny*ny);
  const minD = b.r + cr;
  if (d >= minD) return null;
  if (d < 0.0001){ nx = 0; ny = -1; } else { nx /= d; ny /= d; }
  b.x = cx + nx * minD;
  b.y = cy + ny * minD;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0){
    b.vx -= (1 + e) * vn * nx;
    b.vy -= (1 + e) * vn * ny;
    return {nx:nx, ny:ny, px:cx + nx*cr, py:cy + ny*cr, vn:vn};
  }
  return null;
}

function flipperCollide(b, f){
  const tip = f.tip();
  const abx = tip.x - f.px, aby = tip.y - f.py;
  const L2 = abx*abx + aby*aby || 1;
  let t = ((b.x - f.px) * abx + (b.y - f.py) * aby) / L2;
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  const px = f.px + abx * t, py = f.py + aby * t;
  let nx = b.x - px, ny = b.y - py;
  let d = Math.sqrt(nx*nx + ny*ny);
  // visual flipper half-thickness is 8.5 (stroke 17); keep the collider just inside it
  const minD = b.r + 8;
  if (d >= minD) return;
  if (d < 0.0001){ nx = 0; ny = -1; } else { nx /= d; ny /= d; }
  b.x = px + nx * minD;
  b.y = py + ny * minD;

  const rx = px - f.px, ry = py - f.py;
  const pvx = -f.omega * ry * 0.65;
  const pvy =  f.omega * rx * 0.65;
  const rvx = b.vx - pvx, rvy = b.vy - pvy;
  const vn = rvx * nx + rvy * ny;
  if (vn < 0){
    const j = -(1 + 0.35) * vn;
    b.vx += j * nx;
    b.vy += j * ny;
  }
  if (f.pressed && Math.abs(f.omega) > 3){
    const k = Math.min(1, Math.abs(f.omega) / 19);
    b.vx += nx * 240 * k;
    b.vy += ny * 240 * k;
    // 挡板主动击球：开启反射射门窗口
    state.reflexT = 1.4;
    state.reflexUsed = false;
  }
}

/* ---------------------------- wormholes ---------------------------- */
function enterWorm(i){
  const w = WORMS[i];
  w.pop = 1;
  state.runWorms++;
  state.runWormSet[i] = 1;
  if (state.runWorms >= 5) grantTitle('worm5');

  // 虫洞连锁: 出洞后短时间内又进了另一个洞 -> 连锁加成，鼓励"被抛来抛去"
  if (state.warpChainT > 0) state.warpChain++;
  else state.warpChain = 1;
  state.warpChainT = 3.4;
  const chain = state.warpChain;

  addScore((state.bumpersHot ? 2000 : 750) + (chain > 1 ? (chain - 1) * 1500 : 0),
           w.x, w.y - 26, w.c);
  if (chain > 1) popText(w.x, w.y - 58, '虫洞链 ×' + chain, w.c);
  burst(w.x, w.y, w.c, 16, 260);
  sfx.worm();
  state.shake = 6;
  missionProgress('w' + i, 1);

  if (state.wormArmed === -1){
    state.wormArmed = i;                       // first lock: this colour is armed
    popText(w.x, w.y - 44, 'LOCKED', w.c);
    sfx.fuel();
    return;
  }
  if (state.wormArmed !== i){
    state.wormArmed = -1;                      // opposite colour = match -> multiball
    startMultiball();
    return;
  }
  // same hole again: resonance feeds the black hole
  state.blackHoleCharge = Math.min(3, state.blackHoleCharge + 1);
  popText(w.x, w.y - 44, '共振 ' + state.blackHoleCharge + '/3', w.c);
  if (state.blackHoleCharge >= 3){
    state.blackHoleCharge = 0;
    addScore(50000, BLACKHOLE.x, BLACKHOLE.y, '#b79cff');
    state.flash = 1;
    sfx.star();
    burst(BLACKHOLE.x, BLACKHOLE.y, '#b79cff', 40, 400);
    openBlackHole(20, '虫洞共振');
  }
}

/* ---------------------------- 黑洞 (black hole) ---------------------------- */
/* 一个纯引力模块: 关闭时只是一圈暗环，开启后球经过会被拉弯轨迹并加分，真正掉进去
   则被吞下并抛回台面。它只由「完成任务」打开——这正是原版里任务与台面装置联动的
   味道: 任务不是为了分数，而是为了解锁台面上的装置。 */
function openBlackHole(sec, why){
  const was = state.bhOpen;
  state.bhOpen = Math.max(state.bhOpen, sec);
  BLACKHOLE.pop = 1;
  if (was <= 0){
    state.banner = {t:1.9, text:'黑洞开启', sub:(why || '任务完成') + ' · 引力井在线 ' + Math.round(sec) + 's'};
    state.flash = 0.9;
    state.shake = 8;
    sfx.star();
    burst(BLACKHOLE.x, BLACKHOLE.y, '#b79cff', 32, 360);
  }
}

function blackHolePull(b, dt){
  if (b.bhCd > 0){ b.bhCd = Math.max(0, b.bhCd - dt); return; }
  if (state.bhOpen <= 0 || b.deck !== 'lower') return;
  const hyper = !!(state.reward && state.reward.id === 'hyperhole');
  const ring = BLACKHOLE.ring * (hyper ? 1.4 : 1);
  const dx = b.x - BLACKHOLE.x, dy = b.y - BLACKHOLE.y;
  const d2 = dx*dx + dy*dy;
  if (d2 > ring * ring) return;
  const d = Math.sqrt(d2) || 0.001;
  const sp = Math.sqrt(b.vx*b.vx + b.vy*b.vy);

  // dead centre: swallowed, jackpot, thrown back out
  if (d < BLACKHOLE.r + b.r && sp < 980){
    b.bhT = 0.55;
    b.hidden = true;
    b.vx = 0; b.vy = 0;
    b.trail.length = 0;
    const pts = hyper ? 60000 : 30000;
    addScore(pts, BLACKHOLE.x, BLACKHOLE.y + 26, '#c9b6ff');
    state.banner = {t:1.5, text:'黑洞吞噬', sub:'+' + pts + ' · 奇点弹射'};
    state.flash = 0.85;
    state.shake = 11;
    sfx.star();
    burst(BLACKHOLE.x, BLACKHOLE.y, '#b79cff', 34, 340);
    return;
  }

  // fly-by: bend the velocity toward the singularity, and pay for the privilege
  if (sp < 70) return;
  const want = Math.atan2(-dy, -dx);
  const cur  = Math.atan2(b.vy, b.vx);
  let diff = ((want - cur + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  const k = 0.10 + 0.34 * (1 - d / ring);
  const na = cur + diff * k;
  b.vx = Math.cos(na) * sp;
  b.vy = Math.sin(na) * sp;
  b.bhCd = 0.4;
  BLACKHOLE.pull = 1;
  addScore(hyper ? 4000 : 2000, b.x, b.y - 20, '#c9b6ff');
  popText(b.x, b.y - 32, '引力偏移', '#c9b6ff');
  burst(b.x, b.y, '#b79cff', 7, 130);
  missionProgress('bh', 1);
}

/* Rollover lamp: light it and keep it lit; all three lit = bumpers hot. (The original
   toggles a lamp off when you pass again, but here one orbit crosses all three within a
   fraction of a second, so toggling made the goal unreachable by skill.) */
function hitLane(i){
  if (state.laneCdArr[i] > 0) return;
  state.laneCdArr[i] = 0.4;
  if (state.lanes[i]) return;

  state.lanes[i] = true;
  addScore(1000, LANE_LAMPS[i].x, LANE_LAMPS[i].y, C.cyan);
  sfx.fuel();
  burst(LANE_LAMPS[i].x, LANE_LAMPS[i].y, C.cyan, 8, 160);

  // 原版规则：三盏航道灯全亮 -> 缓冲器升级一级（蓝→绿→黄→红，撞击分值逐级翻倍）
  if (state.lanes[0] && state.lanes[1] && state.lanes[2]){
    state.lanes = [false, false, false];
    upgradeBumpers();
  }
}

/* ---------------------------- 原版补全区的命中处理 ---------------------------- */
/* 落靶：一枚被打落就不再挡球；3 枚全落给奖励并复位靶架。 */
function hitDropTarget(i){
  if (DROP_BANK.down[i] || DROP_BANK.cd > 0) return;
  DROP_BANK.cd = 0.10;
  DROP_BANK.down[i] = true;
  DROP_BANK.pop[i] = 1;
  const t = DROP_BANK.t[i];
  addScore(2500, t.x - 28, t.y - 12, C.cyan);
  burst(t.x, t.y, C.cyan, 10, 200);
  sfx.select();
  missionProgress('drop', 1);
  const n = DROP_BANK.down.filter(Boolean).length;
  if (n >= 3){
    DROP_BANK.resetT = 1.8;
    const bonus = 25000 + state.rank * 8000;

    state.banner = {t:1.9, text:'落靶全清', sub:'+' + bonus + ' · 靶架即将复位'};
    state.flash = 0.9; state.shake = 9;
    sfx.rank();
    burst(DROP_BANK.t[1].x, DROP_BANK.t[1].y, C.gold, 24, 300);
  } else {
    state.banner = {t:1.1, text:'落靶 ' + n + '/3', sub:'还有 ' + (3 - n) + ' 枚'};

}

/* ---------------------------- 引导层 (guidance) ---------------------------- */
/* 原版最狠的一招：屏幕上永远只有一句"现在该干什么"。这里把它收成一个统一状态，
   HUD 的指令行与台面箭头共用同一来源，保证两者永不打架。 */
function guideNow(){
  if (state.mode !== 'play' && state.mode !== 'ready') return null;
  if (state.tilt > 0){
    return {text:'倾斜复位 ' + state.tilt.toFixed(1) + 's', sub:'挡板暂时失效', spot:null, c:C.red};
  }

  const m = state.mission;
  if (m){
    const st = stageNow();
    if (st){
      return {
        text: m.def.zh + ' · ' + (st.zh || ''),
        sub: '剩余 ' + Math.max(0, st.goal - m.prog) + '/' + st.goal,
        spot: st.spot || null, c: C.green
      };
    }
  }

  /* 已装填未接取：原版只有坡道能接任务，这一步是核心手感。 */
  if (state.selected >= 0){
    const def = missionSlots()[state.selected];
    return {
      text: '上发射坡道 接取' + (def ? '「' + def.zh + '」' : '任务'),
      sub: '坡道口在左中区', spot: 'lramp', c: C.gold
    };
  }

  if (state.lanes[0] && state.lanes[1] && state.lanes[2]){
    return {text:'超空间就绪', sub:'沿环道冲过顶点', spot:'hyper', c: C.violet};
  }

  const downCount = DROP_BANK.down.filter(Boolean).length;
  if (downCount > 0 && downCount < 3){
    return {text:'落靶还剩 ' + (3 - downCount) + ' 枚', sub:'右墙靶架', spot:'drop', c: C.cyan};
  }

  if (state.bhOpen > 0){
    return {text:'黑洞在线 ' + Math.ceil(state.bhOpen) + 's', sub:'送球进右上黑洞', spot:'w0', c:'#c9b6ff'};
  }

  return {text:'打亮任务靶 选任务', sub:'击打顶部弧线的三个任务靶', spot:'mt0', c:'rgba(140,175,235,.85)'};
}

const BUMPER_LV_C = ['#4fa8ff', '#3ddc84', '#ffd166', '#ff5470'];
const BUMPER_LV_PTS = [40, 150, 400, 1000];

function upgradeBumpers(){

                    sub:'撞击分值提升 · ' + ['蓝色','绿色','黄色','红色'][state.bumperLv]};

    state.bumpersHot = true;
    addScore(6000, 240, 350, C.orange);

}

/* ---------------------------- nudge / tilt ---------------------------- */
function nudge(dir){
  if (state.mode !== 'play') return;
  ac();
  if (state.tilt > 0) return;
  state.nudgeDir = (dir >= 0) ? 1 : -1;   // which way the pseudo-3D table leans
  for (let i = 0; i < balls.length; i++){
    balls[i].vx += dir * 130;
    balls[i].vy -= 80;
  }
  state.shake = 7;
  sfx.nudge();

  /* 原版是双阈值：先累积到警告线（Careful...），再累积才 TILT。
     摇一下就罚玩家会觉得莫名其妙；热量随时间回落，所以"连摇"才危险。 */
  state.nudgeHeat = Math.min(1.2, state.nudgeHeat + 0.34);
  if (state.nudgeHeat >= 1.0){
    state.nudgeHeat = 0;
    state.tilt = 3.0;
    state.tiltWarn = 0;
    leftF.pressed = false;
    rightF.pressed = false;
    state.banner = {t:1.8, text:'TILT', sub:'推桌过度 · 挡板 3 秒失效'};
    sfx.tilt();
    state.shake = 14;
  } else if (state.nudgeHeat >= 0.5 && state.tiltWarn <= 0){
    state.tiltWarn = 2.0;
    state.banner = {t:1.5, text:'小心…', sub:'再推就要倾斜了'};
    sfx.select();
  }
}

/* ---------------------------- game flow ---------------------------- */
function resetBall(){
  state.charge = 0; state.charging = false; state.plungeMin = 9999;
  state.plungeStrike = -1; state.plungeFrom = 0;
  balls.length = 0;
  spawnBall(434, 754, 0, 0);
  // lamps are a per-ball objective, so they reset with each new ball
  state.lanes = [false, false, false];
  state.bumpersHot = false;
  state.laneCdArr = [0, 0, 0];
}
/* ---------------------------- run lifecycle (competition layer) ---------------------------- */
/* A run ends when the last ball drains or the challenge clock hits zero. The score is
   submitted to the board on end, and a revive (rewarded video) is offered if the run
   died with an ad slot still available. */
function endRun(){
  if (state.mode === 'over') return;
  state.mode = 'over';
  state.screen = 'over';
  state.overSel = (state.reviveUsed < state.revivesAllowed) ? 0 : 1;
  balls.length = 0;
  sfx.over();
  submitScore();
}

function submitScore(){
  if (state.pendingSubmit) return;
  state.pendingSubmit = true;
  const entry = {
    name: PF.profile.getName(),
    score: state.score,
    rank: state.rank,
    missions: state.missionsDone,
    mode: state.gameMode,
    ts: Date.now()
  };
  PF.leaderboard.submit(entry, function(ok){
    // release the guard once the network op settles, so a later run (or a revive that
    // ends again) can submit again. Leaving it latched silently dropped every score
    // after the first run of a session.
    state.pendingSubmit = false;
    if (ok && state.gameMode === 'daily'){
      PF.store.set('ps_daily_' + todayKey(), String(state.score));
    }
  });
  // 微信好友榜：经典模式最佳分写入微信云存储（开放数据域读它排好友榜）
  if (state.gameMode === 'classic') PF.cloud.submitBest(state.score);
  // 全国榜：云开发已配置时提交云函数（openid 由云函数上下文注入，客户端不传身份）
  PF.cloud.submitScore(entry, function(){});
}

/* Rewarded-video revive: +1 ball, mission state preserved, capped per run so it is a
   救急 而不是无限续命（否则榜单会被刷爆）。 */
function revive(){
  if (state.reviveUsed >= state.revivesAllowed){ return false; }
  state.reviveUsed++;
  state.mode = 'ready';
  state.screen = 'play';
  state.ballsLeft = Math.max(1, state.ballsLeft + 1);
  state.overSel = 0;
  state.pendingSubmit = false;
  resetBall();
  state.banner = {t:1.8, text:'REVIVED', sub:'+1 球 · 继续冲榜'};
  state.flash = 0.9;
  state.shake = 8;
  sfx.start();
  // extend the challenge clock a little so the revive is actually usable
  if (state.gameMode === 'daily') state.timeLeft = Math.max(state.timeLeft, 30);
  return true;
}

function requestRevive(){
  if (state.reviveUsed >= state.revivesAllowed){ return; }
  PF.showRewarded(function(granted){
    if (granted) revive();
    else { state.banner = {t:1.8, text:'未获得奖励', sub:'完整观看视频才能复活'}; }
  });
}

/* Demo build: the rewarded-video entry is not wired into the UI. Only the WeChat build
   shows it (see wx-miniprogram/), so the public demo exposes no ad surface. */

/* Rewarded-video 双倍结算: paid only after the video is watched to the end; the doubled
   score re-enters the leaderboard, and `scoreDoubled` keeps it a one-shot per run. */
function requestDouble(){
  if (state.scoreDoubled || state.score <= 0) return;
  PF.showRewarded(function(granted){
    if (!granted){
      state.banner = {t:1.8, text:'未获得奖励', sub:'完整观看视频才能双倍结算'};
      return;
    }
    state.scoreDoubled = true;
    state.score *= 2;
    if (state.score > state.best){ state.best = state.score; store.set('ps_best', state.best); }
    state.pendingSubmit = false;
    submitScore();
    state.banner = {t:2.0, text:'双倍结算 ×2', sub:'成绩已重新提交排行榜'};
    state.flash = 0.8;
    sfx.rank();
  });
}

}
