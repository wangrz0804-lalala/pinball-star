}

/* 一层台面的主光与材质：左上冷主光 + 挡板区暖反光，做出 3A 的冷暖对比 */
function drawTableLight(){
  if (!lightOk) return;
  if (window.__PS_VIEW && state.screen !== 'play') return;   // 小游戏非对局期省掉这层满屏 blit
  if (!tableLightCache) tableLightCache = renderLayerToCache(W, H, drawTableLightRaw);
  if (tableLightCache) blitLayer(tableLightCache); else drawTableLightRaw();
}
function drawTableLightRaw(){
  ctx.save();
  if (metalPattern){
    ctx.globalAlpha = 0.055;
    ctx.fillStyle = metalPattern;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  const key = ctx.createRadialGradient(150, 110, 30, 200, 330, 540);
  key.addColorStop(0, 'rgba(130,175,255,.16)');
  key.addColorStop(0.5, 'rgba(60,95,170,.06)');
  key.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = key; ctx.fillRect(0, 0, W, H);
  const warm = ctx.createRadialGradient(240, 780, 30, 240, 730, 350);
  warm.addColorStop(0, 'rgba(255,150,70,.12)');
  warm.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = warm; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* ---------------------------- 后期：泛光 + 色彩分级 ---------------------------- */
/* 廉价的亮部提取：1/4 降采样后用 multiply 自乘（暗部被压掉），再放大叠加回主画面。
   纯 Canvas 2D，不依赖 ctx.filter / WebGL，小程序端同样能跑；失败则自动关闭。 */
let bloomCv = null, bloomCtx = null, bloomOk = true, bloomTick = 0;
/* 动态画质（3A 常用的动态分辨率思路）：持续低帧时自动关掉最费的全屏泛光，
   宁可少一层辉光，也不能让挡板手感变钝。 */
let perfAcc = 0, perfN = 0, lightOk = true;
let slowStreak = 0;
function autoQuality(dt){
  if (state.screen !== 'play' && !window.__PS_VIEW) return;   // 小游戏端菜单期也测帧，尽早降辉光
  // 单帧超过 55ms（<18fps）连续 3 次：不等统计窗口，立刻降级，先保住响应
  slowStreak = dt > 0.055 ? slowStreak + 1 : 0;
  if (slowStreak >= 3){ bloomOk = false; lightOk = false; window.__PS_FXGLOW = false; slowStreak = 0; }
  perfAcc += dt; perfN++;
  if (perfAcc >= 2.5){
    // 降级只有一档：关泛光 + 台面光照 + 霓虹辉光闸（shadowBlur 归零）。
    // 不做"降 buffer 分辨率"：小游戏显示层 1:1 物理像素展示，缩 buffer 等于缩可见区域。
    if (perfN / perfAcc < 50 && (bloomOk || lightOk)){
      bloomOk = false; lightOk = false; window.__PS_FXGLOW = false;
    }
    perfAcc = 0; perfN = 0;
  }
}
function applyBloom(){
  if (window.__PS_VIEW) return;   // 小游戏端关闭泛光自读自叠（会读回整屏导致灰蒙/错位）
  if (!bloomOk || state.screen !== 'play') return;
  try{
    if (!bloomCv){ bloomCv = document.createElement('canvas'); bloomCtx = bloomCv.getContext('2d'); }
    const bw = Math.max(1, CW >> 2), bh = Math.max(1, CH >> 2);
    if (bloomCv.width !== bw || bloomCv.height !== bh){ bloomCv.width = bw; bloomCv.height = bh; }
    bloomTick++;                       // 隔帧提取亮部，视觉几乎无差别，开销减半
    if (bloomTick % 2 === 1){
      bloomCtx.setTransform(1, 0, 0, 1, 0, 0);
      bloomCtx.globalCompositeOperation = 'source-over';
      bloomCtx.clearRect(0, 0, bw, bh);
      bloomCtx.drawImage(cv, 0, 0, bw, bh);
      bloomCtx.globalCompositeOperation = 'multiply';
      bloomCtx.drawImage(bloomCv, 0, 0);
    }
    ctx.save();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.36;
    ctx.drawImage(bloomCv, 0, 0, CW, CH);
    ctx.restore();
  }catch(e){ bloomOk = false; }
}

/* ---------------------------- 二层甲板渲染 ---------------------------- */
/* 甲板是**常驻**的一整块抬升面：投影 → 板厚 → 台面 → 甲板接缝 → 前缘灯带 → 缺口。
   它一直画在台面顶部，和一层共用同一套坐标系，所以越界判定非常直观。 */
const DECK_A0 = Math.PI + 0.2116;             // 前缘与穹顶内弧的交点角度
const DECK_A1 = Math.PI * 2 - 0.2116;
function deckPath(off, dy){
  off = off || 0; dy = dy || 0;
  ctx.beginPath();
  ctx.arc(DECK.cx, DECK.cy + dy, DECK.r - off, DECK_A0, DECK_A1);
  ctx.closePath();
}

function drawUpperDeck(){
  ctx.save();
  // 上区是同一张台的上半区（Space Cadet 结构），不再画抬升平台——
  // 只留一圈淡淡的内侧弧线提示 + 铭牌，模块（圆盘/分流通道）由各自的绘制函数画
  ctx.beginPath();
  ctx.arc(240, 264, 206, Math.PI + 0.12, -0.12);
  ctx.strokeStyle = 'rgba(150,190,255,.16)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 9px ui-monospace,Menlo,monospace';
  ctx.fillStyle = 'rgba(150,190,255,.42)';
  ctx.fillText('轨 道 穹 顶', 240, 66);
  ctx.font = '600 6px ui-monospace,Menlo,monospace';
  ctx.fillStyle = 'rgba(140,175,235,.26)';

  // 任务指向上区时呼吸高亮（沿不规则轮廓）
  if (state.mission && zoneNow() === 'upper'){
    const pl = 0.5 + 0.5 * Math.sin(state.time * 5.5);
    deckInsetPath(1.06, 0);
    ctx.strokeStyle = ZONE_BY_ID.upper.c;
    ctx.globalAlpha = 0.3 + pl * 0.45;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = ZONE_BY_ID.upper.c;
    ctx.shadowBlur = 18;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawDeckTargets(){
  ctx.save();
  // 升降井交付点标记（球被送上二层的位置）
  const pulse = 0.5 + 0.5 * Math.sin(state.time * 5);
  ctx.globalAlpha = 0.25 + pulse * 0.35;
  ctx.strokeStyle = C.gold;
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(DECK.entry.x, DECK.entry.y, 15, 0, 6.2832); ctx.stroke();
  ctx.globalAlpha = 1;

  // —— 原版二层的 3 路分流通道灯：横排在台面下缘，每条对应一个任务槽 ——
  // 画出从圆盘区通向通道的分流导轨 + 一枚通道任务灯（点亮=已装填该路任务）
  for (let i = 0; i < DECK_LANES.length; i++){
    const ln = DECK_LANES[i];
    const sel = (state.selected === i);
    const col = ln.lit ? C.gold : (sel ? '#7dffd4' : C.cyan);
    // 分流导轨：从上缘汇入这条通道的两条短轨
    ctx.save();
    ctx.strokeStyle = ln.lit ? 'rgba(255,209,102,.55)' : 'rgba(94,224,255,.3)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(ln.x - 9, ln.y - 30); ctx.lineTo(ln.x - 7, ln.y - 8);
    ctx.moveTo(ln.x + 9, ln.y - 30); ctx.lineTo(ln.x + 7, ln.y - 8);
    ctx.stroke();
    // 通道口（梯形漏斗）
    ctx.beginPath();
    ctx.moveTo(ln.x - 9, ln.y - 6); ctx.lineTo(ln.x + 9, ln.y - 6);
    ctx.lineTo(ln.x + 6, ln.y + 8); ctx.lineTo(ln.x - 6, ln.y + 8);
    ctx.closePath();
    ctx.fillStyle = ln.lit ? 'rgba(255,209,102,.18)' : 'rgba(94,224,255,.12)';
    ctx.fill();
    ctx.restore();
    // 通道任务灯（圆形，亮起=requested；选中=外圈高亮）
    const r = 6.5 * (1 + ln.pop * 0.3);
    ctx.save();
    ctx.translate(ln.x, ln.y - 16);
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, r * 2.2);
    g.addColorStop(0, 'rgba(255,255,255,' + (0.15 + ln.pop * 0.5) + ')');
    g.addColorStop(0.45, col + '66');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r * 2.2, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832);
    ctx.fillStyle = ln.lit ? 'rgba(70,52,10,.95)' : 'rgba(8,16,36,.95)';
    ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = sel ? 2.4 : 1.5;
    ctx.shadowColor = col; ctx.shadowBlur = sel ? 16 : 6 + ln.pop * 12;
    ctx.stroke(); ctx.shadowBlur = 0;
    ctx.font = '700 7px ui-monospace,Menlo,monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = col; ctx.fillText(String(i + 1), 0, 0.5);
    ctx.restore();
    // 任务名不画在台面上（HUD 已显示），避免压住圆盘；选中态用外圈高亮表达即可
  }
  ctx.restore();
}


function drawTurrets(){
  // 原版二层的 3 个银白圆盘碰撞器：白圆顶 + 红放射条纹 + 蓝心（品字三角排列）。
  // 这是二层唯一的碰撞单元，撞击有 pop 爆闪与命中计数。
  for (let i = 0; i < DECK_TARGETS.length; i++){
    const t = DECK_TARGETS[i];
    ctx.save();
    ctx.translate(t.x, t.y);
    const pop = t.pop || 0;
    const R = t.r * (1 + pop * 0.18);
    // 接触阴影
    ctx.fillStyle = 'rgba(0,0,0,.38)';
    ctx.beginPath(); ctx.ellipse(1.5, R * 0.7, R * 1.05, R * 0.4, 0, 0, 6.2832); ctx.fill();
    // 底座黄铜环
    ctx.beginPath(); ctx.arc(0, 0, R + 3.5, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,196,84,.22)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,206,110,.7)'; ctx.lineWidth = 1.2; ctx.stroke();
    // 白圆顶（金属渐变）
    const dome = ctx.createRadialGradient(-R * 0.3, -R * 0.35, 1, 0, 0, R);
    dome.addColorStop(0, '#ffffff');
    dome.addColorStop(0.55, pop > 0.25 ? '#fff2d0' : '#e8edf6');
    dome.addColorStop(1, '#8f9bb4');
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.2832);
    ctx.fillStyle = dome; ctx.fill();
    // 红放射条纹（原版 bumper 的标志性 8 道纹）
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, R - 1, 0, 6.2832); ctx.clip();
    for (let k = 0; k < 8; k++){
      const a = k * Math.PI / 4 + state.time * 0.25;
      ctx.strokeStyle = 'rgba(214,58,52,' + (0.75 + pop * 0.25) + ')';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * R * 0.42, Math.sin(a) * R * 0.42);
      ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);
      ctx.stroke();
    }
    ctx.restore();
    // 中心蓝心 + 命中爆闪
    ctx.beginPath(); ctx.arc(0, 0, R * 0.36, 0, 6.2832);
    const core = ctx.createRadialGradient(0, 0, 1, 0, 0, R * 0.36);
    core.addColorStop(0, pop > 0.25 ? '#fff7e0' : '#bfe8ff');
    core.addColorStop(1, '#2f7fd8');
    ctx.fillStyle = core; ctx.fill();
    ctx.strokeStyle = pop > 0.25 ? '#fff' : 'rgba(180,220,255,.85)';
    ctx.lineWidth = 1.4;
    ctx.shadowColor = pop > 0.25 ? '#ffe9b0' : '#5aa8ff';
    ctx.shadowBlur = 8 + pop * 22 + ballLight(t.x, t.y) * 12;
    ctx.stroke(); ctx.shadowBlur = 0;
    ctx.restore();
  }
}

function drawOutGates(){
  for (let i = 0; i < OUTGATES.length; i++){
    const og = OUTGATES[i];
    const mx = (og.ax + og.bx) / 2, my = (og.ay + og.by) / 2;
    ctx.save();
    if (og.open){
      const pulse = 0.5 + 0.5 * Math.sin(state.time * 8);
      // the pit itself
      const pg = ctx.createLinearGradient(mx, my - 14, mx, my + 22);
      pg.addColorStop(0, 'rgba(255,70,80,' + (0.10 + pulse * 0.16) + ')');
      pg.addColorStop(1, 'rgba(40,0,10,.85)');
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.moveTo(og.ax, og.ay);
      ctx.lineTo(og.bx, og.by);
      ctx.lineTo(og.bx, og.by + 16);
      ctx.lineTo(og.ax, og.ay + 16);
      ctx.closePath();
      ctx.fill();
      // hazard rim
      ctx.strokeStyle = 'rgba(255,80,90,' + (0.55 + pulse * 0.45) + ')';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(255,70,80,.9)';
      ctx.shadowBlur = 12;
      ctx.setLineDash([5, 3]);
      ctx.lineDashOffset = -state.time * 30;
      ctx.beginPath();
      ctx.moveTo(og.ax, og.ay);
      ctx.lineTo(og.bx, og.by);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.shadowBlur = 0;
      // chevrons pointing into the pit
      ctx.strokeStyle = 'rgba(255,120,110,' + (0.5 + pulse * 0.5) + ')';
      ctx.lineWidth = 1.6;
      for (let k = 0; k < 2; k++){
        const cy = my + 2 + k * 8;
        ctx.beginPath();
        ctx.moveTo(mx - 5, cy);
        ctx.lineTo(mx, cy + 4);
        ctx.lineTo(mx + 5, cy);
        ctx.stroke();
      }
    } else {
      // 关闭态：闸口是一块与 inlane 齐平的盖板，压暗一档，细看才看得见
      ctx.strokeStyle = 'rgba(40,52,84,.60)';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(og.ax, og.ay);
      ctx.lineTo(og.bx, og.by);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(108,138,196,.26)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(og.ax, og.ay);
      ctx.lineTo(og.bx, og.by);
      ctx.stroke();
    }

    /* 挡杆：台面上常驻的一条深紫色槽（就是弹射器支脚延伸出来的那条线）。
       关闭时它只是槽——压暗、贴地，不暗示实体；闸门开启时同一条线通电变色、
       杆体升起封住通道。一根杆两种状态，不再凭空冒出一根亮紫色胶囊。 */
    if (og.bar){
      const bx0 = og.bar.ax, by0 = og.bar.ay, bx1 = og.bar.bx, by1 = og.bar.by;
      const barPath = function(){
        ctx.beginPath(); ctx.moveTo(bx0, by0); ctx.lineTo(bx1, by1);
      };
      ctx.lineCap = 'round';
      if (og.open){
        const pk = 0.5 + 0.5 * Math.sin(state.time * 9);
        // 外发光
        ctx.shadowColor = 'rgba(198,124,255,' + (0.60 + pk * 0.32) + ')';
        ctx.shadowBlur = 22;
        ctx.strokeStyle = 'rgba(80,38,146,.98)';
        ctx.lineWidth = 11.5;
        barPath(); ctx.stroke();
        ctx.shadowBlur = 0;
        // 杆体：由深紫转亮紫（同一根杆的"通电"状态）
        const gb = ctx.createLinearGradient(bx0, by0, bx1, by1);
        gb.addColorStop(0, 'rgba(150,96,236,.99)');
        gb.addColorStop(0.55, 'rgba(198,138,255,.99)');
        gb.addColorStop(1, 'rgba(150,96,236,.99)');
        ctx.strokeStyle = gb;
        ctx.lineWidth = 8.6;
        barPath(); ctx.stroke();
        // 内芯高光
        ctx.strokeStyle = 'rgba(248,230,255,' + (0.72 + pk * 0.28) + ')';
        ctx.lineWidth = 2.4;
        barPath(); ctx.stroke();
        // 能量流：沿杆跑三个亮点，读作"这条线带电了"
        for (let s2 = 0; s2 < 3; s2++){
          const u = ((state.time * 1.1 + s2 / 3) % 1);
          ctx.beginPath();
          ctx.arc(bx0 + (bx1 - bx0) * u, by0 + (by1 - by0) * u, 2.1, 0, 6.2832);
          ctx.fillStyle = 'rgba(255,244,255,.92)';
          ctx.fill();
        }
        // 铰链座：通电时亮起
        ctx.fillStyle = 'rgba(216,172,255,.9)';
        ctx.beginPath(); ctx.arc(bx0, by0, 4.6, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = 'rgba(255,250,255,.85)';
        ctx.lineWidth = 1.1; ctx.stroke();
      } else {
      }
      /* 关闭态**不画杆**：这根杆按设定是"缩回弹射器内"的。
         画出来只会变成台面上一根悬空的小棍——既不像槽也不像杆，
         在右侧那段 25px 窄口里尤其会被读成"拦路的横杆"。 */
      if (!og.open){
        // 只留铰链座一个压暗的圆坑，说明这里有个机构
        ctx.fillStyle = 'rgba(30,20,62,.52)';
        ctx.beginPath(); ctx.arc(bx0, by0, 2.6, 0, 6.2832); ctx.fill();
      }
    }
    ctx.restore();
  }
}

function drawWorms(){
  for (let i = 0; i < WORMS.length; i++){
    const w = WORMS[i];
    const armed = (state.wormArmed === i);
    const pulse = 0.5 + 0.5 * Math.sin(state.time * 3 + i * 2);

    ctx.save();
    // outer nebula halo
    const g = ctx.createRadialGradient(w.x, w.y, 1, w.x, w.y, w.r * 2.8);
    g.addColorStop(0, w.c + (armed ? '70' : '3a'));
    g.addColorStop(0.5, w.c + (armed ? '30' : '16'));
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r * 2.8, 0, 6.2832); ctx.fill();

    // funnel: concentric rings pulled inward, so it reads as a drain not a circle
    for (let k = 4; k >= 1; k--){
      const rr2 = w.r * (k / 4);
      ctx.beginPath();
      ctx.arc(w.x, w.y, rr2, 0, 6.2832);
      const fg = ctx.createRadialGradient(w.x, w.y, 1, w.x, w.y, rr2);
      fg.addColorStop(0, 'rgba(0,0,0,1)');
      fg.addColorStop(0.7, 'rgba(2,5,14,.96)');
      fg.addColorStop(1, w.c + '1f');
      ctx.fillStyle = fg;
      ctx.fill();
    }

    // swirl arcs
    ctx.strokeStyle = w.c + (armed ? 'cc' : '66');
    ctx.lineWidth = armed ? 2.2 : 1.5;
    for (let k = 0; k < 3; k++){
      const a0 = state.time * (1.6 + k * 0.5) + k * 2.1 + i;
      ctx.beginPath();
      ctx.arc(w.x, w.y, w.r * (0.62 + k * 0.12), a0, a0 + 1.5);
      ctx.stroke();
    }

    // rim
    ctx.strokeStyle = w.c;
    ctx.lineWidth = armed ? 2.8 : 2;
    ctx.shadowColor = w.c;
    ctx.shadowBlur = armed ? 24 : (12 + pulse * 10);
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, 6.2832); ctx.stroke();
    ctx.shadowBlur = 0;

    if (armed){
      ctx.globalAlpha = 0.5 + pulse * 0.5;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r + 5, 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // a ball currently swallowed by this chute: swirl faster + countdown ring
    for (let k = 0; k < balls.length; k++){
      const bb = balls[k];
      if (bb.hidden && bb.wormOut === i){
        const frac = 1 - Math.max(0, bb.wormT) / 2.8;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(w.x, w.y, w.r + 8, -Math.PI / 2, -Math.PI / 2 + frac * 6.2832);
        ctx.stroke();
        ctx.font = '700 9px ui-monospace,Menlo,monospace';
        ctx.fillStyle = w.c;
        ctx.textAlign = 'center';
        ctx.fillText('WARP', w.x, w.y + w.r + 20);
      }
    }
    ctx.restore();
  }
}

function drawFuelLights(){
  const m = state.mission;
  for (let i = 0; i < FUEL_POS.length; i++){
    const p = FUEL_POS[i];
    const on = m ? (i < m.fuel) : false;
    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, 6.2832);
    if (on){
      ctx.fillStyle = C.green;
      ctx.shadowColor = 'rgba(94,242,176,.9)';
      ctx.shadowBlur = 9;
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(6,12,28,.9)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(94,242,176,.22)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawBumpers(){
  for (let i = 0; i < BUMPERS.length; i++){
    const b = BUMPERS[i];
    const r = b.r * (1 + b.pop * 0.16);
    const lvC = BUMPER_LV_C[state.bumperLv];
    ctx.save();

    const g = ctx.createRadialGradient(b.x, b.y, r * 0.2, b.x, b.y, r * 2.1);
    g.addColorStop(0, 'rgba(255,255,255,' + (0.20 + b.pop * 0.5) + ')');
    g.addColorStop(0.35, lvC + '55');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, r * 2.1, 0, 6.2832); ctx.fill();

    /* 建筑物造型：圆形基座 + 带雉堞的塔身 + 等级色顶灯，像台面上立着的炮塔 */
    // 塔身（八边形，随等级轻微升高）
    const h = 5 + state.bumperLv * 2.5;
    ctx.fillStyle = 'rgba(10,16,38,.96)';
    ctx.strokeStyle = 'rgba(120,170,255,.5)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let k = 0; k < 8; k++){
      const a = Math.PI / 8 + k * Math.PI / 4;
      const px = b.x + Math.cos(a) * r, py = b.y + Math.sin(a) * r * 0.94;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // 雉堞
    ctx.strokeStyle = 'rgba(150,190,255,.75)';
    ctx.lineWidth = 2;
    for (let k = 0; k < 4; k++){
      const a = Math.PI / 4 + k * Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(b.x + Math.cos(a) * (r - 1), b.y + Math.sin(a) * (r - 1) * 0.94);
      ctx.lineTo(b.x + Math.cos(a) * (r + 3), b.y + Math.sin(a) * (r + 3) * 0.94 - h);
      ctx.stroke();
    }
    // 圆顶装甲盘（碰撞面，等级色）
    const bg = ctx.createRadialGradient(b.x - r*0.3, b.y - r*0.4, r*0.1, b.x, b.y, r);
    bg.addColorStop(0, '#ffffff');
    bg.addColorStop(0.35, lvC);
    bg.addColorStop(1, 'rgba(12,18,44,.95)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.8, 0, 6.2832); ctx.fill();

    ctx.strokeStyle = lvC;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = lvC;
    ctx.shadowBlur = 16 + b.pop * 26 + ballLight(b.x, b.y) * 24;   // 球即移动光源
    ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.8, 0, 6.2832); ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = 'rgba(255,255,255,' + (0.30 + b.pop * 0.6) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.42, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }
}

function drawFlippers(){
  const fs = [leftF, rightF];
  const dead = (state.tilt > 0);
  for (let i = 0; i < 2; i++){
    const f = fs[i];
    const tip = f.tip();
    ctx.save();
    ctx.lineCap = 'round';

    ctx.globalAlpha = dead ? 0.4 : 1;
    ctx.shadowColor = f.pressed ? 'rgba(255,130,225,.95)' : 'rgba(90,160,255,.65)';
    ctx.shadowBlur = f.pressed ? 28 : 16;
    ctx.strokeStyle = f.pressed ? '#ff9ee8' : '#84bcff';
    ctx.lineWidth = 17;
    ctx.beginPath(); ctx.moveTo(f.px, f.py); ctx.lineTo(tip.x, tip.y); ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#0c1430';
    ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(f.px, f.py); ctx.lineTo(tip.x, tip.y); ctx.stroke();

    ctx.strokeStyle = f.pressed ? '#ffe6f9' : '#d8edff';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(f.px, f.py); ctx.lineTo(tip.x, tip.y); ctx.stroke();

    ctx.fillStyle = '#16204a';
    ctx.beginPath(); ctx.arc(f.px, f.py, 8, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = f.pressed ? C.magenta : C.blue;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(f.px, f.py, 8, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }
}

function drawBallOne(b){
  const trailC = (TRAILS[state.profile.trail] || TRAILS.none).c;
  // additive trail: overlaps glow brighter, reads as ionised gas rather than paint
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < b.trail.length; i++){
    const t = b.trail[i];
    const a = (i / b.trail.length) * 0.30;
    ctx.globalAlpha = a;
    ctx.fillStyle = trailC;
    ctx.beginPath();
    ctx.arc(t.x, t.y, b.r * (0.35 + 0.6 * i / b.trail.length), 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  const pal = (SKINS[state.profile.skin] || SKINS.classic).pal;
  ctx.save();
  ctx.shadowColor = pal[3];
  ctx.shadowBlur = 22;
  const g = ctx.createRadialGradient(b.x - 3, b.y - 4, 1, b.x, b.y, b.r);
  g.addColorStop(0, pal[0]);
  g.addColorStop(0.5, pal[1]);
  g.addColorStop(1, pal[2]);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 0.6, 0, 6.2832); ctx.stroke();
  // metal-ball extras: hard specular dot + blue bounce light on the lower rim,
  // reflected up from the lit playfield below
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath();
  ctx.arc(b.x - b.r * 0.34, b.y - b.r * 0.4, b.r * 0.2, 0, 6.2832);
  ctx.fill();
  ctx.strokeStyle = 'rgba(130,185,255,.55)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r - 1.4, 0.5, 2.4);
  ctx.stroke();
  ctx.restore();
}

function drawBalls(layer){
  for (let i = 0; i < balls.length; i++){
    const b = balls[i];
    if (b.hidden) continue;                      // swallowed by a wormhole / lift
    const onUpper = b.deck === 'upper';
    const onRamp = b.rampT !== undefined;        // 坡道滑行球：跟随坡道层（甲板/坡道之上）
    if (layer === 'lower' && (onUpper || onRamp)) continue;
    if (layer === 'upper' && !onUpper && !onRamp) continue;
    if (onUpper || b.rampT !== undefined){
      // 坡道滑行残影：沿路径回退几帧画淡影，读作"球正沿桥面滑行"而非瞬移
      if (b.rampT !== undefined && b.rampT > 0.06){
        for (let k = 3; k >= 1; k--){
          const gt = Math.max(0, b.rampT - k * 0.055);
          const gp = rampPoint(gt), gz = rampH(gt);
          ctx.save();
          ctx.globalAlpha = 0.10 * (4 - k) / 3;
          ctx.fillStyle = C.cyan;
          ctx.beginPath(); ctx.arc(gp.x, gp.y - gz, b.r * (0.55 + 0.12 * (3 - k)), 0, 6.2832); ctx.fill();
          ctx.restore();
        }
      }
      // 二层球 / 坡道滑行球：按高度上移 + 放大（rampZ 从 0 渐变到 DECK3D.z）
      const zo = b.rampT !== undefined ? (b.rampZ || 0)
               : DECK3D.z * (b.dropAnim > 0 ? b.dropAnim / 0.20 : 1);
      ctx.save();
      ctx.globalAlpha = 0.34 * (0.4 + 0.6 * (zo / DECK3D.z || 0.4));
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(b.x + 3.5, b.y + 5, b.r * 0.92, b.r * 0.55, 0, 0, 6.2832);
      ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.translate(b.x, b.y - zo);
      const sc = 1 + 0.15 * (zo / DECK3D.z || 0);
      ctx.scale(sc, sc);
      drawBallOne({x:0, y:0, r:b.r, trail:[], hidden:false});
      ctx.restore();
      continue;
    }
    drawBallOne(b);
  }
}
/* 二层球投在**一层台面**上的落影：画在甲板之前，把"悬空"钉在台面上 */
function drawUpperShadows(){
  for (let i = 0; i < balls.length; i++){
    const b = balls[i];
    const onRamp = b.rampT !== undefined;
    if (b.hidden || (b.deck !== 'upper' && !onRamp)) continue;
    // 高度比：越高影子离球越远、越淡、越小——把"悬在多高"直接画在台面上
    const hz = onRamp ? (b.rampZ || 0) : DECK3D.z;
    const k = Math.max(0, Math.min(1, hz / DECK3D.z));
    ctx.save();
    ctx.globalAlpha = 0.30 - 0.13 * k;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(b.x + 6 + 8 * k, b.y + 10 + 9 * k, b.r * (1.05 - 0.22 * k), b.r * (0.58 - 0.14 * k), 0, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }
}

/* 撞杆几何：球静止于 (434,754)、半径 9，球底 y=763。
   击打帽半高 3，待发时帽中心必须 >= 763+3+1 = 767，否则就会与球重叠。
   蓄力：帽向下后拉、弹簧压缩；击发：帽猛冲过球位、再由弹簧拉回。 */
function plungerHeadY(){
  const contact = 767;   // 待发位帽中心：贴球底且留 1px 间隙
  const pull    = 8;     // 满蓄力后拉距离（帽仍露在地板上方，玩家看得见）
  const peak    = 744;   // 击打最高点（球此时已高速离开发射道）
  if (state.mode === 'ready'){
    return contact + pull * (state.charging ? state.charge : 0);
  }
  if (state.plungeStrike >= 0){
    const t = state.plungeStrike;
    const from = contact + pull * state.plungeFrom;
    if (t < 0.05){
      const k = t / 0.05;
      return from + (peak - from) * (1 - Math.pow(1 - k, 3)); // 蓄力 -> 猛冲
    }
    const k = Math.min(1, (t - 0.05) / 0.13);
    return peak + (contact - peak) * (k * k);                 // 弹簧回弹
  }
  return contact;
}

function drawPlunger(){
  const x = 434;
  const baseY = 786;                       // 杆基座藏在发射道地板下方
  const headY = plungerHeadY();
  const pc = (PLUNGERS[state.profile.plunger] || PLUNGERS.std).c;
  const charging = state.mode === 'ready' && state.charging;
  ctx.save();
  ctx.lineCap = 'round';

  // 主杆
  ctx.strokeStyle = 'rgba(120,160,230,.55)';
  ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(x, baseY); ctx.lineTo(x, headY); ctx.stroke();
  ctx.strokeStyle = pc;
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(x, baseY); ctx.lineTo(x, headY); ctx.stroke();

  // 压缩弹簧：蓄力越满，外露越短、圈距越小
  const coilTop = headY + 5;
  const coilBot = Math.min(baseY - 2, coilTop + 30);
  if (coilBot > coilTop + 6){
    ctx.strokeStyle = 'rgba(162,200,255,' + (charging ? 0.9 : 0.55) + ')';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    const turns = 5;
    for (let i = 0; i <= turns * 2; i++){
      const yy = coilTop + (coilBot - coilTop) * i / (turns * 2);
      const xx = x + (i % 2 ? 6 : -6);
      if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
    }
    ctx.stroke();
  }

  // 顶端击打帽：横向金属帽正对球底
  const capG = ctx.createLinearGradient(x - 10, 0, x + 10, 0);
  capG.addColorStop(0, '#2b3a63');
  capG.addColorStop(0.5, '#9cc2ff');
  capG.addColorStop(1, '#2b3a63');
  ctx.fillStyle = capG;
  rr(x - 10, headY - 3, 20, 6, 3); ctx.fill();
  ctx.strokeStyle = pc; ctx.lineWidth = 1;
  rr(x - 10, headY - 3, 20, 6, 3); ctx.stroke();

  // 蓄力时帽体透出金光，满力时帽顶迸出火花
  if (charging){
    ctx.globalAlpha = 0.2 + 0.45 * state.charge;
    ctx.fillStyle = C.gold;
    ctx.beginPath(); ctx.arc(x, headY, 3 + 4 * state.charge, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
    if (state.charge > 0.86){
      ctx.globalAlpha = 0.45 + 0.4 * Math.abs(Math.sin(state.time * 20));
      ctx.beginPath(); ctx.arc(x, headY - 7, 2.4, 0, 6.2832); ctx.fill();
    }
  }
  ctx.restore();
}

/* ---------------------------- UI kit (buttons + screens) ---------------------------- */
/* Buttons are drawn on the canvas because the same file must run inside a Mini Program,
   where there is no DOM to hang HTML buttons on. Hit areas are recorded each frame in
   state.btnRects and consumed by the pointer handler. */
function btn(id, x, y, w, h, label, sub, opts){
  opts = opts || {};
  const hot = (state.btnHot === id);
  const disabled = !!opts.disabled;
  const accent = opts.accent || C.cyan;

  ctx.save();
  // plate
  rr(x, y, w, h, opts.radius === undefined ? 12 : opts.radius);
  const g = ctx.createLinearGradient(x, y, x, y + h);
  if (disabled){
    g.addColorStop(0, 'rgba(24,30,52,.94)');
    g.addColorStop(1, 'rgba(14,18,34,.94)');
  } else if (opts.primary){
    g.addColorStop(0, hexA(accent, hot ? 0.34 : 0.24));
    g.addColorStop(1, hexA(accent, hot ? 0.18 : 0.10));
  } else {
    g.addColorStop(0, 'rgba(18,24,46,.94)');
    g.addColorStop(1, 'rgba(10,14,28,.94)');
  }
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = disabled ? 'rgba(90,110,150,.28)' : hexA(accent, hot ? 0.95 : 0.5);
  ctx.lineWidth = hot ? 2 : 1.4;
  if (!disabled && hot){ ctx.shadowColor = accent; ctx.shadowBlur = 16; }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // label
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const cx = x + w / 2;
  if (sub){
    ctx.font = '700 15px ui-monospace,Menlo,monospace';
    ctx.fillStyle = disabled ? 'rgba(150,170,205,.45)' : '#eaf4ff';
    ctx.fillText(label, cx, y + h / 2 - 8);
    ctx.font = '600 9px ui-monospace,Menlo,monospace';
    ctx.fillStyle = disabled ? 'rgba(140,160,195,.35)' : hexA(accent, 0.75);
    ctx.fillText(sub, cx, y + h / 2 + 10);
  } else {
    ctx.font = '700 14px ui-monospace,Menlo,monospace';
    ctx.fillStyle = disabled ? 'rgba(150,170,205,.45)' : '#eaf4ff';
    ctx.fillText(label, cx, y + h / 2 + 1);
  }
  ctx.restore();

  if (!disabled) state.btnRects.push({id:id, x:x, y:y + UI_DY, w:w, h:h, action:opts.action});
}

function hexA(hex, a){
  // '#rrggbb' + alpha -> rgba()
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function panel(x, y, w, h, title, accent){
  ctx.save();
  rr(x, y, w, h, 18);
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, 'rgba(14,20,44,.97)');
  g.addColorStop(1, 'rgba(6,9,22,.98)');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = hexA(accent || C.blue, 0.5);
  ctx.lineWidth = 1.4;
  ctx.stroke();
  if (title){
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 13px ui-monospace,Menlo,monospace';
    ctx.letterSpacing = '3px';
    ctx.fillStyle = hexA(accent || C.blue, 0.9);
    ctx.fillText(title, x + w / 2, y + 26);
    ctx.letterSpacing = '0px';
  }
  ctx.restore();
}

/* ---------------------------- screens ---------------------------- */
/* Screens are authored for an 0..800 tall area, then shifted by UI_DY so they sit
   centred inside the taller cabinet (CW x CH). Button rects record the SHIFTED coords,
   which is what the pointer handler compares against. */
let UI_DY = 0;

  pg2.addColorStop(1, 'rgba(60,30,40,.06)');
  ctx.fillStyle = pg2;
  ctx.beginPath(); ctx.arc(66, 664, 44, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,140,.30)';

  ctx.save();
  ctx.translate(66, 664);
  ctx.rotate(-0.5);
  ctx.scale(1, 0.32);
  ctx.beginPath(); ctx.arc(0, 0, 66, 0, 6.2832); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = 'rgba(200,220,255,.5)';
  ctx.beginPath(); ctx.arc(404, 606, 9, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(140,180,255,.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(404, 606, 15, 0, 6.2832); ctx.stroke();
  ctx.restore();

  // wordmark
  ctx.font = '800 30px ui-monospace,Menlo,monospace';
  ctx.letterSpacing = '6px';
  ctx.shadowColor = C.cyan;
  ctx.shadowBlur = 26;
  ctx.fillStyle = '#eaf8ff';
  ctx.fillText('PINBALL', 240, 120);
  ctx.fillText('STAR', 240, 156);
  ctx.shadowBlur = 0;
  ctx.letterSpacing = '0px';

  ctx.font = '700 15px ui-monospace,Menlo,monospace';

/* The menu button used to switch to a screen nobody drew, dead-ending the game; this
   implements it. Equip what you have earned, unlock the ad-exclusive skin with a
   rewarded video, and browse title progress. */
function unlockState(def, id){
  const p = state.profile;
  if (!def.need || needMet(def.need)) return 'ok';
  if (def.ad && p.adSkins && p.adSkins.indexOf(id) >= 0) return 'ok';
  return def.ad ? 'ad' : 'locked';
}

function tryEquip(kind, id){
  const defs = kind === 'skin' ? SKINS : (kind === 'trail' ? TRAILS : PLUNGERS);
  const def = defs[id];
  const st = unlockState(def, id);
  if (st === 'locked'){
    state.banner = {t:1.6, text:'尚未解锁', sub:def.need ? def.need.hint : ''};
    return;
  }
  if (st === 'ad'){
    PF.showRewarded(function(granted){
      if (!granted){
        state.banner = {t:1.8, text:'未获得奖励', sub:'完整观看视频才能解锁 ' + def.zh};
        return;
      }
      const p = state.profile;
      if (!p.adSkins) p.adSkins = [];
      if (p.adSkins.indexOf(id) < 0) p.adSkins.push(id);
      p[kind] = id;
      saveProfile();
      state.banner = {t:1.8, text:'已解锁并装备', sub:def.zh};
      sfx.rank();
    });
    return;
  }
  state.profile[kind] = id;
  saveProfile();
  sfx.select();
}

/* 程序化头像：霓虹环 + 昵称首字，色相由名字哈希决定。
   微信平台不再向小游戏提供本人真实头像/昵称（返回匿名），本人形象用这套自绘标识；
   好友榜里的头像是开放数据域返回的真实 avatarUrl，由开放数据域自己画。 */
function drawAvatar(x, y, r, name){
  let hsh = 0;
  const nm = String(name || 'P');
  for (let i = 0; i < nm.length; i++) hsh = (hsh * 31 + nm.charCodeAt(i)) >>> 0;
  const hue = hsh % 360;
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
  ctx.fillStyle = 'hsl(' + hue + ',45%,16%)'; ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'hsl(' + hue + ',90%,62%)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r - 3.5, 0, 6.2832);
  ctx.strokeStyle = 'hsla(' + hue + ',90%,70%,.35)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = 'hsl(' + hue + ',95%,78%)';
  ctx.font = '800 ' + Math.round(r * 1.05) + 'px ui-monospace,Menlo,monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(nm.charAt(0).toUpperCase(), x, y + 1);
  ctx.restore();
}

/* 榜单行渲染（本机榜/全国榜共用）：名次 + 程序化头像 + 昵称 + 分数；me 行青色高亮。 */

  for (let i = 0; i < Math.min(rows.length, 10); i++){
    const r = rows[i];
    const y = y0 + i * 44;

    ctx.save();

      ctx.fillStyle = ['rgba(255,212,94,.14)','rgba(200,210,235,.10)','rgba(214,150,90,.10)'][i];
      ctx.fill();
    }
    drawAvatar(58, y, 12, r.name);
    ctx.font = '700 13px ui-monospace,Menlo,monospace';
    ctx.fillStyle = i < 3 ? [C.gold,'#ccd6e8','#d69660'][i] : 'rgba(150,180,225,.7)';
    ctx.fillText(String(i + 1).padStart(2, '0'), 78, y);
    ctx.font = '600 12px ui-monospace,Menlo,monospace';
    ctx.fillStyle = me ? C.cyan : '#dbe8ff';
    ctx.fillText(String(r.name || 'PLAYER').substring(0, 10), 112, y);
    ctx.textAlign = 'right';
    ctx.font = '700 13px ui-monospace,Menlo,monospace';
    ctx.fillStyle = me ? C.cyan : '#eaf4ff';
    ctx.fillText(String(r.score), 424, y);
    ctx.textAlign = 'left';
    ctx.restore();
  }
}

        ctx.fillText('（测试号不支持云开发只能走 B；详见 README）', 240, NR.y + 236);
      }
    }
  } else {
    // 本机榜 rows
    const rows = state.board;
    ctx.textAlign = 'left';
    if (state.boardLoading || rows === null){
      ctx.textAlign = 'center';
      ctx.font = '600 11px ui-monospace,Menlo,monospace';
      ctx.fillStyle = 'rgba(150,180,225,.6)';
      ctx.fillText('加载中…', 240, 360);
    } else if (rows.length === 0){
      ctx.textAlign = 'center';
      ctx.font = '600 11px ui-monospace,Menlo,monospace';
      ctx.fillStyle = 'rgba(150,180,225,.6)';
      ctx.fillText('还没有成绩，去拿第一个', 240, 360);
    } else {

    }
  }

  btn('bBack', 140, 660, 200, 46, '返回', '', {accent:C.cyan,
    action:function(){
      if (state.mode === 'over') state.screen = 'over';
      else { state.screen = 'menu'; state.mode = 'over'; }
    }});
  ctx.restore();
}

function drawOverlays(){
  if (state.mode === 'ready' && state.screen === 'play'){
    const pulse = 0.55 + 0.45 * Math.sin(state.time * 5);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const pw = 168, ph = 34, px = 240 - pw / 2, py = 660;
    ctx.globalAlpha = 0.25 + pulse * 0.35;
    rr(px, py, pw, ph, 17);
    ctx.fillStyle = 'rgba(8,14,34,.9)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(110,200,255,' + (0.35 + pulse * 0.45) + ')';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.globalAlpha = 0.6 + pulse * 0.4;
    ctx.font = '700 12px ui-monospace,Menlo,monospace';
    ctx.letterSpacing = '1.5px';
    ctx.fillStyle = 'rgba(175,220,255,' + (0.6 + pulse * 0.4) + ')';
    ctx.fillText(state.charging ? '蓄力中… 松开发射' : '按住 空格/屏幕 蓄力', 241, py + ph / 2 + 1);
    ctx.letterSpacing = '0px';
    ctx.globalAlpha = 1;

    // plunger charge meter (six arch lights, like the original's skill-shot chute)
    if (state.charging || state.charge > 0){
      const cw = 200, cx0 = 240 - cw / 2, cy0 = 706;
      ctx.fillStyle = 'rgba(6,10,26,.85)';
      rr(cx0 - 4, cy0 - 7, cw + 8, 14, 7);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,212,94,.35)';
      ctx.lineWidth = 1;
      rr(cx0 - 4, cy0 - 7, cw + 8, 14, 7);
      ctx.stroke();
      const w = cw * state.charge;
      const grad = ctx.createLinearGradient(cx0, 0, cx0 + cw, 0);
      grad.addColorStop(0, C.cyan);
      grad.addColorStop(0.55, C.gold);
      grad.addColorStop(0.8, C.orange);
      grad.addColorStop(1, C.magenta);
      ctx.fillStyle = grad;
      if (w > 2){ rr(cx0, cy0 - 4, w, 8, 4); ctx.fill(); }
      // arch-light ticks
      ctx.strokeStyle = 'rgba(255,255,255,.4)';
      for (let k = 1; k < 6; k++){
        const tx = cx0 + cw * k / 6;
        ctx.beginPath(); ctx.moveTo(tx, cy0 - 6); ctx.lineTo(tx, cy0 + 6); ctx.stroke();
      }
      ctx.font = '600 8px ui-monospace,Menlo,monospace';
      ctx.fillStyle = 'rgba(255,212,94,.75)';
      ctx.fillText(state.charge > 0.86 ? '满力 → 满力出击' : '力度 ' + Math.round(state.charge * 100) + '%', 240, cy0 + 16);
    }
    ctx.restore();
  }

  if (state.banner){
    const t = state.banner.t;
    const k = Math.min(1, (2.2 - t) * 5);
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, t * 2.0)) * Math.max(0.2, k);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 27px ui-monospace,Menlo,monospace';
    ctx.shadowColor = C.gold;
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#fff3c9';
    ctx.fillText(state.banner.text, 240, 430);
    ctx.shadowBlur = 0;
    ctx.font = '600 12px ui-monospace,Menlo,monospace';
    ctx.fillStyle = C.gold;
    ctx.letterSpacing = '2px';
    ctx.fillText(state.banner.sub, 240, 460);
    ctx.letterSpacing = '0px';
    ctx.restore();
  }

  // the run-over panel is a full screen (see drawOverScreen), drawn by render()
}

/* ---------------------------- render ---------------------------- */
function render(){
  if (window.__PS_VIEW){
    const V = window.__PS_VIEW;
    // 真机闪屏的根因之一：每帧把整块缓存做一次全屏缩放 drawImage，部分机型显示层会采样到
    // 半成品帧（闪一下），且大图缩放本身就是大头。改成最便宜也最稳的做法：
    // 整块 buffer 一次性不透明硬铺底（绝无残影/层叠），再画逻辑区。留边与画面同色，无接缝。
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = GUTTER;
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(V.s, 0, 0, V.s, V.ox, V.oy);      // 480x940 逻辑画面等比居中映射到屏幕
  } else {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, CW, CH);
  }
  state.btnRects.length = 0;      // hit areas are rebuilt every frame

  // 3D 版：对局用 WebGL 画台面，2D 画布只留 HUD（背板/蓄力条/暂停）。菜单等全屏页仍走 2D。
  const use3D = !!(window.__R3 && window.__R3.ready && state.screen === 'play');
  window.__R3on = use3D;

  if (!use3D) drawBackground();

  ctx.save();
  const sh = state.shake;
  if (sh > 0.4){
    ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
  }

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, HEAD, W, H);
  ctx.clip();
  ctx.translate(0, HEAD);

  // pseudo-3D table lean: a nudge rocks the whole cabinet a fraction of a degree
  if (state.nudge > 0.02){
    ctx.translate(240, 400);
    ctx.rotate(state.nudge * 0.012 * (state.nudgeDir || 1));
    ctx.translate(-240, -400);
  }

  if (!use3D){
  drawPlayfieldDeco();
  drawTableLight();
  drawZones();
  drawDrainZone();
  drawPlunger();
  drawDeployGauge();
  drawWalls();
  drawBoardStructure();     // 顶部环道 + 发射道枕木（静态层，逐帧贴图）
  drawFuelLights();
  drawSlings();
  drawOutGates();
  drawPosts();
  drawDropBank();
  drawHazards();
  drawHyper();
  drawCenterPost();         // 中央挡柱：升起时立在排水口正中
  drawFlippers();
  drawBumpers();
  drawDock();               // 以下均为一层台面实体：先画，被甲板/高架正确遮挡
  drawBlackHole();
  drawRankRing();
  drawWorms();
  drawFlags();              // 旗标旋转器：左墙双旗
  drawWarpLink();
  drawBalls('lower');       // 一层球
  drawUpperShadows();       // 二层球投在一层台面上的落影（高度感的锚点）
  drawDeckUnder();          // 甲板占地阴影与支撑柱：位于一层球之后
  drawDeckTop();            // 悬空甲板：压住下方穿行的球（被挡时自动淡出）
  drawDeckModules();        // 甲板上的建筑（上移 z）：航道 / 碉堡 / 球锁 / 出口洞
  drawLift();               // 架空坡道桥：加宽渐变、与二层打通
  drawBalls('upper');       // 二层球：上移 + 放大（含坡道滑行球）
  drawGate();               // 发射口单向闸门：位于发射道顶端
  drawLaneLamps();
  drawMissionTargets();     // 三个任务靶：rollover 灯珠 + 顶部弧线灯带（此前漏画）
  drawMissionLamps();
  drawSpotNames();
  drawSpotMarker();

  for (let i = 0; i < parts.length; i++){
    const p = parts[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < pops.length; i++){
    const p = pops[i];
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.4));
    ctx.fillStyle = p.c;
    ctx.font = '700 13px ui-monospace,Menlo,monospace';
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  }

  if (use3D && location.hash.indexOf('noovl') < 0) {
    try { window.__PS.drawDyn(); }
    catch (e) {
      window.__DYNERR = (window.__DYNERR || 0) + 1;
      if (window.__DYNERR < 3) { try { console.log('drawDyn ERR: ' + e.message + ' @ ' + (e.stack||'').split('\n')[1]); } catch (e2) {} }
    }
  }

  drawOverlays();

  if (!use3D && state.flash > 0){
    // 闪烁**不再整屏叠色**：整屏半透明色一旦在慢帧下滞留，就会表现成"全屏被加了一层蒙版"。
    // 改成四边光晕脉冲（画面中央永远清晰），颜色只出现在边框内侧一圈。
    const rdt = window.__PS_RDT || 0.016;
    // 慢帧直接掐掉：一帧就过去的闪烁没有意义，只会变成一张静态色罩
    state.flash = rdt > 0.12 ? 0 : Math.max(0, state.flash - rdt * 3.2);
    if (state.flash > 0){
      const a = Math.min(1, state.flash) * 0.30;
      const bw = 26 + 34 * Math.min(1, state.flash);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const eg = ctx.createLinearGradient(0, 0, bw, 0);
      eg.addColorStop(0, 'rgba(255,215,120,' + a.toFixed(3) + ')');
      eg.addColorStop(1, 'rgba(255,215,120,0)');
      // 左/右
      ctx.fillStyle = eg;                        ctx.fillRect(0, 0, bw, CH);
      ctx.save(); ctx.translate(CW, 0); ctx.scale(-1, 1);
      ctx.fillStyle = eg;                        ctx.fillRect(0, 0, bw, CH);
      ctx.restore();
      const vg2 = ctx.createLinearGradient(0, 0, 0, bw);
      vg2.addColorStop(0, 'rgba(255,215,120,' + a.toFixed(3) + ')');
      vg2.addColorStop(1, 'rgba(255,215,120,0)');
      // 上/下
      ctx.fillStyle = vg2;                       ctx.fillRect(0, 0, CW, bw);
      ctx.save(); ctx.translate(0, CH); ctx.scale(1, -1);
      ctx.fillStyle = vg2;                       ctx.fillRect(0, 0, CW, bw);
      ctx.restore();
      ctx.restore();
    }
  }

  if (!window.__PS_VIEW){
    const vg = ctx.createRadialGradient(240, 400, 200, 240, 400, 520);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.45)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, CW, CH);
  }

  ctx.restore();
  ctx.restore();

  applyBloom();             // 3A 后期：泛光，让发光体真正"亮"起来

  // Full-screen states replace the whole cabinet. They are authored in canvas space
// (0..CW, 0..CH) — NOT offset by HEAD — so the backdrop covers the backglass too.
  if (state.screen === 'menu' || state.screen === 'board' || state.screen === 'over' || state.screen === 'ward'){
    // 小游戏端：全屏页的半透明垫色也铺满整块 buffer，留边与画面同底色、无台阶
    if (window.__PS_VIEW){
      const V2 = window.__PS_VIEW;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = (state.screen === 'board' || state.screen === 'ward') ? 'rgba(3,5,14,.92)' : 'rgba(3,5,14,.90)';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.setTransform(V2.s, 0, 0, V2.s, V2.ox, V2.oy);
    }
    ctx.save();
    if (state.screen === 'menu') drawMenu();
    else if (state.screen === 'board') drawBoard();
    else if (state.screen === 'ward') drawWard();
    else drawOverScreen();
    ctx.restore();
  } else {
    drawBackglass();
  }

  ctx.save();
  rr(0.5, 0.5, CW - 1, CH - 1, 14);
  ctx.strokeStyle = 'rgba(110,160,255,.25)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  if (state.screen === 'play' && !state.paused) drawPauseBtn();
  if (state.paused) drawPause();

  // 3D bezel: the room light comes from above, so the cabinet sides catch gradient shade
  ctx.save();
  let bz = ctx.createLinearGradient(0, 0, 16, 0);
  bz.addColorStop(0, 'rgba(150,190,255,.13)');
  bz.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bz;
  ctx.fillRect(0, 0, 16, CH);
  bz = ctx.createLinearGradient(CW, 0, CW - 16, 0);
  bz.addColorStop(0, 'rgba(150,190,255,.13)');
  bz.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bz;
  ctx.fillRect(CW - 16, 0, 16, CH);
  bz = ctx.createLinearGradient(0, 0, 0, 14);
  bz.addColorStop(0, 'rgba(210,230,255,.16)');
  bz.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bz;
  ctx.fillRect(0, 0, CW, 14);
  ctx.restore();

  if (use3D) window.__R3.frame();

  // 帧末提交（小游戏端）：整帧全部画完后，一次性把离屏缓冲贴到屏幕上屏画布。
  // 微信小游戏主画布实时呈现、没有帧缓冲，一帧内的中间态（星云蓝紫/台面绿光/闪光黄）都会露脸，
  // 帧一慢就表现为"整屏闪一下颜色，而且像被蒙了一层色"。唯一可靠的解法就是这一处双缓冲。
  // 网页端没有 presentBack，天然跳过（浏览器本身就是整帧提交）。
  if (typeof presentBack === 'function') presentBack();
}

/* ---------------------------- pause ---------------------------- */
function drawPauseBtn(){
  ctx.save();
  rr(PB.x, PB.y, PB.w, PB.h, 9);
  ctx.fillStyle = 'rgba(8,13,32,.62)'; ctx.fill();
  ctx.strokeStyle = 'rgba(130,170,230,.4)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = 'rgba(214,232,255,.9)';
  rr(PB.x + 15, PB.y + 13, 5, 18, 2.5); ctx.fill();
  rr(PB.x + 25, PB.y + 13, 5, 18, 2.5); ctx.fill();

}
function drawPause(){
  ctx.save();
  ctx.fillStyle = 'rgba(3,5,14,.80)';
  ctx.fillRect(0, 0, CW, CH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.letterSpacing = '4px';
  ctx.fillStyle = '#eaf4ff';
  ctx.shadowColor = C.violet; ctx.shadowBlur = 16;
  ctx.fillText('PAUSED', 240, 300);
  ctx.shadowBlur = 0; ctx.letterSpacing = '0px';
  ctx.font = '600 10px ui-monospace,Menlo,monospace';
  ctx.fillStyle = 'rgba(150,190,240,.55)';
  ctx.fillText('弹珠的奔走 · PINBALL STAR', 240, 328);
  btn('pResume', 140, 372, 200, 48, '回到游戏', '', {accent:C.cyan, primary:true,
    action:function(){ state.paused = false; }});
  btn('pRestart', 140, 436, 200, 48, '重新开始', '', {accent:C.dim,
    action:function(){ state.paused = false; restart(state.gameMode); }});
  btn('pMenu', 140, 500, 200, 48, '回主菜单', '', {accent:C.dim,
    action:function(){ state.paused = false; state.screen = 'menu'; state.mode = 'over'; }});
  ctx.restore();
}

/* ---------------------------- loop ---------------------------- */
const STEP = 1 / 240;
let last = performance.now();
let acc = 0;

function loop(now){
  requestAnimationFrame(loop);
  const rawDt = Math.max(0, (now - last) / 1000);
  last = now;
  window.__PS_RDT = Math.min(0.5, rawDt);   // 真实帧间隔：特效按真实时间衰减，慢帧时不至于整屏滞留
  let dt = rawDt;
  if (dt > 0.1) dt = 0.1;
  if (state.paused){ acc = 0; }
  else {
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard < 60){
      update(STEP);
      acc -= STEP;
      guard++;
    }
    if (guard >= 60) acc = 0;
  }
  // 丢 up 事件兜底：满力后再握 0.4s 自动发射，避免"点了没反应"
  if (state.charging && state.chargeAt && state.charge >= 0.999){
    const tn = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    if (tn - state.chargeAt > 1150 + 400) releaseCharge();
  }
  autoQuality(window.__PS_RDT);   // 必须用真实帧间隔：dt 被钳到 0.1 时，几秒一帧的机器永远测不出低帧
  render();
}

/* ---------------------------- input ---------------------------- */
function setFlipper(f, down){
  if (state.tilt > 0) return;
  if (f.pressed !== down){
    f.pressed = down;
    if (down){
      sfx.flip();
      // 原版规则：按下挡板会轮换航道灯的位置——挡板不只救球，也用来凑缓冲器升级
      const L = state.lanes;
      if (state.mode === 'play' && (L[0] || L[1] || L[2])){
        if (f === leftF) L.push(L.shift()); else L.unshift(L.pop());
        sfx.select();
      }
    }
  }
}

function onKey(e, down){
  const k = e.key.toLowerCase();

  if (down && (k === 'escape' || k === 'p') && state.screen === 'play'){
    state.paused = !state.paused; state.charging = false;
    e.preventDefault();
    return;
  }

  // screens with buttons: arrows move the selection, space activates
  if (state.screen === 'menu' || state.screen === 'over' || state.screen === 'board' || state.screen === 'ward'){
    if (down && (k === ' ' || k === 'spacebar' || k === 'enter')){ primary(); e.preventDefault(); }
    if (down && (k === 'escape' || k === 'backspace')){
      if (state.screen !== 'menu'){ state.screen = state.mode === 'over' ? 'over' : 'menu'; }
      e.preventDefault();
    }
    return;
  }

  if (k === 'arrowleft' || k === 'a'){
    setFlipper(leftF, down);
    e.preventDefault();
  } else if (k === 'arrowright' || k === 'd'){
    setFlipper(rightF, down);
    e.preventDefault();
  } else if (k === ' ' || k === 'spacebar' || k === 'enter'){
    if (down) primary(); else releaseCharge();
    e.preventDefault();
  } else if (k === 'n' && down){
    nudge(-1);
  } else if (k === 'm' && down){
    state.muted = !state.muted;
  } else if (k === 'r' && down){
    restart(state.gameMode);
  }
}
window.addEventListener('keydown', function(e){
  if (!e.repeat) onKey(e, true);
  else if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', function(e){ onKey(e, false); });

const PB = {x:8, y:HEAD+6, w:44, h:44};   // 暂停按钮：台面左上死角，避开微信胶囊与背板信息区
function ptr2log(e){
  if (window.__PS_VIEW){
    // 微信小游戏：触摸坐标是逻辑像素，按建 buffer 时的倍率与 VIEW 留边反推；
    // 不走 getBoundingClientRect —— 真机/模拟器口径不一，是点不中的根源
    const V = window.__PS_VIEW, pr = window.__PS_PR || 1;
    return { x: (e.clientX * pr - V.ox) / V.s, y: (e.clientY * pr - V.oy) / V.s };
  }
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * CW, y: (e.clientY - r.top) / r.height * CH };
}

const pointerSide = new Map();
function pointerDown(e){
  e.preventDefault();
  ac();
  const p = ptr2log(e);
  const x = p.x, y = p.y;

  if (state.paused){
    // 静态命中区：暂停页按钮位置固定，不依赖"上一帧已渲染出 btnRects"，
    // 避免卡帧时点了没反应、隔几秒才补执行的体感
    if (x >= 140 && x <= 340){
      if (y >= 372 && y <= 420){ ac(); state.paused = false; return; }
      if (y >= 436 && y <= 484){ ac(); state.paused = false; restart(state.gameMode); return; }
      if (y >= 500 && y <= 548){ ac(); state.paused = false; state.screen = 'menu'; state.mode = 'over'; return; }
    }
    return;
  }

  /* Buttons first: in menu / over / board the whole canvas is a UI surface. Button
     rects are in canvas coords already (the screens are drawn with a HEAD offset). */
  if (state.screen === 'menu' || state.screen === 'over' || state.screen === 'board' || state.screen === 'ward'){
    const hit = hitButton(x, y);   // btnRects already hold absolute canvas coords
    if (hit){ ac(); hit.action(); return; }
    if (state.screen === 'board' || state.screen === 'ward') return;
    return;
  }

  if (state.screen === 'play' && x >= PB.x && x <= PB.x + PB.w && y >= PB.y && y <= PB.y + PB.h){
    state.paused = true; state.charging = false;
    return;
  }

  if (state.mode === 'ready') { startCharge(); return; }

  if (y < HEAD){
    if (x > W - 74 && y < 90) state.muted = !state.muted;
    return;
  }

  const side = x < CW / 2 ? 'L' : 'R';
  pointerSide.set(e.pointerId, side);
  if (side === 'L') setFlipper(leftF, true); else setFlipper(rightF, true);
}

function hitButton(x, y){
  for (let i = 0; i < state.btnRects.length; i++){
    const b = state.btnRects[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
  }
  return null;
}
function pointerUp(e){
  if (state.charging){ releaseCharge(); pointerSide.delete(e.pointerId); return; }
  const side = pointerSide.get(e.pointerId);
  if (!side) return;
  pointerSide.delete(e.pointerId);
  let stillL = false, stillR = false;
  pointerSide.forEach(function(v){ if (v === 'L') stillL = true; else stillR = true; });
  if (!stillL) leftF.pressed = false;
  if (!stillR) rightF.pressed = false;
}
cv.addEventListener('pointerdown', pointerDown, {passive:false});
cv.addEventListener('pointerup', pointerUp);
cv.addEventListener('pointercancel', pointerUp);
cv.addEventListener('pointerleave', pointerUp);
window.addEventListener('contextmenu', function(e){ if (e.target === cv) e.preventDefault(); });

window.addEventListener('pointerdown', ac, {once:true});
window.addEventListener('keydown', ac, {once:true});

/* boot: open on the menu; the table only starts when a mode is chosen */
PF.init({ adUnitId: (typeof window !== 'undefined' && window.PS_AD_UNIT) || '' });
state.profile = loadProfile();
state.screen = 'menu';
state.mode = 'over';
resetBall();
makeMetalPattern();

requestAnimationFrame(loop);

/* debug hook for automated verification */
window.__PS = {
  // 3D 版额外导出（仅本文件）：3D 渲染层需要坡道/二层高度、粒子与飘字
  RAMP: RAMP, DECK3D: DECK3D, pops: pops, parts: parts, CAM: CAM,
  TRAILS: TRAILS, SKINS: SKINS,
  // 坡道几何：3D 层要按同一条中心线与高度曲线构建实体槽，必须用同一套函数
  rampPoint: rampPoint, rampH: rampH, rampHalfW: rampHalfW,
  /* 把某一层画进指定的 2D 上下文。
     注意：绘制函数内部用的是闭包变量 ctx，传参会无效（曾导致挡板被画到上层 2D 画布、
     位置与透视台面错开）。这里临时替换 ctx 后再恢复，是唯一可靠的做法。 */
  drawInto: function (g, which) {
    const saved = ctx;
    ctx = g;
    try {
      if (which === 'flip') drawFlippers();
    } catch (e) {
      try { console.log('drawInto(' + which + ') failed: ' + e.message); } catch (e2) {}
    } finally {
      ctx = saved;
    }
  },
  ZONES: ZONES, SPOTS: SPOTS, RING: RING, WORMS: WORMS, FLAGS: FLAGS,
  /* 把原版台面的**静态装饰**烘成一张贴图 —— 3D 台面直接用它，
     这样台面的视觉 100% 是原版那套（分区/刻线/铭牌/装饰全在），
     3D 只负责球、缓冲器、挡板这些需要立体感的实体。 */
  /* 按"层"烘焙原版 2D 绘制：每一层都是原版画出来的成品图，
     3D 只负责把它放到不同高度上 —— 这是原版 Space Cadet 的做法
     （2D 背景位图 + 精灵 + z 深度图 + 透视矩阵），而不是把美术重建成几何体。 */
  /* 静态底图：只有真正不动的东西（星空/台面装饰/台面光照/墙体/油量灯/蓄力刻度）。
     所有会动的元素一律由 drawDyn 逐帧用原版函数绘制 —— 这样细节零丢失、动画不冻结。 */
  bake: function (which, scale) {
    const sc = scale || 1.5;
    const c = document.createElement('canvas');
    c.width = Math.round(480 * sc);
    c.height = Math.round(800 * sc);
    const g = c.getContext('2d');
    g.setTransform(sc, 0, 0, sc, 0, 0);
    const saved = ctx;
    ctx = g;
    try {
      if (which === 'base') {
        g.fillStyle = GUTTER; g.fillRect(0, 0, 480, 800);
        drawBgGradients();
        try {
          var seed = 20261125;
          function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
          for (var i = 0; i < 170; i++){
            var sx2 = rnd() * 480, sy2 = rnd() * 800, rr2 = 0.5 + rnd() * 1.5;
            g.globalAlpha = 0.25 + rnd() * 0.6;
            g.fillStyle = rnd() < 0.25 ? '#9fd8ff' : '#ffffff';
            g.beginPath(); g.arc(sx2, sy2, rr2, 0, 6.2832); g.fill();
          }
          g.globalAlpha = 1;
        } catch (e0) {}
        drawPlayfieldDeco();
        drawTableLight();
        drawWalls();
        drawBoardStructureRaw();   // 顶部环道 + 发射道枕木：烘进底图，不在动态层重复画
        drawFuelLights();
        drawDeployGauge();
      } else if (which === 'ramp' || which === 'deck') {
        /* 关键：drawDeckTop / drawLift 内部会按 DECK3D.z 把内容"抬起来"画。
           烘焙时必须把这个抬升临时归零，否则"烘一次 + 3D 抬一次" = 抬两倍。 */
        const zSave = DECK3D.z;
        DECK3D.z = 0;
        try {
          // 必须调 **Raw** 版本：drawDeckTop() 会走 deckTopCache，
          // 而那份缓存是 z=52 时烘的，改 DECK3D.z 对它无效（会多抬一次）。
          if (which === 'deck') { drawDeckTopRaw(); drawDeckModules(); }
          else { drawLift(); }
        } finally { DECK3D.z = zSave; }
      } else if (which === 'bumpers') {
        // 单独烘缓冲器：3D 圆柱顶面要裁这块图案（美术照搬，不重画）
        drawBumpers();
      } else if (which === 'flip') {
        drawFlippers();
      }
    } catch (e) {
      try { console.log('bake(' + which + ') partial: ' + e.message); } catch (e2) {}
    } finally {
      ctx = saved;
    }
    return c;
  },

  /* 动态细节层：**严格按 2D render() 的调用顺序**，全部用原版绘制函数逐帧绘制。
     这条链路保证"2D 里有的每一处细节、每一个动画"在 3D 版里都有，且位置一致。 */
  drawDyn: function () {
    drawZones();
    drawDrainZone();
    drawPlunger();
    drawSlings();
    drawPosts();
    drawDropBank();      // 落靶：立着的靶会挡球，必须在球之前画
    drawHazards();       // 危险带三灯
    drawHyper();         // 环道顶点超空间环
    drawCenterPost();    // 中央挡柱（升起时压在排水口上）
    drawOutGates();
    drawFlippers();
    // 缓冲器 / 二层 / 坡道 已由 3D 实体提供（见 r3-3d.js），这里不重复绘制
    drawDock();
    drawBlackHole();
    drawRankRing();
    drawWorms();
    drawFlags();
    drawWarpLink();
    drawBalls('lower');
    drawDeckUnder();
    drawDeckTop();
    drawDeckModules();
    // 坡道：原版精细绘制（银轨 / 黄带 / 立柱 / 与二层 apron 融合）
    drawLift();
    /* 二层/坡道上的球必须在这之后绘制，否则会被甲板压住看不见。
       2D 版的顺序是 drawDeckTop → drawDeckModules → drawLift → drawBalls('upper')，
       这里之前漏了这一行，导致球上桥/上二层后"消失"。 */
    drawBalls('upper');
    drawGate();
    drawLaneLamps();
    drawMissionTargets();   // 三个任务靶
    drawMissionLamps();
    drawSpotNames();
    drawSpotMarker();
    drawUpperShadows();
    /* 球的拖尾随球一起由 drawBalls 绘制（自带原版彗尾），不再单独上 3D 层。 */
  },
  caches: function(){ return [!!bgGradCache, !!spotNamesCache, !!deckTopCache, !!deckUnderCache, !!tableLightCache]; },
  autoPause: function(){ if (state.screen === 'play' && !state.paused){ state.paused = true; state.charging = false; } },
  state: state, balls: balls, leftF: leftF, rightF: rightF,
  PF: PF,
  BUMPERS: BUMPERS, POSTS: POSTS, SLINGS: SLINGS, WALLS: WALLS,
  MISSION_TARGETS: MISSION_TARGETS, WORMS: WORMS, RING_POS: RING_POS,
  WELL: WELL, FLAGS: FLAGS, RING: RING, DECK2: DECK2, BLACKHOLE: BLACKHOLE,
  DOCK_POSTS: DOCK_POSTS, DECK_LANES: DECK_LANES, DECK_TARGETS: DECK_TARGETS,
  SPOTS: SPOTS, stageNow: stageNow,
  FUEL_POS: FUEL_POS, GATE: GATE, RANKS: RANKS, MISSIONS: MISSIONS,
  launch: launch, restart: restart, update: update, primary: primary,
  startCharge: startCharge, releaseCharge: releaseCharge,
  render: render, drawGate: drawGate,
  plungerHeadY: plungerHeadY, drawPlunger: drawPlunger,
  swallow: function(b, i){ b.wormT = 2.0; b.wormOut = i; b.hidden = true; b.vx = 0; b.vy = 0; },
  ballLost: ballLost, addScore: addScore, spawnBall: spawnBall,
  selectMission: selectMission, startMission: startMission,
  missionSlots: missionSlots, completeMission: completeMission,
  promote: promote, nudge: nudge, enterWorm: enterWorm,
  setFlipper: setFlipper,
  // Space Cadet mechanics
  stageNow: stageNow, advanceStage: advanceStage, missionProgress: missionProgress,
  hitLane: hitLane, grantReplay: grantReplay, startMultiball: startMultiball,
  hitDropTarget: hitDropTarget, hitHazard: hitHazard, hitHyper: hitHyper,
  guideNow: guideNow, DROP_BANK: DROP_BANK, HAZARDS: HAZARDS,
  CENTER_POST: CENTER_POST, HYPER: HYPER,
  upgradeBumpers: upgradeBumpers, setFlipper: setFlipper,
  LANE_LAMPS: LANE_LAMPS,
  // competition layer
  endRun: endRun, revive: revive, requestRevive: requestRevive,
  requestDouble: requestDouble, requestSupport: requestSupport, tryEquip: tryEquip,
  issueDrill: issueDrill, failDrill: failDrill, completeDrill: completeDrill,
  drillProgress: drillProgress,
  CAM: CAM, ballLight: ballLight,
  OUTGATES: OUTGATES, UPPER_BUNKERS: UPPER_BUNKERS,
  DOCK: DOCK, BLACKHOLE: BLACKHOLE, MISSION_LAMPS: MISSION_LAMPS, ZONES: ZONES,
  startMission: startMission, selectMission: selectMission, dockHit: dockHit,
  openBlackHole: openBlackHole, blackHolePull: blackHolePull,
  activateReward: activateReward, triggerMissionChain: triggerMissionChain,
  deployBandOf: deployBandOf, applyDeploy: applyDeploy, autoDeploy: autoDeploy,
  DEPLOY_BANDS: DEPLOY_BANDS, REWARDS: REWARDS, zoneNow: zoneNow, zoneOf: zoneOf,
  LAMP_N: LAMP_N, WORMS: WORMS,
  DECK: DECK, DECK_LANES: DECK_LANES, DECK_TARGETS: DECK_TARGETS, stepTopModules: stepTopModules,
  lockBall: lockBall,
  submitScore: submitScore, openBoard: openBoard, hitButton: hitButton
};

// 调试入口：URL 带 #play 直接进局；#demo 进局并摆一个坡道滑行球+一个二层球（截图/自检用）
// #regress：同步跑物理回归（坡道捕获→接入二层→二层落洞回一层），结果写 document.title，
// 供 headless Chrome --dump-dom 抓取（tests/regress_web.sh）。
if (location.hash === '#regress'){
  restart('classic');
  state.mode = 'play';
  var R = {captured:false, reachedUpper:false, drained:false, frames:0};
  var b = balls[0];
  if (b){
    b.hidden = false; b.deck = 'lower'; b.rampT = undefined;
    // 从新入口(198,374)下方一记高速上撩穿过传感器区（模拟左挡板上撩引导通道）
    b.x = 198; b.y = 406; b.vx = 0; b.vy = -520; b.trail.length = 0;
    var i;
    for (i = 0; i < 600 && !R.captured; i++){ update(1/60); R.frames++; if (b.rampT !== undefined) R.captured = true; }
    for (i = 0; i < 600 && !R.reachedUpper; i++){ update(1/60); R.frames++; if (b.deck === 'upper') R.reachedUpper = true; }
    for (i = 0; i < 3600 && !R.drained; i++){ update(1/60); R.frames++; if (R.reachedUpper && b.deck === 'lower') R.drained = true; }
  }
  document.title = 'REGRESS ' + JSON.stringify(R);
}
if (location.hash === '#play') restart('classic');
if (location.hash === '#board'){ restart('classic'); openBoard('classic'); }
// 审核截图预置（仅网页端，同步区外）：#seedboard 写入昵称/本机最佳/榜单样例，供 headless 二次进入 #board 出图
if (location.hash === '#seedboard'){
  try {
    localStorage.setItem('ps_name', '星际旅人');
    localStorage.setItem('ps_best', '5230');
    localStorage.setItem('ps_board_v1', JSON.stringify([
      {name:'星云猎手', score:12850, rank:5, missions:9, mode:'classic', ts:Date.now()},
      {name:'冰环守卫', score:11240, rank:4, missions:7, mode:'classic', ts:Date.now()},
      {name:'天鹅座α', score:9860, rank:4, missions:6, mode:'classic', ts:Date.now()},
      {name:'虫洞漫游者', score:8420, rank:3, missions:5, mode:'classic', ts:Date.now()},
      {name:'轨道炮手', score:7150, rank:3, missions:4, mode:'classic', ts:Date.now()},
      {name:'超新星_7', score:6020, rank:2, missions:3, mode:'classic', ts:Date.now()},
      {name:'星际旅人', score:5230, rank:2, missions:3, mode:'classic', ts:Date.now()}
    ]));
    document.title = 'SEEDED';
  } catch(e){}
}
// 审核截图驱动（仅网页端，同步区外）：#shot=<scene> 摆出指定状态供 headless 截图
// scene: menu|ready|charge|play|worm|multi|over|promote|ward
if (location.hash.indexOf('#shot=') === 0){
  const sc = location.hash.slice(6);
  restart('classic');
  if (sc === 'menu'){ state.screen = 'menu'; state.mode = 'over'; }
  else { state.screen = 'play'; state.mode = 'play'; }
  const b = balls[0];
  if (sc === 'ready'){ state.mode = 'ready'; }
  if (sc === 'charge'){ state.mode = 'ready'; startCharge(); for (let i = 0; i < 40; i++) update(1/60); }
  if (sc === 'play'){ b.x = 240; b.y = 430; b.vx = 140; b.vy = -160; }
  if (sc === 'worm'){
    b.x = 240; b.y = 430; b.vx = 120; b.vy = -140;
    const w2 = spawnBall();
    if (w2){ w2.wormT = 99; w2.wormOut = 1; w2.hidden = true; }
  }
  if (sc === 'multi'){
    startMultiball();
    for (let i = 0; i < balls.length; i++){
      const bb = balls[i];
      if (!bb.hidden){ bb.x = 150 + i * 85; bb.y = 370 + i * 45; bb.vx = 90; bb.vy = -120; }
    }
    if (balls[1]){ balls[1].wormT = 99; balls[1].wormOut = 2; balls[1].hidden = true; }
  }
  if (sc === 'over'){ state.score = 8390; state.best = Math.max(state.best, 8390); state.screen = 'over'; state.mode = 'over'; }
  if (sc === 'promote'){ state.score = 5200; promote(); if (state.banner) state.banner.t = 9; }
  if (sc === 'ward'){ state.screen = 'ward'; }
  if (sc === 'pause'){ restart('classic'); state.paused = true; }
}
if (location.hash === '#demo' || location.hash.indexOf('#ride') === 0){
  restart('classic');
  setTimeout(function(){
    state.mode = 'play';                    // ready 态不跑物理，先切到 play
    RAMP.rideT = 1e9;                       // 冻住滑行进度，便于观察中途姿态
    var rt = 0.42;
    if (location.hash.indexOf('#ride') === 0){
      var v = parseFloat(location.hash.slice(5));
      if (isFinite(v)) rt = Math.max(0, Math.min(1, v / 100));
    }
    var b = balls[0];
    if (b){ b.rampT = rt; b.rampZ = rampH(rt); b.hidden = false; }
    var u = spawnBall();
    if (u){ u.deck = 'upper'; u.x = DECK2.cx; u.y = DECK2.cy + 60; u.hidden = false;
            u.rampT = undefined; u.vx = 0; u.vy = 0; }
  }, 60);
}

})();
