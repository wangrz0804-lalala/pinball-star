function launch(){
  if (state.mode !== 'ready') return;
  ac();
  const b = balls[0];
  if (!b) return;
  const p = Math.max(0.05, Math.min(1, state.charge));
  state.plungeFrom = p;
  state.plungeStrike = 0;   // 触发撞杆：蓄力→猛冲→弹簧回弹
  const band = deployBandOf(p);
  state.deployZone = band.id;
  state.mode = 'play';
  state.skill = false;
  state.plungeMin = 9999;
  state.skillTier = 0;
  state.charge = 0;
  state.launchAt = state.time;   // 重新部署窗口从这里起算 15 秒
  applyDeploy(b, band.id);
}
function startCharge(){
  ac();
  if (state.screen === 'menu') { restart('classic'); return; }
  if (state.screen === 'board') { state.screen = state.mode === 'over' ? 'over' : 'menu'; return; }
  if (state.screen === 'over'){ restart(state.gameMode); return; }
  if (state.mode === 'ready'){ state.charging = true; state.charge = 0; state.chargeAt = (typeof performance !== 'undefined' ? performance.now() : Date.now()); }
}
function releaseCharge(){
  if (!state.charging) return;
  state.charging = false;
  launch();
}
function primary(){
  ac();
  if (state.screen === 'menu') { restart('classic'); return; }
  if (state.screen === 'board') { state.screen = state.mode === 'over' ? 'over' : 'menu'; return; }
  if (state.screen === 'ward'){ state.screen = 'menu'; return; }
  if (state.screen === 'over'){ restart(state.gameMode); return; }
  if (state.mode === 'ready') startCharge();
}
function ballLost(){
  // 重新部署（原版重玩球）：离开发射区 15 秒内坠毁，不消耗球，任务/燃料/得分全保留
  if (state.mode === 'play' && state.time - state.launchAt < 15){
    state.banner = {t:1.9, text:'重新部署', sub:'15 秒内坠毁 · 球未消耗 · 状态保留'};
    state.flash = 0.7;
    sfx.fuel();
    resetBall();
    state.mode = 'ready';
    return;
  }

  // REPLAY (ball save): the original returns the ball rather than consuming it, and
  // importantly does NOT abort the running mission.
  if (state.replay){
    state.replay = false;
    var lamp = docById('replayLamp');
    if (lamp) lamp.classList.remove('on');
    state.banner = {t:1.6, text:'REPLAY', sub:'球保生效 · 任务继续'};
    state.flash = 0.7;
    sfx.fuel();
    resetBall();
    state.mode = 'ready';
    return;
  }

  sfx.drain();
  state.shake = 8;
  state.mult = 1;
  state.stars = [false, false, false];
  state.ballsLeft--;

  // END-OF-BALL BONUS, as the original pays on every drain. Scaled by rank, by missions
  // completed and by lit lamps, so a productive ball is worth more than a passive one.
  {
    const litLamps = state.lanes.filter(Boolean).length;
    const bonus = Math.round((5000 + state.rank * 2500) *
                             (1 + state.missionsDone * 0.25) *
                             Math.max(1, litLamps));
    addScore(bonus);
    state.endBonus = bonus;
    popText(240, 620, 'BONUS +' + bonus, C.gold);
    tone(660, 0.16, 'sine', 0.05);
  }

  if (state.mission) abortMission('球已出局');
  state.wormArmed = -1;
  state.multiball = false;
  // per-ball counters reset: medals measure feats of a SINGLE ball
  state.ballMissions = 0;
  state.ballRamps = 0;
  state.runWormSet = {};
  if (state.ballsLeft <= 0){
    state.ballsLeft = 0;
    endRun();
  } else {
    resetBall();
    state.mode = 'ready';
  }
}

/* ---------------------------- per-ball physics ---------------------------- */
/* deck 两态：
   'lower' 一层主台面（挡板/缓冲器/弹射器…）；
   'upper' 二层甲板（独立物理面）：只与甲板弧墙/导流墙/3圆盘/3分流通道互动，
           从前缘出口洞落回一层。上岛唯一路径是左墙升降井。
   发球绕圈高架坡道已移除——发球直入台面（原版无轨道限制）。 */
/* ---------------------------- 二层甲板模块（仅二层球可互动） ---------------------------- */
/* 3 圆盘是圆形碰撞体、3 分流通道是传感器——只对 deck==='upper' 的球生效，
   一层球从甲板下方穿过时与之完全隔离（这正是两层的意义） */
function stepTopModules(b, dt){
  const bSpeed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);

  // —— ③ 物理隔断分流：球穿过 y≈switchY 时按 x 归属到三条通道之一 ——
  // 隔断墙已在 stepUpperDeck 里把球约束在通道内，这里只做一次性 rollover 结算：
  // 点亮该路任务灯 + 装填任务槽；三路全亮 → 多球（原版完成目标开多球）。
  // 球被圆盘弹回过渡区（y<switchY-30）后 chanArmed 复位，可再次结算另一条路。
  if (b.y > DECK2.switchY && b.chanArmed !== false){
    let nearest = 0, best = 1e9;
    for (let i = 0; i < DECK_LANES.length; i++){
      const d = Math.abs(b.x - DECK_LANES[i].x);
      if (d < best){ best = d; nearest = i; }
    }
    b.chanArmed = false;                   // 本次下落只结算一次通道
    b.chanIdx = nearest;                   // 记住分流路，供渲染高亮管道
    const ln = DECK_LANES[nearest];
    if (!ln.lit){
      ln.lit = true; ln.pop = 1; ln.cd = 1.0;
      addScore(900, ln.x, ln.y - 16, C.cyan);
      popText(ln.x, ln.y - 24, '通道 ' + (nearest + 1) + ' · 任务点亮', C.cyan);
      selectMission(nearest);
      missionProgress('lane', 1);
      burst(ln.x, ln.y, C.cyan, 12, 220);
      sfx.select();
      if (DECK_LANES.every(function(l){ return l.lit; })){
        for (let k = 0; k < DECK_LANES.length; k++){ DECK_LANES[k].lit = false; DECK_LANES[k].cd = 0; }
        state.bumpersHot = true;
        addScore(8000, DECK2.cx, DECK2.cy - 40, C.orange);
        lockBall(b);                        // 三路全亮 → 多球
      }
    }
  }
  if (b.y < DECK2.switchY - 30) b.chanArmed = true;   // 回到过渡区，允许下次下落再结算

  // —— ④ 碰撞区：3 个银白圆盘碰撞器（唯一的碰撞单元，品字三角排列）——
  // 撞上反推 + 计分 + 推进『二层撞击』任务；三个连撞给上区全清奖励。
  for (let i = 0; i < DECK_TARGETS.length; i++){
    const t = DECK_TARGETS[i];
    if (t.cd > 0) t.cd = Math.max(0, t.cd - dt);
    const hit = resolveCirc(b, t.x, t.y, t.r, 0.35);
    if (!hit) continue;
    // 脱离方向：优先用碰撞法线 nx；正落盘顶（nx≈0）时按球在盘心左右二选一，
    // 绝不留下 vx≈0 的静止平衡——这是原版 bumper 把球斜向弹出的关键。
    const sx = Math.abs(hit.nx) > 0.25 ? hit.nx : (b.x <= t.x ? -1 : 1);
    if (t.cd > 0 || bSpeed < 70){
      // 低速蹭到 / 冷却中：只分离、不计分，但给横向脱离，避免贴盘死循环
      b.vx = sx * 170; b.vy = -Math.abs(b.vy) * 0.3 - 70;
      continue;
    }
    t.cd = 0.5; t.pop = 1; t.hits++;
    // 命中：像原版 bumper 一样弹起（向上）+ 横向弹开，随后被重力拉向归拢墙。
    // 力度适中：弹太高会在盘顶反复横跳，落不进下面的缝隙。
    b.vx = sx * (100 + Math.random() * 60);
    b.vy = -Math.abs(b.vy) * 0.2 - 90;
    addScore(2000, t.x, t.y - 26, C.gold);
    popText(t.x, t.y - 34, '圆盘命中 +2000', C.gold);
    burst(hit.px, hit.py, C.gold, 14, 260);
    state.shake = 5; state.flash = 0.3;
    sfx.bumper(i);
    missionProgress('ub', 1);
    t.at = state.time;
    if (DECK_TARGETS.every(function(u){ return state.time - u.at < 6; })){
      addScore(12000, DECK2.cx, DECK2.cy - 20, C.orange);
      state.banner = {t:1.6, text:'三层圆盘全清', sub:'上区连撞  +12000'};
      sfx.rank();
      missionProgress('ubx', 1);
      for (let k = 0; k < DECK_TARGETS.length; k++) DECK_TARGETS[k].at = -99;
    }
  }
}

/* ---------------------------- 二层甲板：独立物理面 ---------------------------- */
/* 球在二层时与一层完全隔离：只有甲板边界弧墙、前缘导流墙和甲板上的模块。
   出口是前缘中央的洞，导流墙保证球最终会汇向洞口落回一层。 */
/* 出口直落（无地下隧道）：球从二层中央洞口漏下一层，位置就在洞口正下方，
   给一个朝场地内的下落速度，保留一点高度下落动画——对应原版二层出口直接落台面。 */
function dropFromDeck(b){
  b.deck = 'lower';
  b.hidden = false;
  // 洞口正下方出场，带向下的落速；稍带横向随机让它落进场地而非垂直砸同一个点
  b.x = DECK2.cx + (Math.random() - 0.5) * 10;
  b.y = DECK2.hole.y + 6;
  b.vx = (Math.random() - 0.5) * 120;
  b.vy = 260 + Math.random() * 60;
  b.dropAnim = 0.18;                 // 下落高度动画：从二层高度落到一层
  b.trail.length = 0; b.stuck = 0; b.tries = 0; b.dkT = 0; b.dkN = 0;
  b.wellImm = 1.0;                   // 出场点紧邻军衔环，短暂免疫井口避免刚落就被吞
  b.zg = {x:b.x, y:b.y, t:0, n:0}; b.hiT = 0;
  sfx.fuel();
}

function stepUpperDeck(b, dt){
  /* 甲板滞留寿命：球沿边界+导流墙绕圈（速度高于防卡死阈值）时，8s 后强制送出隧道。
     B 方案收敛的一部分：上层不做"第二个主战场"，球在甲板停留太久会让玩家觉得
     台面被切成两层、节奏断掉；缩短滞留让甲板回到"过路 + 打靶"的定位。 */
  b.dkLife = (b.dkLife || 0) + dt;
  if (b.dkLife > 8){
    b.dkLife = 0;
    dropFromDeck(b);
    return;
  }
  b.vy += GRAV * dt;
  const drag = 1 - 0.10 * dt;
  b.vx *= drag; b.vy *= drag;
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  // 甲板外缘墙：原版式不规则多边形轮廓，逐边约束把球限制在平台内。
  // 只在球越界（跑到某边外侧）时才夹回，弹性反弹，洞底那条边跳过好让球落洞。
  const poly = DECK2.poly;
  for (let i = 0; i < poly.length; i++){
    if (i === DECK2.holeEdge) continue;               // 洞底开口：不放墙
    const a = poly[i], c = poly[(i + 1) % poly.length];
    resolveSeg(b, a.x, a.y, c.x, c.y, 3, 0.42);
  }

  // ③ 物理隔断墙：只在分流区高度内生效，把球约束在 3 条通道之一（原版物理隔断）
  for (let i = 0; i < DECK2.dividers.length; i++){
    const dv = DECK2.dividers[i];
    resolveSeg(b, dv.ax, dv.ay, dv.bx, dv.by, 3, 0.35);
  }

  // ⑤ 归拢墙：碰撞区下缘的斜墙，把 3 条路径收拢到中央洞口（保证必落洞）
  for (let i = 0; i < DECK2.funnels.length; i++){
    const fw = DECK2.funnels[i];
    resolveSeg(b, fw.ax, fw.ay, fw.bx, fw.by, 4, 0.4);
  }

  // 出口洞：滚进洞口 → 落回一层（带高度渐变动画）
  if (b.y > DECK2.hole.y - 6 && b.x > DECK2.hole.x0 && b.x < DECK2.hole.x1){
    dropFromDeck(b); return;
  }
  if (b.y > DECK2.hole.y + 12){ dropFromDeck(b); return; }   // 兜底：任何前缘穿出都按落洞处理

  // 甲板上的模块（3 圆盘 / 3 分流通道）——只与二层的球互动
  stepTopModules(b, dt);

  // 甲板防卡死：停住太久先朝洞口踢，再不行直接从洞口放下去
  const spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
  if (spd < 26){ b.dkT = (b.dkT || 0) + dt; } else { b.dkT = 0; }
  if (b.dkT > 1.5){
    b.dkT = 0;
    b.dkN = (b.dkN || 0) + 1;
    if (b.dkN <= 2){
      // 朝下缘分流带踢（而非朝上），让慢速球也能落到通道/出口
      b.vx = (DECK2.cx - b.x) * 1.6 + (Math.random() - 0.5) * 80;
      b.vy = 190;
      state.shake = 5;
    } else {
      b.dkN = 0;
      b.x = DECK2.cx; b.y = DECK2.hole.y - 4;
      dropFromDeck(b);
    }
  }
}

function stepBall(b, dt){
  // 坡道上行中：球可见，沿坡道中心线滑行（高度从台面升到二层），从交付口落到平台。
  if (b.rampT !== undefined){
    /* 坡道动力学：初速由进桥时的动能决定，爬坡时被重力持续减速。
       —— 这是原版的规则：坡道不是传送带，动能不够的球会失速并**滚回**坡道口，
          只有冲得上去的球才进二层。 */
    const G_RAMP = 0.80;                 // 沿槽的减速度
    if (b.rampV === undefined) b.rampV = 1.2;
    b.rampV -= G_RAMP * dt;
    b.rampT += b.rampV * dt;
    if (b.rampT < 0){
      // 退回坡道口：滚出来，恢复成一层球，给一点向下的速度继续往下掉
      b.rampT = undefined; b.rampZ = 0; b.rampV = undefined;
      b.x = RAMP.x; b.y = RAMP.y + 4;
      b.vx = (Math.random() - 0.5) * 70;
      b.vy = 150;
      b.stuck = 0; b.tries = 0;
      b.zg = {x:b.x, y:b.y, t:0, n:0};
      RAMP.cd = 0.7;                     // 短暂冷却，避免立刻又被吸进去
      popText(b.x, b.y - 26, '动能不足', 'rgba(160,190,235,.95)');
      sfx.select();
      return;
    }
    const t = Math.min(1, b.rampT);
    // 沿折线路径按累计长度插值
    const path = RAMP.path;
    let seg = 0, acc = 0, total = 0;
    const seglen = [];
    for (let i = 0; i < path.length - 1; i++){
      const l = Math.hypot(path[i+1].x - path[i].x, path[i+1].y - path[i].y);
      seglen.push(l); total += l;
    }
    const target = t * total;
    for (let i = 0; i < seglen.length; i++){
      if (acc + seglen[i] >= target || i === seglen.length - 1){
        const lt = seglen[i] > 0 ? (target - acc) / seglen[i] : 0;
        b.x = path[i].x + (path[i+1].x - path[i].x) * lt;
        b.y = path[i].y + (path[i+1].y - path[i].y) * lt;
        break;
      }
      acc += seglen[i];
    }
    b.rampZ = rampH(t);                   // 高度渐变：与坡道桥面同曲线，球贴在槽内
    b.trail.length = 0;
    if (t >= 1){
      b.rampT = undefined; b.rampZ = 0; b.rampV = undefined;
      /* 原版唯一的接任务入口：冲上坡道 = 接受任务。
         先在任务靶上选好槽位（state.selected），这一杆才算数。 */
      if (!state.mission && state.selected >= 0){
        const accSlot = state.selected;
        if (startMission(accSlot)){
          const def = missionSlots()[accSlot];
          state.banner = {t:2.0, text:'任务已接受', sub:(def ? def.zh : '') + ' · 按屏幕提示推进'};
          burst(b.x, b.y, C.gold, 20, 280);
        }
      }
      b.deck = 'upper';
      b.x = RAMP.tx; b.y = RAMP.ty;
      // 交付后向下落入过渡区（①→②）：轻微横向散开，靠重力开始下落流程
      b.vx = (Math.random() - 0.5) * 90; b.vy = 60;
      b.trail.length = 0; b.stuck = 0; b.tries = 0; b.dkT = 0; b.dkN = 0; b.dkLife = 0;
      b.zg = {x:b.x, y:b.y, t:0, n:0};
      burst(b.x, b.y, C.cyan, 14, 240);
      sfx.fuel();
    }
    return;
  }

  // 引力井蓄能中：不可见，蓄满后从井口向上弹出并抬倍率（原版 GravityWellKickOut）
  if (b.wellT !== undefined){
    b.wellT -= dt;
    if (b.wellT <= 0){
      b.wellT = undefined; b.hidden = false;
      b.x = WELL.x; b.y = WELL.y - 18;
      b.vx = (Math.random() - 0.5) * 90;
      b.vy = -(520 + state.rankLights * 60);
      b.dropAnim = 0.16;
      b.trail.length = 0; b.stuck = 0; b.tries = 0;
      b.zg = {x:b.x, y:b.y, t:0, n:0}; b.hiT = 0;
      b.wellImm = 1.5; b.wormImm = Math.max(b.wormImm || 0, 0.8);
      state.mult = Math.min(9, state.mult + 1);   // ControlEnableMultiplier：弹射抬倍率
      const gain = b.wellGain || 2500;
      addScore(gain, WELL.x, WELL.y - 34, C.orange);
      popText(WELL.x, WELL.y - 56, 'WELL +' + gain + ' ×' + state.mult, C.orange);
      WELL.pop = 1;
      burst(WELL.x, WELL.y, C.orange, 14, 240);
      state.shake = 5;
      sfx.multi();
    }
    return;
  }

  // swallowed by the black hole: held for a beat, then thrown back onto the table
  if (b.bhT !== undefined){
    b.bhT -= dt;
    if (b.bhT <= 0){
      b.bhT = undefined; b.hidden = false; b.bhCd = 1.2;
      b.x = BLACKHOLE.x + (Math.random() - 0.5) * 12;
      b.y = BLACKHOLE.y - BLACKHOLE.r - b.r - 4;
      b.vx = (Math.random() - 0.5) * 280;
      b.vy = -(600 + Math.random() * 140);
      b.trail.length = 0; b.stuck = 0; b.tries = 0;
      b.zg = {x:b.x, y:b.y, t:0, n:0}; b.hiT = 0;
      burst(BLACKHOLE.x, BLACKHOLE.y, '#b79cff', 26, 340);
      popText(BLACKHOLE.x, BLACKHOLE.y - 40, '奇点弹射', '#c9b6ff');
      sfx.star();
      state.shake = 7;
    }
    return;
  }

  // swallowed by a wormhole: hidden for a couple of seconds, then spat out of one of
  // the OTHER chutes (the original's wormhole behaviour)
  if (b.wormT !== undefined){
    b.wormT -= dt;
    if (b.wormT <= 0){
      let j = b.wormOut;
      while (j === b.wormOut) j = (Math.random() * WORMS.length) | 0;
      const w = WORMS[j];
      state.wormCd[j] = 1.6;
      // 两个洞口之间的连线，让「从另一个虫洞随机弹出」这件事在画面上被看见
      state.warpLink = {a:b.wormOut, b:j, t:0.9};
      b.x = w.x; b.y = w.y - 2;
      const dir = (w.x < 240) ? 1 : (w.x > 240 ? -1 : (Math.random() < 0.5 ? -1 : 1));
      b.vx = dir * (190 + Math.random() * 160);
      b.vy = -(520 + Math.random() * 220);
      b.wormT = undefined; b.hidden = false;
      b.wormImm = 1.6;                 // brief immunity so it cannot chain-swallow
      b.trail.length = 0; b.stuck = 0; b.tries = 0;
      b.zg = {x:b.x, y:b.y, t:0, n:0}; b.hiT = 0;
      w.pop = 1;
      burst(w.x, w.y, w.c, 18, 280);
      popText(w.x, w.y - 32, 'WARP OUT', w.c);
      sfx.worm();
      state.shake = 5;
    }
    return;
  }

  b.trail.push({x:b.x, y:b.y});
  if (b.trail.length > 14) b.trail.shift();

  // 二层甲板：独立物理面——只与甲板边界/圆盘/分流通道互动，与一层完全隔离
  if (b.deck === 'upper'){
    stepUpperDeck(b, dt);
    return;
  }

  // 刚从二层出口落下的球：高度渐变动画计时
  if (b.dropAnim > 0) b.dropAnim = Math.max(0, b.dropAnim - dt);
  if (b.railSparkT > 0) b.railSparkT = Math.max(0, b.railSparkT - dt);
  if (b.hatchDrop > 0) b.hatchDrop = Math.max(0, b.hatchDrop - dt);

  b.vy += GRAV * dt;
  const drag = 1 - 0.10 * dt;
  b.vx *= drag; b.vy *= drag;
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  for (let iter = 0; iter < 2; iter++){
    for (let i = 0; i < WALLS.length; i++){
      const w = WALLS[i];
      resolveSeg(b, w.ax, w.ay, w.bx, w.by, w.r, w.e);
    }
    // outlane hatches: solid only while closed; an open hatch lets the ball fall out
    // —— 而打开时档杆（rail）升起来，把整条通道的球都导进闸口
    for (let i = 0; i < OUTGATES.length; i++){
      const og = OUTGATES[i];
      if (!og.open) resolveSeg(b, og.ax, og.ay, og.bx, og.by, 6, 0.45);
      else if (og.bar){
        // e=0.02：紫色挡板是导流板，不是弹簧——球不会被打回场地，
        // 只会顺着板面滑向闸口角，然后坠入红色区域
        const rh = resolveSeg(b, og.bar.ax, og.bar.ay, og.bar.bx, og.bar.by, 6, 0.02);
        if (rh && !(b.railSparkT > 0)){
          b.railSparkT = 0.25;
          burst(rh.px, rh.py, '#b98cff', 4, 120);
        }
      }
    }
    // 闸口是「洞」不是斜坡：档杆开着时球心一旦压到闸口线，直接判坠出——
    // 高速球也不可能压着缺口弹过去（兜底，正常情况下漏斗档杆已经把球送进洞）
    for (let i = 0; i < OUTGATES.length; i++){
      const og = OUTGATES[i];
      if (!og.open) continue;
      const hx = og.bx - og.ax, hy = og.by - og.ay;
      const L2h = hx * hx + hy * hy || 1;
      let t = ((b.x - og.ax) * hx + (b.y - og.ay) * hy) / L2h;
      t = t < 0 ? 0 : (t > 1 ? 1 : t);
      const px = og.ax + hx * t, py = og.ay + hy * t;
      const ddx = b.x - px, ddy = b.y - py;
      // 本帧位移段是否穿过闸口线（快球一帧能走 20+px，只靠邻近半径会漏）
      const pv = b.trail.length ? b.trail[b.trail.length - 1] : {x:b.x, y:b.y};
      // trip-line 兜底：位移段只要穿过闸口线**或紫色挡板线**，一律判坠——
      // 高速球压着缺口/挡板飞过去在帧间是不存在的
      const crossed = segCross(pv.x, pv.y, b.x, b.y, og.ax, og.ay, og.bx, og.by)
                   || (og.catch && segCross(pv.x, pv.y, b.x, b.y, og.catch.ax, og.catch.ay, og.catch.bx, og.catch.by));
      if (crossed || (ddx * ddx + ddy * ddy < (b.r - 2) * (b.r - 2))){
        if (b.hatchDrop > 0) break;              // 已经掉下去了，别重复钉回洞口
        b.hatchDrop = 0.5;
        b.x = px; b.y = py + 8;
        b.vx *= 0.1; b.vy = Math.max(b.vy, 300);
        break;
      }
    }
    for (let i = 0; i < SLINGS.length; i++){
      const s = SLINGS[i];
      const hit = resolveSeg(b, s.x1, s.y1, s.x2, s.y2, s.r, 0.62);
      if (hit && iter === 0){
        s.pop = 1;
        b.vx += hit.nx * 350;
        b.vy += hit.ny * 350;
        jitter(b, 0.34);
        addScore(30, hit.px, hit.py, C.violet);
        burst(hit.px, hit.py, C.violet, 9, 250);
        state.shake = 4;
        sfx.sling();
        missionProgress('s' + i, 1);
      }
    }
    for (let i = 0; i < BUMPERS.length; i++){
      const bp = BUMPERS[i];
      const hit = resolveCirc(b, bp.x, bp.y, bp.r, 0.5);
      if (hit && iter === 0){
        bp.pop = 1;
        b.vx += hit.nx * 250;
        b.vy += hit.ny * 250;
        jitter(b, 0.40);
        addScore(BUMPER_LV_PTS[state.bumperLv] * (state.bumpersHot ? 2 : 1), bp.x, bp.y - bp.r - 8, bp.c);
        bp.hits++;
        if (bp.hits % BUMPER_HITS_PER_STAR === 0) lightStar(i);
        burst(hit.px, hit.py, bp.c, 12, 300);
        state.shake = 6;
        sfx.bumper(i);
        missionProgress('b' + i, 1);
      }
    }
    for (let i = 0; i < POSTS.length; i++){
      const tg = POSTS[i];
      const hit = resolveCirc(b, tg.x, tg.y, tg.r, 0.62);
      if (hit && iter === 0){
        tg.pop = 1;
        b.vx += hit.nx * 170;
        b.vy += hit.ny * 170;
        addScore(60, tg.x, tg.y - tg.r - 8, tg.c);
        burst(hit.px, hit.py, tg.c, 7, 190);
        sfx.sling();
        missionProgress('p' + i, 1);
      }
    }
    // ---- 接任务区: the mission dock is a solid module. Bumping it is the only way
    // to take a mission, which turns "accept a mission" into a shot you can aim.
    if (state.dockCd <= 0){
      if (resolveCirc(b, DOCK.x, DOCK.y, DOCK.r, 0.55)) dockHit(b);
    } else {
      resolveCirc(b, DOCK.x, DOCK.y, DOCK.r, 0.55);
    }
    for (let pi = 0; pi < DOCK_POSTS.length; pi++){
      const dp = DOCK_POSTS[pi];
      if (resolveCirc(b, dp.x, dp.y, dp.r, 0.45)){
        dp.pop = 1;
        addScore(50, dp.x, dp.y - 16, C.cyan);
      }
    }
    for (let i = 0; i < MISSION_TARGETS.length; i++){
      const mt = MISSION_TARGETS[i];
      if (mt.cd > 0) continue;
      const ddx = b.x - mt.x, ddy = b.y - mt.y;
      if (ddx * ddx + ddy * ddy < 20 * 20){
        mt.cd = 1.0;
        mt.pop = 1;
        addScore(100, mt.x, mt.y + 22, mt.c);
        burst(b.x, b.y, mt.c, 10, 200);
        sfx.select();
        selectMission(mt.slot);
      }
    }
    /* ---- 原版补全区 ---- */
    /* 落靶：三段衬板外缘上的靶条。
       只有靶有碰撞、衬板本体不碰撞——衬板凸出才 20 多像素，
       给本体加墙会把右侧走廊挤成一条缝；靶是球"该打的东西"，撞了就该弹开。 */
    for (let i = 0; i < DROP_BANK.t.length; i++){
      if (DROP_BANK.down[i]) continue;
      const dtg = DROP_BANK.t[i];
      if (resolveCirc(b, dtg.x, dtg.y, 8, 0.42)) hitDropTarget(i);
    }
    // 中央挡柱：只在升起时是实体
    /* 挡柱碰撞用**整条线段**，不能用单个圆：
       柱子升起 36px、宽 15px，一个半径 9 的圆只盖住中段，球会从柱顶穿过去。
       线段从柱顶（孔口上方 36）一直连到孔口，半径 7.5 = 柱身半宽。 */
    if (CENTER_POST.up > 0.05){
      resolveSeg(b, CENTER_POST.x, CENTER_POST.y + 2 - 36 * CENTER_POST.up,
                 CENTER_POST.x, CENTER_POST.y + 2, 7.5, 0.45);
    }
    // 危险带：纯传感器，滚过即点亮
    for (let k = 0; k < HAZARDS.length; k++){
      const hz = HAZARDS[k];
      for (let i = 0; i < 3; i++){
        if (hz.lit[i]) continue;
        const dx = b.x - hz.x[i], dy = b.y - hz.y[i];
        if (dx * dx + dy * dy < 15 * 15) hitHazard(hz.side, i);
      }
    }
    // 超空间：环道顶点的 rollover
    if (HYPER.cd <= 0){
      const hx = b.x - HYPER.x, hy = b.y - HYPER.y;
      if (hx * hx + hy * hy < HYPER.r * HYPER.r) hitHyper();
    }

    flipperCollide(b, leftF);
    flipperCollide(b, rightF);

    // pivot posts (also rounds the concave corner that used to trap the ball)
    for (let i = 0; i < PIVOTS.length; i++){
      const pv = PIVOTS[i];
      resolveCirc(b, pv.x, pv.y, pv.r, 0.35);
    }

    // 发射口闸门: open only while a ball is inside the launch lane (deploy / launch)
    // or climbing out through the mouth; at any other time the hatch is a SOLID
    // barrier — once the ball is out, the launch bay is physically off-limits
    const hatchExempt = (b.x > 412 && b.y > 380) ||           // inside the lane
                         (b.x > 412 && b.vy < 0 && b.y > 330); // climbing out
    if (!state.hatchOpen && !hatchExempt){
      resolveSeg(b, GATE.ax, GATE.ay, GATE.bx, GATE.by, 5, 0.55);
    }
  }

  // 原版坡道入口：左侧上行球滚进坡道口 → 沿可见坡道上二层（不再是隐藏瞬移）。
  // 慢速球与下落球不受影响——这是一记需要蓄力的"上撩"。
  if (RAMP.cd <= 0 && !b.hidden && b.rampT === undefined &&
      b.x > RAMP.sx0 && b.x < RAMP.sx1 && b.y > RAMP.sy0 && b.y < RAMP.sy1 && b.vy < RAMP.enterVy){
    RAMP.cd = 2.0;
    b.rampT = 0;                       // 可见滑行，从坡道口开始
    /* 进桥动能：把撞击速度换算成沿槽的初速。
       原版坡道不是"进门就必到二层"——动能不够的球会在半路失速、自己滚回来。
       标定：|vy| 约 531px/s 以上才能冲上二层，刚过门槛的球会滑到一半退回。 */
    b.rampV = Math.max(0.30, Math.min(2.00, Math.abs(b.vy) / 420));
    b.vx = 0; b.vy = 0; b.trail.length = 0;
    addScore(2000, RAMP.x, RAMP.y - 22, C.cyan);
    popText(RAMP.x, RAMP.y - 44, 'RAMP +2000', C.cyan);
    burst(RAMP.x, RAMP.y, C.cyan, 12, 220);
    state.banner = {t:1.2, text:'坡道上行', sub:'沿导轨直上二层平台'};
    sfx.launch();
  }

  // 黑洞引力: bends the trajectory of any ball crossing the ring, swallows the ones
  // that fall in. Only online while open (i.e. after a mission was completed).
  blackHolePull(b, dt);

  const sp = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
  if (sp > MAXSPD){ b.vx = b.vx / sp * MAXSPD; b.vy = b.vy / sp * MAXSPD; }

  // wormholes: swallow the ball, hold it in the chute, then spit it out of one of the
  // OTHER chutes a couple of seconds later (the original's wormhole behaviour)
  if (!b.wormImm || b.wormImm <= 0){
  for (let i = 0; i < WORMS.length; i++){
    const w = WORMS[i];
    if (state.wormCd[i] > 0) continue;
    const dx = b.x - w.x, dy = b.y - w.y;
    const spd2 = b.vx*b.vx + b.vy*b.vy;
    // a chute swallows a ball that drops in or rolls over it; a fast ball (full plunge,
    // bumper blast) skips across the opening, so warps stay a choice not a tax
    if (dx*dx + dy*dy < (w.r * 0.6) * (w.r * 0.6) && spd2 < 620*620){
      state.wormCd[i] = 1.5;
      enterWorm(i);
      b.wormT = 1.6 + Math.random() * 1.2;
      b.wormOut = i;
      b.hidden = true;
      b.vx = 0; b.vy = 0;
      b.trail.length = 0;
      popText(w.x, w.y - 30, 'WARP IN', w.c);
      break;
    }
  }
  }
  if (b.wormImm > 0) b.wormImm -= dt;

  // 旗标旋转器：球撞叶打转（原版 TFlagSpinner）——撞得越狠转得越快、分越高
  for (let fi = 0; fi < FLAGS.length; fi++){
    const f = FLAGS[fi];
    if (f.cd > 0) f.cd -= dt;
    if (f.litT > 0){ f.litT -= dt; if (f.litT <= 0) f.lit = 0; }
    if (f.v > 0){
      f.a += f.v * dt;
      f.v = Math.max(0, f.v - 7 * dt);      // 叶片阻尼：约 2s 停转
    }
    if (f.cd <= 0 && b.deck === 'lower' && !b.hidden){
      const fdx = b.x - f.x, fdy = b.y - f.y;
      const fsp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (fdx * fdx + fdy * fdy < 13 * 13 && fsp > 120){
        f.cd = 0.45;
        f.v = Math.min(16, 5 + fsp * 0.012);   // rad/s：随球速提升
        f.lit = 1; f.litT = 12;
        addScore(fsp > 420 ? 2500 : 500, f.x, f.y - 20, C.cyan);
        burst(f.x, f.y, C.cyan, 6, 140);
        sfx.fuel();
        if (FLAGS[0].lit && FLAGS[1].lit && !(state.flagCd > 0)){
          state.flagCd = 8;
          FLAGS.forEach(function(g){ g.lit = 0; g.litT = 0; });
          addScore(5000, (FLAGS[0].x + FLAGS[1].x) / 2, FLAGS[0].y - 36, C.gold);
          popText(f.x, f.y - 44, 'FLAG COMBO +5000', C.gold);
          sfx.star();
        }
      }
    }
  }
  if (state.flagCd > 0) state.flagCd -= dt;

  // 引力井：军衔灯环中央的洞。慢速球压到井口被吞入蓄能；快球掠过不受影响
  if (WELL.cd > 0) WELL.cd -= dt;
  if (WELL.pop > 0) WELL.pop -= dt;
  if (WELL.hold > 0) WELL.hold -= dt;
  if (b.deck === 'lower' && !b.hidden && WELL.cd <= 0 && (!b.wellImm || b.wellImm <= 0)){
    const wdx = b.x - WELL.x, wdy = b.y - WELL.y;
    const wsp2 = b.vx * b.vx + b.vy * b.vy;
    if (wdx * wdx + wdy * wdy < (WELL.r * 0.55) * (WELL.r * 0.55) && wsp2 < 380 * 380){
      WELL.cd = 2.4; WELL.hold = 0.85;
      b.hidden = true; b.vx = 0; b.vy = 0; b.trail.length = 0;
      b.wellT = 0.85;
      b.wellGain = 2500 + state.rank * 1000 + state.rankLights * 500;
      popText(WELL.x, WELL.y - 26, 'GRAVITY WELL', C.orange);
      sfx.worm();
      burst(WELL.x, WELL.y, C.orange, 8, 160);
    }
  }
  if (b.wellImm > 0) b.wellImm -= dt;

  // SKILL SHOT: six arch lights in the chute. A soft plunge that falls back onto the
  // 1st..6th light pays 15k/30k/75k/30k/15k/7.5k like the original; a full-power launch
  // flies past all lights into the table and scores nothing here.
  if (state.skill && b.deck === 'lower'){
    if (b.x > 412 && b.vy < 0) state.plungeMin = Math.min(state.plungeMin, b.y);
    if (b.x > 412 && b.vy > 0 && state.skillTier === 0 && state.plungeMin < 9000){
      const a = state.plungeMin;
      // six arch lights at y 704/658/612/566/520/474; the deepest light the plunge
      // reached pays 15k/30k/75k/30k/15k/7.5k like the original
      const pts = a <= 474 ? 7500 : a <= 520 ? 15000 : a <= 566 ? 30000
                : a <= 612 ? 75000 : a <= 658 ? 30000 : a <= 704 ? 15000 : 0;
      if (pts > 0){
        state.skillTier = 1;
        addScore(pts, b.x, b.y - 20, C.gold);
        if (pts === 75000){
          state.banner = {t:1.6, text:'PERFECT SKILL SHOT', sub:'+75000'};
          grantTitle('skill75');
          state.shake = 8;
        } else {
          popText(b.x, b.y - 38, 'SKILL SHOT +' + pts, C.gold);
        }
        state.flash = 0.5;
        sfx.fuel();
      }
      state.skill = false;
    }
    // the window only closes early if the ball somehow leaves the chute into the table
    if (b.x < 410 && b.y > 300){ state.skill = false; }
  }

  // three rollover lamps: passing over one lights it; all three light the bumpers.
  // Detection is proximity to the lamp position with a generous radius, so a fast ball
  // cannot slip past between frames.
  for (let i = 0; i < 3; i++){
    if (state.laneCdArr[i] > 0) state.laneCdArr[i] = Math.max(0, state.laneCdArr[i] - dt);
  }
  for (let i = 0; i < 3; i++){
    const L = LANE_LAMPS[i];
    const ldx = b.x - L.x, ldy = b.y - L.y;
    if (ldx * ldx + ldy * ldy < 30 * 30) hitLane(i);
  }

  // "lane" stage (time warp) completes at the ramp entrance (full-power plunge),
  // fired where the ramp is entered so a weak lob cannot finish it.

  // 接任务不再是「球飞到上半场就自动开始」的隐形规则——它现在是一个真实目标：
  // 顶部接任务模组 DOCK。撞到它才会 startMission（见 dockHit 与碰撞层）。

  // fuel rollovers inside the lane (lower deck only; the ramp ride refuels on entry)
  if (b.deck === 'lower' && b.x > 412 && b.vy < 0 && b.y > 380 && b.y < 730){
    if (state.mission && state.mission.fuel < FUEL_N){
      state.mission.fuel = FUEL_N;
      sfx.fuel();
      burst(434, b.y, C.green, 6, 140);
    }
  }

  // repeated-traversal guard: if the ball keeps crossing the same band without ever
// descending, break the cycle. Catches endless loops that are stable but not static
// (the anti-stuck check below only fires on a motionless ball).
  if (state.mode === 'play'){
    if (b.y < 260){
      b.hiT = (b.hiT || 0) + dt;
      if (b.hiT > 4.5){
        b.hiT = 0;
        b.vy = Math.abs(b.vy) * 0.5 + 260;   // push it down and outward
        b.vx += (b.x < 240 ? 1 : -1) * 120;
        jitter(b, 0.5);
        state.shake = 5;
      }
    } else {
      b.hiT = 0;
    }
  }

  // ZONE GUARD. The wedge that trapped the ball at the flipper pivot kept jittering in
// place, so a speed-based test never fired: it was moving, just not going anywhere.
// This tracks how long the ball stays inside a small box. Originally it only guarded
// y>600, which left the whole mid-table band (260..600, including the RE-ENTRY pocket
// by the drop hole) unguarded — a ball wedged there with 30..120 speed sat forever
// between the two rescue systems. Now it covers every band below the dome.
if (state.mode === 'play' && b.deck === 'lower' && b.y > 260){
    if (!b.zg){ b.zg = {x:b.x, y:b.y, t:0, n:0}; }
    const g = b.zg;
    const moved = Math.abs(b.x - g.x) + Math.abs(b.y - g.y);
    if (moved > 44){
      g.x = b.x; g.y = b.y; g.t = 0;
    } else {
      g.t += dt;
      if (g.t > 3.2){
        g.t = 0;
        g.n++;
        if (g.n <= 2){
          // shove it up and toward the middle of the table
          b.vx = (240 - b.x) * 3 + (Math.random() - 0.5) * 90;
          b.vy = -(600 + g.n * 130);
          g.x = b.x; g.y = b.y;      // re-anchor, or a permanent wedge re-triggers forever
          state.shake = 6;
        } else {
          b.x = 240; b.y = 470; b.vx = 0; b.vy = -300;
          g.n = 0; g.x = 240; g.y = 470;
          burst(240, 470, C.cyan, 12, 220);
          popText(240, 372, '教官救援', C.cyan);
        }
      }
    }
  } else if (b.zg){
    b.zg.t = 0; b.zg.n = 0;
  }

  // anti-stuck, escalating. `tries` must NOT reset merely because a shove briefly made
  // the ball fast: if the ball comes back and re-wedges near the last rescue point the
  // counter survives, so the teleport escape still fires instead of looping forever.
  const inLane = (b.x > 418 && b.y > 310);
  const nearlyStill = (sp < 30 && Math.abs(b.vx) < 26 && Math.abs(b.vy) < 26);
  if (state.mode === 'play' && b.deck === 'lower' && !inLane && nearlyStill && b.y < 736){
    b.stuck += dt;
    if (b.stuck > 1.6){
      b.stuck = 0;
      b.tries = (b.tries || 0) + 1;
      b.lastRescue = {x:b.x, y:b.y};
      if (b.tries <= 2){
        const dirX = (b.x < 240) ? 1 : -1;
        b.vx = dirX * (280 + b.tries * 90);
        b.vy = -(520 + b.tries * 120);
        state.shake = 6;
      } else {
        b.x = 240; b.y = 470;
        b.vx = (Math.random() - 0.5) * 120;
        b.vy = -260;
        b.tries = 0;
        b.lastRescue = {x:240, y:470};
        state.shake = 9;
        burst(240, 470, C.cyan, 14, 240);
        popText(240, 372, '教官救援', C.cyan);
      }
    }
  } else {
    b.stuck = 0;
    if (sp > 120 && (!b.lastRescue ||
        Math.abs(b.x - b.lastRescue.x) + Math.abs(b.y - b.lastRescue.y) > 110)){
      b.tries = 0;
    }
  }
}

/* ---------------------------- update ---------------------------- */
/* ---------------------------- pseudo-3D camera ---------------------------- */
/* The table has depth now: the camera pans a few px toward the active ball, and every
   decorative layer shifts at its own rate (parallax). Gameplay geometry stays put so
   touch targets never drift — only the backdrop and the floor art move. */
const CAM = {x:0, y:0};
function updateCamera(dt){
  let tx = 0, ty = 400, n = 0;
  for (let i = 0; i < balls.length; i++){
    const bb = balls[i];
    if (bb.hidden) continue;
    tx += bb.x; ty += bb.y; n++;
  }
  if (n > 0){ tx /= n; ty /= n; }
  const k = Math.min(1, dt * 2.5);
  CAM.x += ((tx - 240) * 0.06 - CAM.x) * k;
  CAM.y += ((ty - 400) * 0.05 - CAM.y) * k;
}

/* the active ball doubles as the table's moving lamp: nearby elements glow brighter */
function ballLight(x, y){
  let best = 0;
  for (let i = 0; i < balls.length; i++){
    const bb = balls[i];
    if (bb.hidden) continue;
    const dx = bb.x - x, dy = bb.y - y;
    const d2 = dx * dx + dy * dy;
    if (d2 < 240 * 240){
      const v = 1 - Math.sqrt(d2) / 240;
      if (v > best) best = v;
    }
  }
  return best;
}

function update(dt){
  state.time += dt;
  updateMeteors(dt);
  updateCamera(dt);
  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 40);
  if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 2.2);
  if (state.banner){ state.banner.t -= dt; if (state.banner.t <= 0) state.banner = null; }
  if (state.tilt > 0) state.tilt = Math.max(0, state.tilt - dt);
  state.nudge = Math.max(0, state.nudge - dt * 0.55);
  // 摇台热量与警告：热量自然回落，连摇才危险（原版双阈值倾斜）
  if (state.nudgeHeat > 0) state.nudgeHeat = Math.max(0, state.nudgeHeat - dt * 0.30);
  if (state.tiltWarn > 0) state.tiltWarn = Math.max(0, state.tiltWarn - dt);
  if (state.reflexT > 0){
    state.reflexT = Math.max(0, state.reflexT - dt);
    if (state.reflexT === 0) state.reflexUsed = false;
  }
  if (state.hyperT > 0) state.hyperT = Math.max(0, state.hyperT - dt);

  // 中央挡柱升降
  if (CENTER_POST.t > 0){
    CENTER_POST.t = Math.max(0, CENTER_POST.t - dt);
    CENTER_POST.up = Math.min(1, CENTER_POST.up + dt * 5);
  } else if (CENTER_POST.up > 0){
    CENTER_POST.up = Math.max(0, CENTER_POST.up - dt * 4);
  }
  // 落靶复位
  if (DROP_BANK.cd > 0) DROP_BANK.cd = Math.max(0, DROP_BANK.cd - dt);
  if (DROP_BANK.resetT > 0){
    DROP_BANK.resetT -= dt;
    if (DROP_BANK.resetT <= 0){
      DROP_BANK.down = [false, false, false];
      DROP_BANK.resetT = 0;
      state.banner = {t:1.2, text:'靶架复位', sub:'3 枚落靶重新立起'};
      sfx.select();
    }
  }
  for (let i = 0; i < 3; i++) DROP_BANK.pop[i] *= Math.pow(0.02, dt);
  for (let k = 0; k < HAZARDS.length; k++)
    for (let i = 0; i < 3; i++) HAZARDS[k].pop[i] *= Math.pow(0.02, dt);
  if (HYPER.cd > 0) HYPER.cd = Math.max(0, HYPER.cd - dt);
  HYPER.pop *= Math.pow(0.02, dt);
  for (let i = 0; i < WORMS.length; i++) state.wormCd[i] = Math.max(0, state.wormCd[i] - dt);

  // plunger charge builds while held (space / touch)
  if (state.charging && state.mode === 'ready'){
    state.charge = Math.min(1, state.charge + dt / 1.15);
    state.deployZone = deployBandOf(state.charge).id;
  }
  // 撞杆击打动画：松手后 ~0.05s 猛冲，再用 0.13s 被弹簧拉回待发位
  if (state.plungeStrike >= 0){
    state.plungeStrike += dt;
    if (state.plungeStrike > 0.18) state.plungeStrike = -1;
  }

  // ---- 区域化玩法的计时器 ----
  if (RAMP.cd > 0) RAMP.cd = Math.max(0, RAMP.cd - dt);
  if (state.dockCd > 0) state.dockCd = Math.max(0, state.dockCd - dt);
  if (state.vukCd > 0) state.vukCd = Math.max(0, state.vukCd - dt);
  if (state.bhOpen > 0){
    state.bhOpen = Math.max(0, state.bhOpen - dt);
    if (state.bhOpen === 0) state.banner = {t:1.4, text:'黑洞闭合', sub:'完成任务可再次开启'};
  }
  DOCK.pop *= Math.pow(0.02, dt);
  DOCK.spin *= Math.pow(0.05, dt);
  for (let i = 0; i < DOCK_POSTS.length; i++) DOCK_POSTS[i].pop *= Math.pow(0.02, dt);
  if (DOCK.spin < 0.001) DOCK.spin = 0;
  BLACKHOLE.pop *= Math.pow(0.02, dt);
  BLACKHOLE.pull *= Math.pow(0.02, dt);
  // 遮挡淡出：球钻到甲板下方时顶面自动半透明，球始终可追踪
  DECK3D.fade += ((deckHasBallUnder() ? 0.42 : 1) - DECK3D.fade) * Math.min(1, dt * 8);
  for (let i = 0; i < MISSION_LAMPS.length; i++) MISSION_LAMPS[i].pop *= Math.pow(0.05, dt);
  if (state.warpLink){
    state.warpLink.t -= dt;
    if (state.warpLink.t <= 0) state.warpLink = null;
  }
  if (state.warpChainT > 0){
    state.warpChainT -= dt;
    if (state.warpChainT <= 0){ state.warpChainT = 0; state.warpChain = 0; }
  }
  if (state.screen === 'play' && state.mode === 'play') rewardTick(dt);

  // combo window decays; running out drops the stack (not the multiplier)
  if (state.comboT > 0){
    state.comboT -= dt;
    if (state.comboT <= 0){ state.comboT = 0; state.combo = 0; }
  }

  // timed challenge clock
  if (state.screen === 'play' && state.gameMode === 'daily' && state.timeLeft > 0){
    state.timeLeft = Math.max(0, state.timeLeft - dt);
    if (state.timeLeft <= 0){ endRun(); return; }
  }

  // cadet drill timer (教官紧急指令)
  drillTick(dt);

  // 缓冲器降级计时：约 60 秒没有继续升级就降一级（原版规则）
  if (state.bumperLv > 0 && state.mode === 'play'){
    state.bumperLvT -= dt;
    if (state.bumperLvT <= 0){
      state.bumperLv--;
      state.bumperLvT = 60;
      state.banner = {t:1.2, text:'缓冲器冷却', sub:'降至 LV.' + state.bumperLv};
    }
  }

  // 发射口闸门：只有发射道内部（闸门以下）有球时才敞开，其余时间实体封闭
  state.hatchOpen = balls.some(function(bb){
    return bb.live && !bb.hidden && bb.x > 412 && bb.y > 385;
  });
  // 闸门开合动画：t∈[0,1]，0=横在道口，1=翻起贴墙（原版 one-way gate 的动作）
  const hTarget = state.hatchOpen ? 1 : 0;
  state.hatchT = (state.hatchT || 0) + (hTarget - (state.hatchT || 0)) * Math.min(1, dt * 9);

  // 危险通道 scheduler: every ~20-38s one hatch swings open for 7-11s. Fair play:
  // the warning banner fires the moment it opens, and the hatch glows while live.
  if (state.screen === 'play' && state.mode === 'play'){
    for (let i = 0; i < OUTGATES.length; i++){
      const og = OUTGATES[i];
      if (og.open){
        og.openT -= dt;
        if (og.openT <= 0){
          og.open = false;
          state.banner = {t:1.2, text:'通道锁止', sub:(og.side === 'L' ? '左侧' : '右侧') + '闸门已闭合'};
          sfx.fuel();
        }
      }
    }
    state.gateT -= dt;
    if (state.gateT <= 0){
      state.gateT = 20 + Math.random() * 18;
      const og = OUTGATES[(Math.random() * OUTGATES.length) | 0];
      og.open = true;
      og.openT = 7 + Math.random() * 4;
      state.banner = {t:2.4, text:'⚠ 危险通道开启', sub:(og.side === 'L' ? '左侧' : '右侧') + '档杆封道 ' + Math.ceil(og.openT) + ' 秒 · 这一侧的球必落红区'};
      sfx.tilt();
      state.flash = 0.4;
    }
  }

  for (let i = BUMPERS.length - 1; i >= 0; i--) BUMPERS[i].pop *= Math.pow(0.02, dt);
  for (let i = SLINGS.length - 1; i >= 0; i--)  SLINGS[i].pop  *= Math.pow(0.02, dt);
  for (let i = POSTS.length - 1; i >= 0; i--)   POSTS[i].pop   *= Math.pow(0.02, dt);
  for (let i = UPPER_BUNKERS.length - 1; i >= 0; i--){
    UPPER_BUNKERS[i].pop *= Math.pow(0.02, dt);
    if (UPPER_BUNKERS[i].cd > 0) UPPER_BUNKERS[i].cd = Math.max(0, UPPER_BUNKERS[i].cd - dt);
  }
  for (let i = MISSION_TARGETS.length - 1; i >= 0; i--){
    MISSION_TARGETS[i].pop *= Math.pow(0.02, dt);
    if (MISSION_TARGETS[i].cd > 0) MISSION_TARGETS[i].cd = Math.max(0, MISSION_TARGETS[i].cd - dt);
  }
  for (let i = WORMS.length - 1; i >= 0; i--)   WORMS[i].pop    *= Math.pow(0.02, dt);

  for (let i = 0; i < DECK_TARGETS.length; i++) DECK_TARGETS[i].pop *= Math.pow(0.02, dt);
  for (let i = 0; i < DECK_LANES.length; i++) DECK_LANES[i].pop *= Math.pow(0.02, dt);

  // mission fuel: one light out every 5 seconds
  const m = state.mission;
  if (m && state.mode === 'play'){
    m.fuelT += dt;
    if (m.fuelT >= FUEL_SEC){
      m.fuelT = 0;
      m.fuel--;
      if (m.fuel <= 0){ m.fuel = 0; abortMission('燃料耗尽'); }
    }
  }

  // particles
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life -= dt / p.max;
    if (p.life <= 0){ parts.splice(i, 1); continue; }
    p.vy += 420 * dt;
    p.vx *= (1 - 1.6 * dt);
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = pops.length - 1; i >= 0; i--){
    const p = pops[i];
    p.life -= dt * 1.5;
    if (p.life <= 0){ pops.splice(i, 1); continue; }
    p.y += p.vy * dt;
    p.vy *= (1 - 2 * dt);
  }

  leftF.update(dt);
  rightF.update(dt);

  // menus pause the simulation entirely
  if (state.screen === 'menu' || state.screen === 'board') return;
  if (state.mode === 'over') return;

  // physics for every ball
  for (let i = balls.length - 1; i >= 0; i--){
    if (!balls[i].live) { balls.splice(i, 1); continue; }
    // 待发球由撞杆托住：固定在发射槽口，不受重力下落，避免球穿过撞杆帽
    if (state.mode === 'ready'){
      const rb = balls[i];
      rb.x = 434; rb.y = 754; rb.vx = 0; rb.vy = 0;
      continue;
    }
    stepBall(balls[i], dt);
  }

  // drain: remove balls that fell through
  for (let i = balls.length - 1; i >= 0; i--){
    if (balls[i].y > 784){
      burst(balls[i].x, 780, C.red, 10, 180);
      balls.splice(i, 1);
    }
  }
  if (balls.length === 0){
    ballLost();
    return;
  }

  // multiball ends when one ball is left; the jackpot paid out is the one built up
  if (state.multiball){
    if (balls.length <= 1){
      state.multiball = false;
      addScore(state.jackpot, 240, 460, C.gold);
      state.banner = {t:1.6, text:'JACKPOT', sub:'+' + state.jackpot};
      popText(240, 372, 'JACKPOT +' + state.jackpot, C.gold);
      state.jackpot = 25000;
      sfx.rank();
    } else {
      state.jackpot = Math.min(250000, state.jackpot + Math.round(240 * dt * 12));
    }
  }

  // safety: a ball resting in the lane after launch may be re-plunged
  const b0 = balls[0];
  if (state.mode === 'play' && balls.length === 1 && b0.deck === 'lower' &&
      b0.x > 418 && b0.y > 700 &&
      Math.abs(b0.vy) < 30 && Math.abs(b0.vx) < 30){
    state.mode = 'ready';
    b0.vx = 0; b0.vy = 0; b0.x = 434; b0.y = 754;
  }
}

/* ---------------------------- drawing helpers ---------------------------- */
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function starPath(x, y, r, inner){
  ctx.beginPath();
  for (let i = 0; i < 10; i++){
    const rad = (i % 2 === 0) ? r : r * (inner || 0.44);
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const px = x + Math.cos(a) * rad;
    const py = y + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

/* ---------------------------- starfield ---------------------------- */
const STARS = [];
for (let i = 0; i < 170; i++){
  STARS.push({
    x: Math.random() * CW,
    y: Math.random() * CH,
    r: Math.random() * 1.5 + 0.3,
    ph: Math.random() * Math.PI * 2,
    sp: 0.6 + Math.random() * 1.8,
    c: Math.random() < 0.14 ? '#9fd0ff' : (Math.random() < 0.5 ? '#ffffff' : '#c9d8ff')
  });
}

/* shooting stars: purely cosmetic, drift across the backdrop and fade */
const METEORS = [];
let meteorT = 1.8;
function spawnMeteor(){
  const dir = Math.random() < 0.5 ? 1 : -1;
  METEORS.push({
    x: Math.random() * CW,
    y: -30 - Math.random() * CH * 0.3,
    vx: dir * (110 + Math.random() * 240),
    vy: 240 + Math.random() * 320,
    life: 1,
    len: 55 + Math.random() * 95,
    c: Math.random() < 0.5 ? 'rgba(160,220,255,' : 'rgba(255,222,160,'
  });
  if (METEORS.length > 6) METEORS.shift();
}
function updateMeteors(dt){
  meteorT -= dt;
  if (meteorT <= 0){ meteorT = 2.4 + Math.random() * 4.6; spawnMeteor(); }
  for (let i = METEORS.length - 1; i >= 0; i--){
    const mt = METEORS[i];
    mt.x += mt.vx * dt;
    mt.y += mt.vy * dt;
    mt.life -= dt * 0.32;
    if (mt.life <= 0 || mt.y > CH + 60 || mt.x < -120 || mt.x > CW + 120) METEORS.splice(i, 1);
  }
}

/* 背景静态层：底色+三团星云的满屏径向渐变与时间无关，预渲染一次逐帧贴图；
   星星/流星是动画的，仍逐帧画（小圆弧开销可忽略）。满屏渐变逐帧重画是移动端帧率大头。 */
function drawBgGradients(){
  const g = ctx.createRadialGradient(CW * 0.5, CH * 0.16, 10, CW * 0.5, CH * 0.5, CH * 0.85);
  g.addColorStop(0, '#101a3e');
  g.addColorStop(0.45, '#080c22');
  g.addColorStop(1, '#04050d');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CW, CH);

  const neb = [[90, 200, 180, 'rgba(80,110,255,.16)'],
               [400, 380, 210, 'rgba(190,80,220,.13)'],
               [250, 680, 240, 'rgba(40,160,200,.10)']];
  for (let i = 0; i < neb.length; i++){
    const n = neb[i];
    const rg = ctx.createRadialGradient(n[0], n[1], 0, n[0], n[1], n[2]);
    rg.addColorStop(0, n[3]);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, CW, CH);
  }
}
let bgGradCache = null;
function drawBackground(){
  if (window.__PS_VIEW){
    // 小游戏端：逻辑区画一层纯渐变（缓存 blit，一次全屏不透明填充），星点/流星整层跳过。
    // 不做任何整屏缩放贴图 —— 真机上那是撕裂/闪屏的来源。
    if (!bgGradCache) bgGradCache = renderLayerToCache(CW, CH, drawBgGradients);
    if (bgGradCache) blitLayer(bgGradCache, undefined, CH); else drawBgGradients();
    return;
  }
  if (!bgGradCache) bgGradCache = renderLayerToCache(CW, CH, drawBgGradients);
  if (bgGradCache) blitLayer(bgGradCache, undefined, CH); else drawBgGradients();
  for (let i = 0; i < STARS.length; i++){
    const s = STARS[i];
    const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(state.time * s.sp + s.ph));
    // parallax: bigger (nearer) stars drift down a touch faster, wrapping at the edge;
    // the pseudo-3D camera also pans them by depth so the field reads as layered
    let sy = (s.y + state.time * 3.4 * s.r) % CH;
    sy = (sy - CAM.y * 0.55 * s.r + CH) % CH;
    const sx = s.x - CAM.x * 0.55 * s.r;
    ctx.globalAlpha = tw;
    ctx.fillStyle = s.c;
    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, 6.2832);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // shooting stars on top of the field
  for (let i = 0; i < METEORS.length; i++){
    const mt = METEORS[i];
    const a = Math.max(0, Math.min(1, mt.life)) * 0.8;
    const spd = Math.sqrt(mt.vx * mt.vx + mt.vy * mt.vy) || 1;
    const nx = mt.vx / spd, ny = mt.vy / spd;
    const tg = ctx.createLinearGradient(mt.x, mt.y, mt.x - nx * mt.len, mt.y - ny * mt.len);
    tg.addColorStop(0, mt.c + a + ')');
    tg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.strokeStyle = tg;
    ctx.lineWidth = 1.7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(mt.x, mt.y);
    ctx.lineTo(mt.x - nx * mt.len, mt.y - ny * mt.len);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
    ctx.beginPath();
    ctx.arc(mt.x, mt.y, 1.7, 0, 6.2832);
    ctx.fill();
  }
}

/* ---------------------------- backglass ---------------------------- */
function tinyText(txt, x, y, size, color, align, ls){
  ctx.font = '600 ' + size + 'px ui-monospace,Menlo,monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'middle';
  ctx.letterSpacing = (ls === undefined ? '1px' : ls);
  ctx.fillStyle = color;
  ctx.fillText(txt, x, y);
  ctx.letterSpacing = '0px';
}

function drawBackglass(){
  ctx.save();
  rr(8, 8, W - 16, HEAD - 16, 16);
  const g = ctx.createLinearGradient(0, 0, 0, HEAD);
  g.addColorStop(0, 'rgba(20,30,70,.96)');
  g.addColorStop(1, 'rgba(7,11,28,.96)');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = 'rgba(96,150,255,.42)';
  ctx.stroke();
  rr(14, 14, W - 28, HEAD - 28, 12);
  ctx.strokeStyle = 'rgba(120,180,255,.10)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  // ---- row 1: rank (left) / stars (mid) / balls (right) ----
  tinyText(RANKS[state.rank], 26, 28, 11, C.orange, 'left', '1.6px');
  // orange rank pips (8 total, lit as you climb)
  for (let i = 0; i < 8; i++){
    const on = i < state.orangeLights;
    ctx.beginPath();
    ctx.arc(30 + i * 9, 42, 2.4, 0, 6.2832);
    if (on){
      ctx.fillStyle = C.orange;
      ctx.shadowColor = 'rgba(255,159,67,.9)';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.strokeStyle = 'rgba(255,159,67,.28)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // stars, centred
  for (let i = 0; i < 3; i++){
    const cx = 214 + i * 22, cy = 28;
    starPath(cx, cy, 8, 0.45);
    if (state.stars[i]){
      ctx.shadowColor = 'rgba(255,215,110,.95)';
      ctx.shadowBlur = 14;
      ctx.fillStyle = C.gold;
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.strokeStyle = 'rgba(120,150,210,.5)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }

  // sound label, top-left under the rank
  tinyText(state.muted ? 'MUTE' : 'SND', 26, 60, 9,
           state.muted ? C.red : 'rgba(150,180,230,.55)', 'left', '1px');
  // 机柜头标：注册名常显（审核截图要求截图内出现小游戏名；背玻璃头标也是弹珠台正宗设计）
  tinyText('弹珠的奔走 · PINBALL STAR', 240, 50, 8, 'rgba(150,190,240,.5)', 'center', '1px');
  // 版本水印（仅小游戏端）：真机上肉眼即可确认跑的是哪一版，避免"改了但没生效"的排查空转
  if (window.__PS_VIEW) tinyText(
    'BUILD ' + (window.__PS_BUILD || '?') + (window.__PS_BACK ? ' · DB1' : (window.__PS_DBFAIL ? ' · DB!' : ' · DB0')),
    240, 62, 7, 'rgba(120,160,215,.45)', 'center', '1px');

  // balls left (right, stacked as pips with a BALL caption)
  ctx.save();
  for (let i = 0; i < 5; i++){
    const cx = W - 34 - i * 17, cy = 28;
    const on = i < Math.min(5, state.ballsLeft);
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, 6.2832);
    if (on){
      ctx.shadowColor = 'rgba(110,220,255,.9)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#9fe8ff';
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.strokeStyle = 'rgba(110,150,220,.3)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }

  ctx.restore();
  tinyText('BALL', W - 26, 46, 8, 'rgba(150,180,230,.45)', 'right', '1px');

  /* live run meter: combo / challenge clock / WARP track. Placed on the bar between
     rank pips and the mission line so it reads while playing without covering anything. */
  if (state.screen === 'play'){
    // combo
    if (state.combo > 1){
      const k = Math.min(1, state.comboT / 2.2);
      ctx.save();
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = '700 11px ui-monospace,Menlo,monospace';
      ctx.fillStyle = state.combo >= 8 ? C.gold : C.cyan;
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
      ctx.fillText('COMBO ×' + state.combo, 96, 72);
      ctx.shadowBlur = 0;
      // decay bar
      ctx.fillStyle = 'rgba(94,231,255,.22)';
      ctx.fillRect(96, 80, 62, 3);
      ctx.fillStyle = state.combo >= 8 ? C.gold : C.cyan;
      ctx.fillRect(96, 80, 62 * k, 3);
      ctx.restore();
    }

    // challenge clock
    if (state.gameMode === 'daily'){
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const t = Math.ceil(state.timeLeft);
      ctx.font = '700 13px ui-monospace,Menlo,monospace';
      ctx.fillStyle = t <= 10 ? C.red : C.gold;
      if (t <= 10){ ctx.shadowColor = C.red; ctx.shadowBlur = 12; }
      ctx.fillText(t + 's', W / 2, 104);
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // WARP track (right side, 4 pips)
    ctx.save();
    for (let i = 0; i < 4; i++){
      const cx = W - 120 + i * 12, cy = 72;
      ctx.beginPath(); ctx.arc(cx, cy, 3, 0, 6.2832);
      if (i < state.warpLevel){
        ctx.fillStyle = C.violet; ctx.shadowColor = C.violet; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0;
      } else {
        ctx.strokeStyle = 'rgba(167,139,250,.35)'; ctx.lineWidth = 1; ctx.stroke();
      }
    }
    tinyText('WARP', W - 158, 72, 7, 'rgba(167,139,250,.6)', 'left', '0.5px');
    ctx.restore();
  }

  // ---- row 2: score ----
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 32px ui-monospace,Menlo,monospace';
  ctx.shadowColor = 'rgba(110,190,255,.85)';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#eaf4ff';
  ctx.fillText(String(state.score).padStart(7, '0'), W / 2, 72);
  ctx.shadowBlur = 0;
  ctx.restore();

  tinyText('×' + state.mult, W - 26, 72, 14,
           state.mult > 1 ? C.gold : 'rgba(150,180,230,.5)', 'right', '0px');

  // REPLAY lamp, the original's red light by the left flipper
  ctx.save();
  ctx.beginPath();
  ctx.arc(30, 72, 5, 0, 6.2832);
  if (state.replay){
    ctx.fillStyle = '#ff4a5e';
    ctx.shadowColor = 'rgba(255,74,94,.95)';
    ctx.shadowBlur = 14;
    ctx.fill();
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = 'rgba(60,14,22,.9)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,74,94,.45)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }
  ctx.restore();
  tinyText('REPLAY', 40, 72, 8,
           state.replay ? '#ff7b8b' : 'rgba(160,110,125,.5)', 'left', '0.5px');

  // ---- row 3: rank ring progress + mission line ----
  // blue ring progress as 4 small pips
  for (let i = 0; i < RANK_LIGHTS; i++){
    const cx = 28 + i * 14, cy = 100;
    const on = i < state.rankLights;
    ctx.beginPath();
    ctx.arc(cx, cy, 4.2, 0, 6.2832);
    if (on){
      ctx.fillStyle = '#6fc4ff';
      ctx.shadowColor = 'rgba(111,196,255,.95)';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.strokeStyle = 'rgba(111,196,255,.35)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }

  // mission / fuel line
  const m = state.mission;
  if (m){
    const st = stageNow();
    const label = m.def.zh + ' ' + (m.stage + 1) + '/' + m.def.stages.length +
                  (st ? '  ' + m.prog + '/' + st.goal : '');
    tinyText(label, 96, 100, 10, C.green, 'left', '0.2px');
    for (let i = 0; i < FUEL_N; i++){
      const cx = 296 + i * 13, cy = 100;
      const on = i < m.fuel;
      ctx.beginPath();
      ctx.arc(cx, cy, 3.6, 0, 6.2832);
      if (on){
        ctx.fillStyle = C.green;
        ctx.shadowColor = 'rgba(94,242,176,.9)';
        ctx.shadowBlur = 7;
        ctx.fill();
        ctx.shadowBlur = 0;
      } else {
        ctx.strokeStyle = 'rgba(94,242,176,.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
    tinyText('FUEL', 396, 100, 8, 'rgba(94,242,176,.55)', 'left', '0.5px');
  } else if (state.selected >= 0){
    const def = missionSlots()[state.selected];
    tinyText('已装填 ' + (def ? def.zh : ''), 96, 100, 11, C.gold, 'left', '0.4px');
    const pulse = 0.5 + 0.5 * Math.sin(state.time * 6);
    ctx.globalAlpha = 0.45 + pulse * 0.55;
    tinyText('上左发射坡道 接取任务', 300, 100, 10, C.cyan, 'left', '0.2px');
    ctx.globalAlpha = 1;
  } else if (state.drill){
    // 教官紧急指令: label + progress + a draining countdown bar, impossible to miss
    const d = state.drill;
    const streak = state.drillStreak >= 2 ? '  连成×' + state.drillStreak : '';
    tinyText('教官指令 ' + d.label + streak, 96, 100, 10, C.orange, 'left', '0.2px');
    const frac = Math.max(0, Math.min(1, d.tLeft / d.total));
    ctx.fillStyle = 'rgba(255,159,67,.22)';
    ctx.fillRect(296, 97, 104, 5);
    ctx.fillStyle = frac > 0.35 ? C.orange : C.red;
    if (frac > 0.35){ ctx.shadowColor = 'rgba(255,159,67,.8)'; ctx.shadowBlur = 8; }
    ctx.fillRect(296, 97, 104 * frac, 5);
    ctx.shadowBlur = 0;
    tinyText(d.prog + '/' + d.goal + ' ' + Math.ceil(d.tLeft) + 's', 408, 100, 9, C.orange, 'left', '0.3px');
  } else {
    /* 指令行：整局永远有一句"现在该干什么"（原版指引的核心） */
    const g = guideNow();
    if (g){
      tinyText(g.text, 96, 100, 10, g.c, 'left', '0.2px');
      if (g.sub){
        ctx.globalAlpha = 0.5 + 0.35 * Math.sin(state.time * 5);
        tinyText(g.sub, 306, 100, 9, 'rgba(150,190,240,.95)', 'left', '0.2px');
        ctx.globalAlpha = 1;
      }
    }
    if (state.tilt > 0){
      ctx.globalAlpha = 0.9;
      tinyText('TILT ' + state.tilt.toFixed(1), 306, 100, 11, C.red, 'left', '1px');
      ctx.globalAlpha = 1;
    }

  /* ---- row 4: 总体任务灯 / 当前任务分区 / 奖励与黑洞状态 ---- */
  ctx.save();
  tinyText('任务链', 26, 122, 7, 'rgba(255,209,102,.55)', 'left', '1px');
  for (let i = 0; i < LAMP_N; i++){
    const cx = 64 + i * 11, cy = 122;
    ctx.beginPath(); ctx.arc(cx, cy, 3.4, 0, 6.2832);
    if (i < state.missionLamps){
      ctx.fillStyle = '#ffd166';

      ctx.shadowBlur = 0;
    } else {
      ctx.strokeStyle = 'rgba(255,209,102,.34)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
  if (state.mission){
    const zid = zoneNow();
    const z = zid ? ZONE_BY_ID[zid] : null;
    if (z){
      const pulse = 0.62 + 0.38 * Math.sin(state.time * 5.5);
      ctx.globalAlpha = pulse;
      tinyText('完成任务区 · ' + z.zh, 118, 122, 8, z.c, 'left', '0.6px');
      ctx.globalAlpha = 1;
    }
  } else if (state.drill){
    tinyText('教官指令中 · 完成后给嘉奖', 118, 122, 8, 'rgba(255,159,67,.7)', 'left', '0.4px');
  } else {
    tinyText('部署: 低蓄力落一层 / 中蓄力补燃料 / 满蓄力出击+5000', 118, 122, 7,
             'rgba(140,175,235,.55)', 'left', '0.3px');

  ctx.restore();
}

/* ---------------------------- 区域示意 (zones) ---------------------------- */
/* 极低透明的虚线分区框 + 分区铭牌，像一张甲板结构图；当前任务所在的分区会脉冲变亮，
   玩家不用读文字也知道该往哪打。 */
function drawZones(){
  const activeId = state.mission ? zoneNow() : null;
  const pul = 0.5 + 0.5 * Math.sin(state.time * 5.5);
  ctx.save();
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 7]);
  for (let i = 0; i < ZONES.length; i++){
    const z = ZONES[i];
    if (z.id === 'upper') continue;      // 二层现在是实体甲板，分区框由甲板自己画
    const on = (z.id === activeId);
    ctx.globalAlpha = on ? (0.40 + pul * 0.45) : 0.085;
    ctx.strokeStyle = z.c;
    rr(z.x, z.y, z.w, z.h, 9);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  for (let i = 0; i < ZONES.length; i++){
    const z = ZONES[i];
    if (z.id === 'upper') continue;
    const on = (z.id === activeId);
    let lx = z.x + 8, ly = z.y + 10;
    let al = 'left';
    if (z.id === 'dock'){ lx = z.x + z.w / 2; ly = z.y + 11; al = 'center'; }
    if (z.id === 'launch'){ lx = z.x + z.w / 2; ly = z.y + 14; al = 'center'; }
    ctx.globalAlpha = on ? 1 : 0.30;
    tinyText(z.zh, lx, ly, on ? 8 : 7, z.c, al, '1.2px');
    if (on){
      ctx.globalAlpha = 0.7;
      tinyText(z.sub, lx, ly + 11, 6, z.c, al, '1px');
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---------------------------- 接任务模组 (mission dock) ---------------------------- */
function drawDock(){
  const d = DOCK;
  const pulse = 0.5 + 0.5 * Math.sin(state.time * 3.4);
  const running = !!state.mission;
  const glowC = running ? '#5ee0ff' : '#ffd166';
  ctx.save();

  // 底座：接地法兰 + 警示虚线环 —— 独立的任务接取站，不再挂在二层平台边
  ctx.fillStyle = 'rgba(10,16,34,.92)';
  ctx.beginPath(); ctx.arc(d.x, d.y + 6, d.r + 12, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(255,209,102,.30)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 5]);
  ctx.beginPath(); ctx.arc(d.x, d.y + 6, d.r + 12, 0, 6.2832); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(0,0,0,.38)';
  ctx.beginPath(); ctx.ellipse(d.x + 3, d.y + 40, 22, 6, 0, 0, 6.2832); ctx.fill();

  // 护柱 ×2: 底座两侧的实体发光柱
  for (let i = 0; i < DOCK_POSTS.length; i++){
    const dp = DOCK_POSTS[i];
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath(); ctx.ellipse(dp.x + 2, dp.y + 8, dp.r + 3, dp.r * 0.42, 0, 0, 6.2832); ctx.fill();
    const pg = ctx.createLinearGradient(dp.x - dp.r, 0, dp.x + dp.r, 0);
    pg.addColorStop(0, '#0c1220'); pg.addColorStop(0.5, '#3a4d78'); pg.addColorStop(1, '#0a0f1c');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(dp.x, dp.y, dp.r, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(255,209,102,' + (0.5 + dp.pop * 0.5) + ')';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#ffd45e'; ctx.shadowBlur = 6 + dp.pop * 14;
    ctx.stroke(); ctx.shadowBlur = 0;
    // 柱顶灯：琥珀呼吸
    ctx.fillStyle = 'rgba(255,' + Math.round(200 + 40 * Math.sin(state.time * 4 + i)) + ',120,.9)';
    ctx.beginPath(); ctx.arc(dp.x, dp.y - dp.r * 0.45, 2.4, 0, 6.2832); ctx.fill();
  }

  const g = ctx.createRadialGradient(d.x, d.y, 3, d.x, d.y, d.r * 2.7);
  g.addColorStop(0, 'rgba(255,255,255,' + (0.10 + d.pop * 0.42) + ')');
  g.addColorStop(0.4, glowC + '44');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 2.7, 0, 6.2832); ctx.fill();

  // rotating hexagon body
  const ang = state.time * 0.5 + d.spin * 4;
  const R = d.r * (1 + d.pop * 0.12);
  ctx.beginPath();
  for (let i = 0; i < 6; i++){
    const a = ang + i * Math.PI / 3;
    const x = d.x + Math.cos(a) * R, y = d.y + Math.sin(a) * R;
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.closePath();
  const body = ctx.createLinearGradient(0, d.y - R, 0, d.y + R);
  body.addColorStop(0, 'rgba(40,56,102,.97)');
  body.addColorStop(1, 'rgba(9,14,30,.97)');
  ctx.fillStyle = body;
  ctx.fill();
  ctx.strokeStyle = glowC;
  ctx.lineWidth = 2;
  ctx.shadowColor = glowC;
  ctx.shadowBlur = 12 + d.pop * 30 + (running ? 0 : pulse * 12);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // core
  ctx.beginPath(); ctx.arc(d.x, d.y, R * 0.56, 0, 6.2832);
  ctx.fillStyle = 'rgba(4,8,20,.92)';
  ctx.fill();
  ctx.strokeStyle = glowC + '99';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 15px ui-monospace,Menlo,monospace';
  ctx.fillStyle = glowC;
  ctx.fillText(running ? '▶' : String(state.dockSlot + 1), d.x, d.y + 1);

  // three slot pips: which mission the module is currently loaded with
  for (let i = 0; i < 3; i++){
    const px = d.x + (i - 1) * 13, py = d.y + 34;
    ctx.beginPath(); ctx.arc(px, py, 3, 0, 6.2832);
    if (i === state.dockSlot && !running){
      ctx.fillStyle = glowC;
      ctx.shadowColor = glowC; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0;
    } else {
      ctx.strokeStyle = 'rgba(255,209,102,.40)';
      ctx.lineWidth = 1; ctx.stroke();
    }
  }

  // caption: what happens if you hit it
  const def = missionSlots()[state.dockSlot];
  const cap = running ? '任务数据 · 撞它加积分'
                      : '撞此接任务 (第 ' + (state.dockSlot + 1) + ' 号)';
  tinyText(cap, d.x, d.y + 47, 7, running ? 'rgba(94,224,255,.8)' : 'rgba(255,209,102,.85)',
           'center', '0.8px');
  if (!running && def){
    tinyText(def.zh, d.x, d.y - 44, 8, '#ffd166', 'center', '1px');
  }
  ctx.restore();
}

/* ---------------------------- 黑洞 ---------------------------- */
/* ============================ 右上星云黑洞 ============================
   原版这块不是"一个紫圈"，而是一团**旋涡状星云**：亮核 + 多层尘带 + 外围辉光。
   我们保留自己的深蓝霓虹语言，但把结构做成星云：三层径向辉光打底，
   再叠两条倾斜的椭圆尘带（随 time 缓慢旋进），最后压一个吸积盘 + 亮核。 */
function drawBlackHole(){
  const h = BLACKHOLE;
  const open = state.bhOpen > 0;
  const hyper = !!(state.reward && state.reward.id === 'hyperhole');
  const t = state.time;
  const pul = 0.5 + 0.5 * Math.sin(t * (open ? 3.4 : 1.3));
  const R = h.ring * (hyper ? 1.45 : 1) * (open ? 1.08 : 0.92);
  ctx.save();

  // ① 外围辉光：三层叠色（洋红 → 紫 → 深蓝），关闭时整体压暗
  const kg = open ? 1 : 0.70;
  const g0 = ctx.createRadialGradient(h.x, h.y, 2, h.x, h.y, R);
  g0.addColorStop(0,    'rgba(255,214,244,' + (0.46 * kg) + ')');
  g0.addColorStop(0.16, 'rgba(236,132,222,' + (0.40 * kg) + ')');
  g0.addColorStop(0.42, 'rgba(146,86,214,' + (0.28 * kg) + ')');
  g0.addColorStop(0.72, 'rgba(74,64,178,' + (0.17 * kg) + ')');
  g0.addColorStop(1,    'rgba(12,10,40,0)');
  ctx.fillStyle = g0;
  ctx.beginPath(); ctx.arc(h.x, h.y, R, 0, 6.2832); ctx.fill();

  /* ② 螺旋臂：原版那团星云是旋涡，不是几条闭合椭圆环
     （闭合环会读成"土星"）。这里用 3 条对数螺旋：半径由内向外递增，
     角度同时累积，压扁成盘面 → 真正的旋涡形态。 */
  for (let arm = 0; arm < 3; arm++){
    const base = arm * 2.0944 + t * 0.30 * (arm % 2 ? -1 : 1);
    ctx.beginPath();
    for (let k = 0; k <= 12; k++){
      const u = k / 12;
      const rr2 = R * (0.16 + u * 0.84);
      const aa = base + u * 2.35;
      const px = h.x + Math.cos(aa) * rr2;
      const py = h.y + Math.sin(aa) * rr2 * 0.74;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = open
      ? 'rgba(255,206,246,' + (0.62 + 0.20 * pul - arm * 0.10) + ')'
      : 'rgba(176,158,240,' + (0.58 - arm * 0.10) + ')';
    ctx.lineWidth = open ? 3.6 - arm * 0.7 : 2.6 - arm * 0.5;
    ctx.lineCap = 'round';
    ctx.stroke();
    /* 螺旋臂上的两处亮斑：星云的"电离结点"，让臂不是一条均匀细线 */
    for (let s2 = 0; s2 < 2; s2++){
      const uu = 0.42 + s2 * 0.34;
      const rr3 = R * (0.16 + uu * 0.84);
      const aa2 = base + uu * 2.35;
      const bx2 = h.x + Math.cos(aa2) * rr3;
      const by2 = h.y + Math.sin(aa2) * rr3 * 0.74;
      ctx.beginPath();
      ctx.arc(bx2, by2, open ? 2.2 : 1.5, 0, 6.2832);
      ctx.fillStyle = open
        ? 'rgba(255,232,252,' + (0.55 + 0.3 * pul) + ')'
        : 'rgba(190,172,244,.5)';
      ctx.fill();
    }
  }

  // ③ 吸积盘边缘：一圈细亮环，只在开启时出现
  if (open){
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r + 3.5, 0, 6.2832);
    ctx.strokeStyle = 'rgba(255,214,246,' + (0.42 + 0.34 * pul) + ')';
    ctx.lineWidth = 1.6;
    ctx.shadowColor = '#ffb6ec';
    ctx.shadowBlur = 14 + h.pop * 22;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // ④ 视界：纯黑圆 + 内侧一圈冷蓝反光（黑洞边缘的引力透镜感）
  ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 6.2832);
  ctx.fillStyle = '#000';
  ctx.fill();
  const rim = ctx.createRadialGradient(h.x, h.y, h.r * 0.55, h.x, h.y, h.r);
  rim.addColorStop(0, 'rgba(0,0,0,0)');
  rim.addColorStop(0.72, 'rgba(48,34,104,' + (open ? 0.62 : 0.42) + ')');
  rim.addColorStop(1, 'rgba(158,128,238,' + (open ? 0.82 : 0.58) + ')');
  ctx.fillStyle = rim;
  ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 6.2832); ctx.fill();
  if (!open){
    ctx.setLineDash([3, 4]);
    ctx.strokeStyle = 'rgba(146,126,206,.45)';
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 6.2832); ctx.stroke();
    ctx.setLineDash([]);
  }

  // ⑤ 亮核：开启时中心一小点白光（被吸进去的物质在发光）
  if (open){
    ctx.globalAlpha = 0.5 + 0.4 * pul;
    ctx.fillStyle = '#fff2fb';
    ctx.shadowColor = '#ffd6f4';
    ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(h.x - h.r * 0.18, h.y - h.r * 0.22, 2.1, 0, 6.2832); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // ⑥ 周围固定星点（原版星云里有一圈碎星）
  const stars = [[-1.5,-1.2,.9],[-1.9,.3,.7],[1.6,-1.4,.8],[2.0,.6,.6],[.4,-2.1,.7],[-.6,1.9,.6],[1.2,1.7,.5]];
  ctx.fillStyle = open ? 'rgba(255,225,250,.55)' : 'rgba(170,160,230,.30)';
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    ctx.beginPath();
    ctx.arc(h.x + s[0] * h.r * 0.9, h.y + s[1] * h.r * 0.9, s[2], 0, 6.2832);
    ctx.fill();
  }

  ctx.globalAlpha = open ? 0.95 : 0.42;
  tinyText(open ? '黑洞 ' + Math.ceil(state.bhOpen) + 's' : '黑洞 关闭',
           h.x, h.y + R * 0.78, 7,
           open ? '#c9b6ff' : 'rgba(150,140,200,.62)', 'center', '1px');
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---------------------------- 虫洞连线 ---------------------------- */
function drawWarpLink(){
  const L = state.warpLink;
  if (!L) return;
  const a = WORMS[L.a], b = WORMS[L.b];
  if (!a || !b) return;
  const k = Math.max(0, Math.min(1, L.t / 0.9));
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - 34;
  ctx.save();
  ctx.globalAlpha = k * 0.85;
  ctx.strokeStyle = b.c;
  ctx.lineWidth = 1.6;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.quadraticCurveTo(mx, my, b.x, b.y);
  ctx.stroke();
  ctx.setLineDash([]);
  const t = 1 - k;
  const px = (1-t)*(1-t)*a.x + 2*(1-t)*t*mx + t*t*b.x;
  const py = (1-t)*(1-t)*a.y + 2*(1-t)*t*my + t*t*b.y;
  ctx.beginPath(); ctx.arc(px, py, 3, 0, 6.2832);
  ctx.fillStyle = b.c;
  ctx.shadowColor = b.c;
  ctx.shadowBlur = 12;
  ctx.fill();
  ctx.restore();
}
